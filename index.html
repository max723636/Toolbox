<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--ac:var(--acl,#4f46e5);--ac2:color-mix(in srgb,var(--ac) 12%,var(--cd));--on:#fff;--bd:#e4e7f0;--er:#dc2626;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}}
:root[data-theme="dark"]{--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}header p{margin:0;font-size:13px;color:var(--mu)}
.logo,.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac);color:var(--on);flex:none}
.ib{background:var(--ac2);color:var(--ac)}.ib.sm{width:36px;height:36px;border-radius:10px}
main{padding:4px 16px 40px;max-width:640px;margin:auto}
#menu{display:grid;gap:10px}
.card,.sty,.item,.dt,.pick{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;color:inherit;font:inherit;cursor:pointer}
.card>svg{color:var(--mu)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600}
.tx small{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
input[type=color]{padding:3px;height:44px}
textarea{resize:vertical}
.btn,.iconbtn,.seg button{font:inherit;font-weight:600;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;margin-top:14px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn:disabled{opacity:.45}
.btn.warn,.iconbtn.warn{color:var(--er);border-color:var(--er)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;font-size:12px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.grid2 .btn,.grid2 .pick{margin-top:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--ac2);border-radius:12px}
.seg button{flex:1;padding:9px;border:0;background:none;color:var(--mu)}.seg .on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;font-size:14px;font-weight:500;color:var(--tx);border-style:dashed;cursor:pointer;text-align:center}
.pick svg{color:var(--ac)}
.chip{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.st{margin:10px 0 0;font-size:13px;color:var(--mu)}.err{color:var(--er)}
.foot{display:flex;gap:8px;align-items:center;margin:22px 0 0;font-size:12px;color:var(--mu)}.foot svg{flex:none}
.qr{display:flex;justify-content:center;margin:16px 0 0;padding:14px;background:#fff;border-radius:var(--r);border:1px solid var(--bd)}.qr:empty{display:none}
.qr img,.qr canvas{max-width:100%;height:auto}
.rows,.list{display:grid;gap:10px;margin-top:14px}
.sty,.item{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.out{font-size:19px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.dt{margin-top:18px;padding:4px 14px 16px}.dt summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;align-items:center;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;color:var(--mu);margin-bottom:2px}
.crumbs button{font:inherit;font-size:13px;background:none;border:0;color:var(--mu);padding:4px 6px;border-radius:8px;cursor:pointer}.crumbs .on{color:var(--tx);font-weight:600}
.itb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow .btn{width:auto;margin:0}
.empty{text-align:center;color:var(--mu);padding:32px 12px}
.ti{font-size:18px;font-weight:600;margin-top:14px}.bd{min-height:46vh;margin-top:10px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.2s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sws{display:flex;gap:12px;margin-top:2px}.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--cd);cursor:pointer;box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
#gear{margin-left:auto}.vt{font-size:20px;font-weight:700;margin:16px 0 8px;overflow-wrap:anywhere}
.vb{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;min-height:30vh}.vb a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
#bk{margin-top:28px}#bk h2{font-size:15px;font-weight:700;margin:0}#bk h2+.st{margin-top:2px}
.pick{position:relative}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-top:10px}
.ms{display:flex;flex-direction:column;gap:8px;height:50vh;overflow-y:auto;padding:12px;margin-top:12px;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r)}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--ac2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--ac);color:var(--on)}
.bub.sy{align-self:center;background:none;color:var(--mu);font-size:12px;padding:2px;text-align:center}
.bub small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.cin{display:flex;gap:8px;margin-top:10px}.cin .btn{width:auto;margin:0}
/* Video-Tool */
.vpv{position:relative;margin:14px auto 0;width:min(100%,calc(52vh*var(--ar,.5625)));aspect-ratio:var(--ar,.5625);background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd)}
.vpv .vvid,.vpv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.ov{position:absolute;inset:0;user-select:none;-webkit-user-select:none}
.ov .sh{position:absolute;background:rgba(0,0,0,.62);pointer-events:none}
.rb{position:absolute;border:2px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(0,0,0,.55);pointer-events:none}
.rb.sel{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 24%,transparent)}
.rb span{position:absolute;left:3px;top:0;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.hd{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ac);border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6)}
.hd.a{left:-9px;top:-9px}.hd.b{right:-9px;top:-9px}.hd.c{left:-9px;bottom:-9px}.hd.d{right:-9px;bottom:-9px}
.tl{display:flex;align-items:center;gap:8px;margin-top:10px}.tl input{flex:1}
input[type=range]{padding:0;border:0;background:none;height:30px;accent-color:var(--ac)}input[type=range]:focus{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipb{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}.chipb.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.kc{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--cd)}.kc button{font:inherit;font-size:13px;padding:7px 11px;border:0;background:none;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center}.kc button+button{border-left:1px solid var(--bd);color:var(--mu);padding:7px 9px}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px;margin:16px 0 0}.chk input{width:20px;height:20px;padding:0;accent-color:var(--ac)}
.prog{height:10px;border-radius:99px;background:var(--ac2);overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.res{margin-top:16px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#000;display:grid;place-items:center}.res img,.res video{max-width:100%;max-height:60vh;display:block}
.lock{pointer-events:none;opacity:.55}
.stk.on{position:sticky;z-index:4;background:var(--bg);padding-bottom:6px}.stk.on .vpv{width:min(100%,calc(36vh*var(--ar,.5625)));margin-top:0}
.dt summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-top:-3px;flex:none}.dt[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.btn:disabled{pointer-events:none}
.grid2:has(>#vqw[hidden]){grid-template-columns:1fr}
[hidden]{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header><button id="back" class="iconbtn" hidden aria-label="Zurück"></button><div class="logo" id="logo"></div><div><h1 id="title">Toolbox</h1><p id="sub">Deine Werkzeuge an einem Ort</p></div><button id="gear" class="iconbtn" aria-label="Einstellungen"></button></header>
<main><div id="menu"></div><div id="view" hidden></div>
<section id="bk"><h2>Backup</h2><p class="st">Notizen und eigene Stile als Datei sichern oder wiederherstellen.</p>
<div class="grid2"><button id="bke" class="btn"></button><button id="bkl" class="btn"></button></div><input id="bki" type="file" accept=".json,application/json" hidden><p id="bks" class="st"></p></section></main>
<div id="toast"></div>

const OK='gif png jpg jpeg webp mp4 webm txt json md docx pptx epub csv ttf html svg pdf xlsx zip'.split(' ');
async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  if(DL){
    if(!OK.includes(name.split('.').pop().toLowerCase()))name+='.txt';
    try{await DL.save({filename:name,data:blob});return name}
    catch(e){if(e&&e.code==='declined')return null;throw Error('Speichern nicht möglich ('+((e&&e.code)||'Fehler')+')')}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4e4);return name;
}

/* ---------- Krypto (Web Crypto, Schlüssel per PBKDF2) ---------- */
const ALGS={aes256gcm:{n:'AES-256-GCM (empfohlen)',a:'AES-GCM',l:256,iv:12,id:1},aes128gcm:{n:'AES-128-GCM',a:'AES-GCM',l:128,iv:12,id:2},aes256cbc:{n:'AES-256-CBC',a:'AES-CBC',l:256,iv:16,id:3},aes256ctr:{n:'AES-256-CTR',a:'AES-CTR',l:256,iv:16,id:4}};
async function deriveKey(pw,salt,it,al){
  const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,{name:al.a,length:al.l},false,['encrypt','decrypt']);
}
const prm=(al,iv)=>al.a==='AES-CTR'?{name:al.a,counter:iv,length:64}:{name:al.a,iv};
async function encryptBytes(name,data,pw,alg){
  const al=ALGS[alg],IT=600000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(al.iv));
  const nb=enc.encode(name),p=new Uint8Array(6+nb.length+data.length);
  p.set(enc.encode('TBXP'));new DataView(p.buffer).setUint16(4,nb.length);p.set(nb,6);p.set(data,6+nb.length);
  const ct=new Uint8Array(await crypto.subtle.encrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),p));
  const h=new Uint8Array(25+al.iv);h.set(enc.encode('TBX1'));h[4]=al.id;new DataView(h.buffer).setUint32(5,IT);h.set(salt,9);h.set(iv,25);
  return new Blob([h,ct]);
}
async function decryptBytes(buf,pw){
  const u=new Uint8Array(buf);
  if(dec.decode(u.slice(0,4))!=='TBX1')throw Error('Das ist keine mit dieser App verschlüsselte Datei.');
  const al=Object.values(ALGS).find(a=>a.id===u[4]);if(!al)throw Error('Unbekanntes Verfahren.');
  const IT=new DataView(buf).getUint32(5),salt=u.slice(9,25),iv=u.slice(25,25+al.iv),bad='Falsches Passwort oder beschädigte Datei.';
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),u.slice(25+al.iv)))}catch(e){throw Error(bad)}
  if(dec.decode(p.slice(0,4))!=='TBXP')throw Error(bad);
  const nl=new DataView(p.buffer).getUint16(4);
  return{name:dec.decode(p.slice(6,6+nl)),data:p.slice(6+nl)};
}

/* ---------- Tool 2: Verschlüsseln / Entschlüsseln ---------- */
tool({icon:'lock',title:'Verschlüsseln',desc:'Dateien & Ordner mit Passwort schützen',mount(el){
  el.innerHTML=`<div class="seg"><button class="on" data-m="e">Verschlüsseln</button><button data-m="d">Entschlüsseln</button></div>
  <div class="grid2"><div class="pick">${ico('file',22)}<span>Dateien wählen</span><input id="f" type="file" multiple></div><div class="pick" id="fl">${ico('folder',22)}<span>Ordner wählen</span><input id="fo" type="file" webkitdirectory multiple></div></div>
  <p id="sel" class="chip">Nichts ausgewählt (Ordner-Auswahl klappt nicht auf jedem Gerät)</p>
  <label>Passwort</label><input id="p" type="password" autocomplete="new-password">
  <div id="p2l"><label>Passwort wiederholen</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div id="al"><label>Verfahren</label><select id="a">${Object.entries(ALGS).map(([k,v])=>`<option value="${k}"${k===SET.alg?' selected':''}>${v.n}</option>`).join('')}</select></div>
  <button id="go" class="btn pri">Verschlüsseln</button><p id="st" class="st"></p>
  <p class="foot">${ico('lock',14)}<span>Alles läuft nur auf deinem Gerät. Schlüsselableitung: PBKDF2, 600.000 Runden.</span></p>`;
  const q=s=>$(s,el),st=q('#st'),sel=q('#sel'),go=q('#go');let mode='e',files=[];
  const setFiles=fl=>{files=[...fl];const tot=files.reduce((s,f)=>s+f.size,0);
    sel.textContent=files.length?(files.length>1?files.length+' Dateien':files[0].name)+' · '+(tot/1048576).toFixed(1)+' MB':'Nichts ausgewählt'};
  [q('#f'),q('#fo')].forEach(i=>i.onchange=()=>{if(i.files.length)setFiles(i.files);i.value=''});
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
    el.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
    q('#fl').hidden=q('#p2l').hidden=q('#al').hidden=mode==='d';
    go.textContent=mode==='e'?'Verschlüsseln':'Entschlüsseln';files=[];sel.textContent='Nichts ausgewählt';say(st,'')});
  go.onclick=async()=>{
    const pw=q('#p').value;
    if(!files.length)return say(st,'Bitte zuerst Datei(en) wählen.',1);
    if(!pw)return say(st,'Bitte ein Passwort eingeben.',1);
    go.disabled=true;say(st,'Arbeite … (große Dateien brauchen etwas)');
    try{
      if(mode==='e'){
        if(pw!==q('#p2').value)throw Error('Die Passwörter stimmen nicht überein.');
        let name,data;
        if(files.length===1&&!files[0].webkitRelativePath){name=files[0].name;data=new Uint8Array(await files[0].arrayBuffer())}
        else{
          if(typeof JSZip==='undefined')throw Error('ZIP-Modul nicht geladen (Internet nötig).');
          const z=new JSZip();files.forEach(f=>z.file(f.webkitRelativePath||f.name,f));
          name=(files[0].webkitRelativePath.split('/')[0]||'Dateien')+'.zip';
          data=await z.generateAsync({type:'uint8array',compression:'STORE'});
        }
        const out=await encryptBytes(name,data,pw,q('#a').value);
        done(st,name+'.enc',await saveFile(name+'.enc',out));
      }else{
        const r=await decryptBytes(await files[0].arrayBuffer(),pw);
        done(st,r.name,await saveFile(r.name,new Blob([r.data])));
      }
    }catch(e){say(st,e.message,1)}
    go.disabled=false;
  };
}});

['Doppelstrich',rg(0x1D538,0x1D552,0x1D7D8,{C:'ℂ',H:'ℍ',N:'ℕ',P:'ℙ',Q:'ℚ',R:'ℝ',Z:'ℤ'})],
['Sans',rg(0x1D5A0,0x1D5BA,0x1D7E2)],['Sans fett',rg(0x1D5D4,0x1D5EE,0x1D7EC)],['Sans kursiv',rg(0x1D608,0x1D622)],['Sans fett kursiv',rg(0x1D63C,0x1D656)],
['Monospace',rg(0x1D670,0x1D68A,0x1D7F6)],['Breit',ch(c=>c===' '?'\u3000':rg(0xFF21,0xFF41,0xFF10)(c))],

['Kopfüber',t=>t.split('\n').map(l=>[...mp('ɐqɔpǝɟƃɥᴉɾʞlɯuodbɹsʇnʌʍxʎz')(l)].reverse().join('')).join('\n')],

tool({icon:'note',title:'Notizen',desc:'Notizen in Ordnern sortieren',mount(el){

  const kids=id=>[id,...D.f.filter(f=>f.p===id).flatMap(f=>kids(f.id))];

const CH={step:'start',msgs:[],code:'',peer:'',open:false,wait:0,err:'',name:store.get('tb_chat',{}).n||'',upd(){}};
const b64=u=>btoa(String.fromCharCode(...u));
async function pack(sdp){const j=enc.encode(JSON.stringify({s:sdp}));
  if(window.CompressionStream){const r=new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('deflate-raw')));return 'z'+b64(new Uint8Array(await r.arrayBuffer()))}

  return JSON.parse(t).s}
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,6000)});

async function accept(c){c=c.trim();if(/^TBO/.test(c))throw Error('Das ist eine Einladung (TBO), kein Antwortcode. Die andere Person muss „Einladung erhalten“ wählen, DEINEN Code von oben einfügen und dir den Code zurückschicken, der mit TBA beginnt.');if(!/^TBA/.test(c))throw Error('Das ist kein Antwortcode (er beginnt mit TBA).');

async function join(c){c=c.trim();if(/^TBA/.test(c))throw Error('Das ist ein Antwortcode (TBA). Hier gehört die Einladung (TBO) der anderen Person hinein.');if(!/^TBO/.test(c))throw Error('Das ist kein Einladungscode (er beginnt mit TBO).');

/* ---------- Video-Tool ---------- */
/* ---------- Video-Tool, Teil 1: Wasserzeichen entfernen und verfolgen ---------- */
const VTP=(()=>{
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* Position eines Bereichs zu einem Zeitpunkt. Koordinaten 0..1 relativ zum ganzen Bild. */
function rectAt(reg,t){
  const k=reg.kf,n=k.length;
  if(!n)return null;
  if(n===1||t<=k[0].t)return k[0];
  if(t>=k[n-1].t)return k[n-1];
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(k[m].t<=t)lo=m;else hi=m}
  const a=k[lo],b=k[hi];
  if(reg.mode==='jump')return a;
  const f=(t-a.t)/((b.t-a.t)||1);
  return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,w:a.w+(b.w-a.w)*f,h:a.h+(b.h-a.h)*f};
}

const luma=(d,w,h)=>{const L=new Uint8Array(w*h);for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return L};

/* Minimum-/Maximum-Filter (rechteckig, getrennt in zwei Durchgängen) */
function minmax(src,w,h,r,isMax){
  const tmp=new Uint8Array(w*h),out=new Uint8Array(w*h),init=isMax?0:255;
  for(let y=0;y<h;y++){const o=y*w;for(let x=0;x<w;x++){let v=init;const a=x-r<0?0:x-r,b=x+r>=w?w-1:x+r;
    for(let k=a;k<=b;k++){const s=src[o+k];if(isMax?s>v:s<v)v=s}tmp[o+x]=v}}
  for(let x=0;x<w;x++){for(let y=0;y<h;y++){let v=init;const a=y-r<0?0:y-r,b=y+r>=h?h-1:y+r;
    for(let k=a;k<=b;k++){const s=tmp[k*w+x];if(isMax?s>v:s<v)v=s}out[y*w+x]=v}}
  return out;
}

/* Maske der zu füllenden Pixel (1 = füllen). [ix0,ix1)x[iy0,iy1) ist das Rechteck im Ausschnitt. */
function buildMask(L,gw,gh,ix0,iy0,ix1,iy1,method,thr,r,dil){
  const m=new Uint8Array(gw*gh);
  if(method==='rect'){for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++)m[y*gw+x]=1;return m}
  const op=(method==='light'||method==='both')?minmax(minmax(L,gw,gh,r,false),gw,gh,r,true):null;   // Öffnen: helle Details weg
  const cl=(method==='dark'||method==='both')?minmax(minmax(L,gw,gh,r,true),gw,gh,r,false):null;    // Schließen: dunkle Details weg
  const raw=new Uint8Array(gw*gh);
  for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++){const i=y*gw+x;
    if((op&&L[i]-op[i]>thr)||(cl&&cl[i]-L[i]>thr))raw[i]=255}
  const d=dil>0?minmax(raw,gw,gh,dil,true):raw;
  for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++){const i=y*gw+x;if(d[i])m[i]=1}
  return m;
}

/* Füllt maskierte Pixel aus den nächsten gültigen Pixeln in 4 Richtungen (wie ffmpeg „delogo“, aber für beliebige Masken) */
function inpaint(d,w,h,m,passes){
  const n=w*h,Lx=new Int16Array(n),Rx=new Int16Array(n),Uy=new Int16Array(n),Dy=new Int16Array(n);
  for(let y=0;y<h;y++){let a=-1;for(let x=0;x<w;x++){const i=y*w+x;if(!m[i])a=x;Lx[i]=a}
    a=-1;for(let x=w-1;x>=0;x--){const i=y*w+x;if(!m[i])a=x;Rx[i]=a}}
  for(let x=0;x<w;x++){let a=-1;for(let y=0;y<h;y++){const i=y*w+x;if(!m[i])a=y;Uy[i]=a}
    a=-1;for(let y=h-1;y>=0;y--){const i=y*w+x;if(!m[i])a=y;Dy[i]=a}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!m[i])continue;
    let r=0,g=0,b=0,s=0,p,wt,j;
    p=Lx[i];if(p>=0){wt=1/((x-p)*(x-p));j=(y*w+p)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Rx[i];if(p>=0){wt=1/((p-x)*(p-x));j=(y*w+p)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Uy[i];if(p>=0){wt=1/((y-p)*(y-p));j=(p*w+x)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Dy[i];if(p>=0){wt=1/((p-y)*(p-y));j=(p*w+x)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    if(s>0){j=i*4;d[j]=r/s;d[j+1]=g/s;d[j+2]=b/s;d[j+3]=255}
  }
  for(let k=0;k<passes;k++)for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!m[i])continue;
    const a=(x>0?i-1:i)*4,b=(x<w-1?i+1:i)*4,c=(y>0?i-w:i)*4,e=(y<h-1?i+w:i)*4,j=i*4;
    d[j]=(d[j]+(d[a]+d[b]+d[c]+d[e])/4)/2;d[j+1]=(d[j+1]+(d[a+1]+d[b+1]+d[c+1]+d[e+1])/4)/2;d[j+2]=(d[j+2]+(d[a+2]+d[b+2]+d[c+2]+d[e+2])/4)/2;
  }
}

/* Feines Rauschen wie in der Umgebung, damit die Fläche nicht „glatt wie Plastik“ wirkt */
function addGrain(d,w,h,m){
  const n=w*h,m8=new Uint8Array(n);for(let i=0;i<n;i++)m8[i]=m[i]?255:0;
  const dm=minmax(m8,w,h,3,true);let s=0,c=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(m[i]||!dm[i])continue;
    let a=0;for(let v=-1;v<=1;v++)for(let u=-1;u<=1;u++){const k=((y+v)*w+x+u)*4;a+=(d[k]*77+d[k+1]*150+d[k+2]*29)>>8}
    const j=i*4,hp=((d[j]*77+d[j+1]*150+d[j+2]*29)>>8)-a/9;s+=hp*hp;c++}
  if(c<8)return;
  const sg=Math.min(10,Math.sqrt(s/c)*1.1);if(sg<0.8)return;
  let seed=(Math.random()*2147483647)|0||1;
  const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};
  for(let i=0;i<n;i++)if(m[i]){const z=(rnd()+rnd()+rnd()-1.5)*2*sg,j=i*4;d[j]+=z;d[j+1]+=z;d[j+2]+=z}
}

/* Einen Bereich auf der Zeichenfläche entfernen. rc in Pixeln der Zeichenfläche, wm = {method,sens,pad,grain} */
function applyRegion(ctx,W,H,rc,wm){
  const pad=(wm.method==='rect'?1:0)+(wm.pad||0);
  const x0=clamp(Math.floor(rc.x)-pad,0,W),y0=clamp(Math.floor(rc.y)-pad,0,H),x1=clamp(Math.ceil(rc.x+rc.w)+pad,0,W),y1=clamp(Math.ceil(rc.y+rc.h)+pad,0,H);
  if(x1-x0<2||y1-y0<2)return;
  const M=wm.method==='rect'?2:8,gx0=Math.max(0,x0-M),gy0=Math.max(0,y0-M),gx1=Math.min(W,x1+M),gy1=Math.min(H,y1+M),gw=gx1-gx0,gh=gy1-gy0;
  const id=ctx.getImageData(gx0,gy0,gw,gh),d=id.data;
  const L=wm.method==='rect'?null:luma(d,gw,gh);
  const r=clamp(Math.round(Math.min(x1-x0,y1-y0)*0.12),2,8),dil=clamp(Math.round(r*0.5),1,3),thr=Math.round(70-0.6*(wm.sens==null?50:wm.sens));
  const m=buildMask(L,gw,gh,x0-gx0,y0-gy0,x1-gx0,y1-gy0,wm.method,thr,r,dil);
  inpaint(d,gw,gh,m,2);
  if(wm.grain!==false)addGrain(d,gw,gh,m);
  ctx.putImageData(id,gx0,gy0);
}

/* ----- Verfolgung: Kantenbild + normierte Kreuzkorrelation ----- */
function sobel(g,w,h){
  const o=new Float32Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    const gx=g[i-w+1]+2*g[i+1]+g[i+w+1]-g[i-w-1]-2*g[i-1]-g[i+w-1];
    const gy=g[i+w-1]+2*g[i+w]+g[i+w+1]-g[i-w-1]-2*g[i-w]-g[i-w+1];
    o[i]=Math.abs(gx)+Math.abs(gy)}
  return o;
}
function integral(E,w,h){
  const W1=w+1,S=new Float64Array(W1*(h+1)),Q=new Float64Array(W1*(h+1));
  for(let y=0;y<h;y++){let rs=0,rq=0;for(let x=0;x<w;x++){const v=E[y*w+x];rs+=v;rq+=v*v;const i=(y+1)*W1+x+1;S[i]=S[i-W1]+rs;Q[i]=Q[i-W1]+rq}}
  return{S,Q};
}
function makeTemplate(E,w,x,y,tw,th){
  const T=new Float32Array(tw*th);let s=0;
  for(let v=0;v<th;v++)for(let u=0;u<tw;u++){const val=E[(y+v)*w+x+u];T[v*tw+u]=val;s+=val}
  const mean=s/(tw*th);let ss=0;
  for(let i=0;i<T.length;i++){T[i]-=mean;ss+=T[i]*T[i]}
  return{T,tw,th,ss};
}
function zncc(t,E,w,S,Q,px,py){
  const{tw,th,ss,T}=t,N=tw*th,W1=w+1;
  const a=py*W1+px,b=a+tw,c=(py+th)*W1+px,d=c+tw;
  const sum=S[d]-S[b]-S[c]+S[a],sq=Q[d]-Q[b]-Q[c]+Q[a],varN=sq-sum*sum/N;
  if(varN<1e-3||ss<1e-3)return -1;
  let cross=0;
  for(let v=0;v<th;v++){const o=(py+v)*w+px,to=v*tw;for(let u=0;u<tw;u++)cross+=T[to+u]*E[o+u]}
  return cross/Math.sqrt(ss*varN);
}
function bestMatch(t,E,w,h,S,Q,cx,cy,R,stride){
  const xmin=Math.max(0,cx-R),xmax=Math.min(w-t.tw,cx+R),ymin=Math.max(0,cy-R),ymax=Math.min(h-t.th,cy+R);
  let best=-2,bx=clamp(cx,0,w-t.tw),by=clamp(cy,0,h-t.th);
  for(let py=ymin;py<=ymax;py+=stride)for(let px=xmin;px<=xmax;px+=stride){const s=zncc(t,E,w,S,Q,px,py);if(s>best){best=s;bx=px;by=py}}
  return{x:bx,y:by,s:best};
}

return{rectAt,luma,minmax,buildMask,inpaint,addGrain,applyRegion,sobel,integral,makeTemplate,zncc,bestMatch,clamp};
})();

/* ---------- Video-Tool, Teil 2: Laden, Umwandeln (GIF / MP4 / WebM), Verfolgen ---------- */
const VTE=(()=>{
const{rectAt,applyRegion,clamp}=VTP;
const tick=ms=>new Promise(r=>setTimeout(r,ms));
const ABORT='abbruch';
const even=n=>Math.max(2,Math.round(n/2)*2);

/* Zu einem Zeitpunkt springen und warten, bis das Bild bereit ist */
function seek(v,t){
  return new Promise(res=>{
    const max=isFinite(v.duration)?v.duration-0.001:t;t=Math.max(0,Math.min(t,max));
    if(Math.abs(v.currentTime-t)<0.0005&&v.readyState>=2)return res();
    let end=false;const fin=()=>{if(end)return;end=true;v.removeEventListener('seeked',fin);clearTimeout(to);res()};
    const to=setTimeout(fin,6000);v.addEventListener('seeked',fin);v.currentTime=t;
  });
}

/* Videodatei in ein <video> laden */
async function loadVideo(file){
  const url=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(Error('Dieses Videoformat kann nicht gelesen werden.'));setTimeout(()=>rej(Error('Das Video lädt zu lange.')),25000)});
  }catch(e){URL.revokeObjectURL(url);throw e}
  if(!isFinite(v.duration)){   // Aufnahmen ohne Längenangabe
    await new Promise(r=>{v.ondurationchange=()=>{if(isFinite(v.duration)){v.ondurationchange=null;r()}};v.currentTime=1e7;setTimeout(r,4000)});
    await seek(v,0);
  }
  if(!v.videoWidth||!isFinite(v.duration)||v.duration<=0){URL.revokeObjectURL(url);throw Error('In dieser Datei ist kein lesbares Video.')}
  return{v,url,dur:v.duration,vw:v.videoWidth,vh:v.videoHeight};
}

/* Bildrate grob messen (kurz abspielen) */
function estimateFps(v){
  return new Promise(res=>{
    if(!v.requestVideoFrameCallback)return res(30);
    const ts=[];let fin=false;
    const done=()=>{if(fin)return;fin=true;try{v.pause()}catch(e){}
      const u=[...new Set(ts)].sort((a,b)=>a-b),d=[];for(let i=1;i<u.length;i++)d.push(u[i]-u[i-1]);
      let f=30;
      if(d.length>=4){const s=[...d].sort((a,b)=>a-b),m=s[s.length>>1],g=d.filter(x=>x<m*1.5),mean=g.reduce((a,b)=>a+b,0)/g.length;f=1/mean}
      let bc=0,bd=0.012;for(const c of[23.976,24,25,29.97,30,50,59.94,60]){const e=Math.abs(f-c)/c;if(e<bd){bd=e;bc=c}}if(bc)f=bc;
      if(f<4||f>121)f=30;
      v.currentTime=0;setTimeout(()=>res(f),60)};
    const cb=(n,md)=>{ts.push(md.mediaTime);if(ts.length<24&&!fin)v.requestVideoFrameCallback(cb);else done()};
    v.requestVideoFrameCallback(cb);v.play().catch(done);setTimeout(done,1800);
  });
}

/* Bild für die Ausgabe: zuschneiden, skalieren, Wasserzeichen entfernen */
function makeProc(v,P){
  const vw=v.videoWidth,vh=v.videoHeight,c=P.crop||{l:0,t:0,r:0,b:0};
  const sx=c.l*vw,sy=c.t*vh,sw=vw*(1-c.l-c.r),sh=vh*(1-c.t-c.b);
  const cv=document.createElement('canvas');cv.width=P.W;cv.height=P.H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingQuality='high';
  return{cv,ctx,draw(t){
    ctx.drawImage(v,sx,sy,sw,sh,0,0,P.W,P.H);
    for(const reg of P.regions||[]){const r=rectAt(reg,t);if(!r)continue;
      applyRegion(ctx,P.W,P.H,{x:(r.x*vw-sx)/sw*P.W,y:(r.y*vh-sy)/sh*P.H,w:r.w*vw/sw*P.W,h:r.h*vh/sh*P.H},P.wm||{method:'rect'})}
  }};
}

/* Planung: Größe, Bildrate, Zeitpunkte */
function plan(info,opt){
  const c=opt.crop||{l:0,t:0,r:0,b:0},cw=info.vw*(1-c.l-c.r),ch=info.vh*(1-c.t-c.b);
  const start=clamp(opt.start||0,0,Math.max(0,info.dur-0.05)),end=clamp(opt.end||info.dur,start+0.05,info.dur),dur=end-start;
  const src=info.fps||30;let fps=opt.fps||(opt.fmt==='gif'?12:src);fps=Math.min(fps,src,opt.fmt==='gif'?30:60);
  const n=Math.max(1,Math.floor(dur*fps+1e-6));
  const W0=opt.width?Math.min(opt.width,cw):(opt.fmt==='gif'?Math.min(cw,480):Math.min(cw,1920));
  const asp=ch/cw;
  return{start,end,dur,fps,n,W0,asp,cw,ch,at:i=>start+i/fps+0.002};
}
const dims=(W0,asp)=>{const W=even(W0);return{W,H:even(W*asp)}};

const needEnc=()=>{if(typeof VideoEncoder==='undefined'||typeof VideoFrame==='undefined')throw Error('Dein Browser kann MP4/WebM nicht erzeugen (WebCodecs fehlt). GIF geht trotzdem.')};
const chk=(ab)=>{if(ab&&ab())throw Error(ABORT)};

/* ---------- GIF ---------- */
async function gifPass(v,P,pl,prog,ab,label){
  const{GIFEncoder,quantize,applyPalette}=gifenc,proc=makeProc(v,P),gif=GIFEncoder();
  let prev=0;
  for(let i=0;i<pl.n;i++){
    chk(ab);const t=pl.at(i);await seek(v,t);proc.draw(t);
    const d=proc.ctx.getImageData(0,0,P.W,P.H).data,pal=quantize(d,256),idx=applyPalette(d,pal);
    const cs=Math.round((i+1)*100/pl.fps),delay=Math.max(2,cs-prev)*10;prev=cs;
    gif.writeFrame(idx,P.W,P.H,{palette:pal,delay});
    prog((i+1)/pl.n,label+'Bild '+(i+1)+' von '+pl.n);
  }
  gif.finish();
  return new Blob([gif.bytes()],{type:'image/gif'});
}
async function gifEstimate(v,P,pl,ab){   // Größe grob schätzen: einige Bilder einzeln kodieren
  const{GIFEncoder,quantize,applyPalette}=gifenc,proc=makeProc(v,P),K=Math.min(6,pl.n);let sum=0;
  for(let j=0;j<K;j++){chk(ab);const t=pl.at(Math.floor((j+0.5)*pl.n/K));await seek(v,t);proc.draw(t);
    const d=proc.ctx.getImageData(0,0,P.W,P.H).data,pal=quantize(d,256),g=GIFEncoder();
    g.writeFrame(applyPalette(d,pal),P.W,P.H,{palette:pal,delay:80});g.finish();sum+=g.bytes().length-40}
  return sum/K*pl.n;
}
async function convertGif(v,info,opt,hooks){
  const prog=hooks.progress||(()=>{}),ab=hooks.aborted,pl=plan(info,opt),notes=[],max=opt.maxMB?opt.maxMB*1e6:0;
  let W0=pl.W0;
  const mk=w=>{const d=dims(w,pl.asp);return{W:d.W,H:d.H,crop:opt.crop,regions:opt.regions,wm:opt.wm}};
  if(max){
    prog(0,'Größe wird geschätzt …');
    let P=mk(W0),est=await gifEstimate(v,P,pl,ab);
    if(est>max*0.9){W0=Math.max(64,W0*Math.sqrt(max*0.88/est));P=mk(W0);est=await gifEstimate(v,P,pl,ab);
      if(est>max*0.95)W0=Math.max(64,W0*Math.sqrt(max*0.88/est))}
  }
  let blob,P,tries=max?3:1;
  for(let k=1;k<=tries;k++){
    P=mk(W0);blob=await gifPass(v,P,pl,prog,ab,tries>1&&k>1?'Versuch '+k+' · ':'');
    if(!max||blob.size<=max||P.W<=64)break;
    W0=Math.max(64,W0*Math.sqrt(max/blob.size)*0.92);
  }
  if(max&&P.W<even(pl.W0)-1)notes.push('Die Breite wurde automatisch auf '+P.W+' px verkleinert, damit die Datei möglichst unter '+String(opt.maxMB).replace('.',',')+' MB bleibt.');
  if(max&&blob.size>max)notes.push('Die gewünschte Größe wurde nicht ganz erreicht – wähle weniger Bilder pro Sekunde oder einen kürzeren Ausschnitt.');
  return{blob,W:P.W,H:P.H,fps:pl.fps,ext:'gif',notes};
}

/* ---------- MP4 / WebM ---------- */
const avcLevel=(W,H,fps)=>{const mb=Math.ceil(W/16)*Math.ceil(H/16),mbps=mb*fps;
  for(const[l,fs,ps]of[[0x1f,3600,108000],[0x28,8192,245760],[0x2a,8704,522240],[0x33,36864,983040],[0x34,36864,2073600]])if(mb<=fs&&mbps<=ps)return l;return 0x34};
const hex2=n=>n.toString(16).padStart(2,'0');

async function pickVideo(fmt,W,H,fps,br,cbr){
  const tries=[];
  if(fmt==='mp4'){const lv=hex2(avcLevel(W,H,fps));for(const p of['64','4d','42'])tries.push({mc:'avc',codec:'avc1.'+p+'00'+lv,avc:true});
    tries.push({mc:'vp9',codec:'vp09.00.40.08'})}
  else tries.push({mc:'V_VP9',codec:'vp09.00.40.08'},{mc:'V_VP8',codec:'vp8'});
  for(const t of tries)for(const mode of cbr?['constant','variable',null]:['variable',null]){
    const cfg={codec:t.codec,width:W,height:H,bitrate:Math.round(br),framerate:fps,latencyMode:'quality'};
    if(mode)cfg.bitrateMode=mode;if(t.avc)cfg.avc={format:'avc'};
    try{const s=await VideoEncoder.isConfigSupported(cfg);if(s&&s.supported)return{mc:t.mc,cfg:s.config||cfg,name:t.codec}}catch(e){}
  }
  return null;
}

/* Ton aus der Datei holen (nur den gewählten Ausschnitt) */
async function prepAudio(file,start,end){
  if(file.size>400e6)throw Error('Datei zu groß für den Ton');
  const oc=new OfflineAudioContext(2,1,48000),buf=await oc.decodeAudioData(await file.arrayBuffer());
  const sr=buf.sampleRate,s0=Math.floor(start*sr),s1=Math.min(buf.length,Math.ceil(end*sr)),ch=Math.min(2,buf.numberOfChannels),pcm=[];
  for(let c=0;c<ch;c++)pcm.push(buf.getChannelData(c).subarray(s0,s1));
  if(s1-s0<sr*0.05)throw Error('kein Ton');
  return{pcm,sr,ch,len:s1-s0};
}
async function pickAudio(fmt,sr,ch){
  if(typeof AudioEncoder==='undefined'||typeof AudioData==='undefined')return null;
  for(const c of fmt==='mp4'?[['aac','mp4a.40.2'],['opus','opus']]:[['opus','opus']]){
    try{const cfg={codec:c[1],sampleRate:sr,numberOfChannels:ch,bitrate:ch>1?128000:96000};if(c[0]==='aac')cfg.aac={format:'aac'};const s=await AudioEncoder.isConfigSupported(cfg);
      if(s&&s.supported)return{mc:c[0],cfg:s.config||cfg}}catch(e){}}
  return null;
}
async function encodeAudio(aud,ac,muxer,ab){
  let err=null;
  const enc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{err=e}});
  enc.configure(ac.cfg);
  const CH=aud.sr;
  for(let off=0;off<aud.len;off+=CH){
    chk(ab);if(err)throw err;
    const n=Math.min(CH,aud.len-off),data=new Float32Array(n*aud.ch);
    for(let c=0;c<aud.ch;c++)data.set(aud.pcm[c].subarray(off,off+n),c*n);
    const ad=new AudioData({format:'f32-planar',sampleRate:aud.sr,numberOfFrames:n,numberOfChannels:aud.ch,timestamp:Math.round(off/aud.sr*1e6),data});
    enc.encode(ad);ad.close();
    while(enc.encodeQueueSize>8)await tick(4);
  }
  await enc.flush();enc.close();if(err)throw err;
}

async function convertVideo(v,file,info,opt,hooks){
  needEnc();
  const prog=hooks.progress||(()=>{}),ab=hooks.aborted,pl=plan(info,opt),notes=[],fmt=opt.fmt,fps=pl.fps;
  const aq=opt.audio?96000:0,max=opt.maxMB?opt.maxMB*1e6:0;
  let d=dims(pl.W0,pl.asp),br;
  const bpp={high:0.11,mid:0.07,low:0.04}[opt.quality||'mid']||0.07;
  const sizeBr=(f)=>Math.max(60000,(max*8*0.93*f)/pl.dur-aq);

    if(!opt.width){const maxPx=br/(0.055*fps);if(d.W*d.H>maxPx){d=dims(Math.max(160,pl.W0*Math.sqrt(maxPx/(d.W*d.H))),pl.asp);notes.push('Auflösung wurde automatisch verkleinert, damit das Bild bei dieser Größe gut aussieht.')}}}

    if(!vv)throw Error('Dein Gerät kann dieses Format nicht erzeugen. Probiere „WebM“ oder eine kleinere Breite.');
    if(fmt==='mp4'&&vv.mc!=='avc'&&attempt===1)notes.push('Dein Gerät hat keinen H.264-Encoder, das MP4 nutzt VP9 (läuft nicht überall).');
    const target=fmt==='mp4'?new Mp4Muxer.ArrayBufferTarget():new WebMMuxer.ArrayBufferTarget();
    const vopt={codec:vv.mc,width:d.W,height:d.H};
    let muxer;
    if(fmt==='mp4')muxer=new Mp4Muxer.Muxer({target,video:vopt,audio:aud?{codec:ac.mc,numberOfChannels:aud.ch,sampleRate:aud.sr}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});

        while(venc.encodeQueueSize>6){await tick(4);if(err)throw err}

      }

  return{blob,W:d.W,H:d.H,fps,ext:fmt,codec:vc,audio:!!aud,notes};
}

async function convert(v,file,info,opt,hooks){

/* ---------- Automatische Verfolgung eines Bereichs ---------- */
async function track(v,reg,t0,tMin,tMax,hooks){
  hooks=hooks||{};const prog=hooks.progress||(()=>{}),ab=hooks.aborted;
  const vw=v.videoWidth,vh=v.videoHeight,r0=rectAt(reg,t0);
  if(!r0)throw Error('Zuerst einen Bereich markieren.');
  const Wa=clamp(Math.round(18/Math.max(r0.w,0.01)),320,Math.min(640,vw)),Ha=Math.round(Wa*vh/vw);
  const cv=document.createElement('canvas');cv.width=Wa;cv.height=Ha;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.imageSmoothingQuality='high';
  const grab=async t=>{await seek(v,t);cx.drawImage(v,0,0,Wa,Ha);
    const E=VTP.sobel(VTP.luma(cx.getImageData(0,0,Wa,Ha).data,Wa,Ha),Wa,Ha),I=VTP.integral(E,Wa,Ha);return{E,S:I.S,Q:I.Q}};
  const tw=clamp(Math.round(r0.w*Wa),8,Wa-1),th=clamp(Math.round(r0.h*Ha),6,Ha-1);
  const x0=clamp(Math.round(r0.x*Wa),0,Wa-tw),y0=clamp(Math.round(r0.y*Ha),0,Ha-th);
  const T=VTP.makeTemplate((await grab(t0)).E,Wa,x0,y0,tw,th);

  const total=Math.max(1,Math.ceil((tMax-t0)/dt)+Math.ceil((t0-tMin)/dt));let done=0,lost=0;
  async function walk(dir){
    let px=x0,py=y0;const out=[];
    for(let t=t0+dir*dt;dir>0?t<=tMax+1e-6:t>=tMin-1e-6;t+=dir*dt){
      chk(ab);const f=await grab(t);
      let m=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,px,py,R,1);
      if(m.s<0.45){const g=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,0,0,Math.max(Wa,Ha),2),g2=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,g.x,g.y,2,1);
        if(g2.s>=0.55&&g2.s>m.s+0.1)m=g2}
      if(m.s>=0.45){px=m.x;py=m.y}else lost++;
      out.push({t,x:px,y:py});prog(++done/total,'Verfolge … '+Math.round(done/total*100)+' %');
    }

  const pts=[...back,{t:t0,x:x0,y:y0},...fwd],kf=[];
  const mk=(t,p)=>({t,x:p.x/Wa,y:p.y/Ha,w:r0.w,h:r0.h,a:1});
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[i-1];
    if(q&&Math.hypot(p.x-q.x,p.y-q.y)>R*1.2){   // Sprung: Zeitpunkt des Sprungs genauer bestimmen
      let lo=q.t,hi=p.t;
      for(let k=0;k<4;k++){chk(ab);const tm=(lo+hi)/2,f=await grab(tm);
        if(VTP.zncc(T,f.E,Wa,f.S,f.Q,q.x,q.y)>=VTP.zncc(T,f.E,Wa,f.S,f.Q,p.x,p.y))lo=tm;else hi=tm}
      const tj=(lo+hi)/2;kf.push(mk(tj-0.0005,q));kf.push(mk(tj,p));

  }
  return{kf,lost:lost/Math.max(1,pts.length-1)};
}

return{seek,loadVideo,estimateFps,makeProc,plan,convert,track,ABORT,even};

 <div class="grid2"><div><label>Höchstgröße (MB)</label><input id="vmb" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="Automatisch"></div><div id="vqw"><label>Qualität</label><select id="vq"><option value="high">Hoch</option><option value="mid" selected>Mittel</option><option value="low">Klein</option></select></div></div>
 <div class="chips">${[2,5,8,16].map(m=>`<button class="chipb" data-a="mb" data-v="${m}">${m} MB</button>`).join('')}<button class="chipb" data-a="mb" data-v="">Automatisch</button></div>
 <div class="grid2"><div><label>Start (Sekunden)</label><input id="vs" type="number" inputmode="decimal" min="0" step="0.1" value="0"></div><div><label>Ende (Sekunden)</label><input id="ve" type="number" inputmode="decimal" min="0" step="0.1"></div></div>
 <div class="chips"><button class="chipb" data-a="setS">Start = jetzt</button><button class="chipb" data-a="setE">Ende = jetzt</button></div>
 <label class="chk" id="vaw"><input id="va" type="checkbox" checked><span>Ton behalten</span></label>
 <details class="dt"><summary>Zuschneiden</summary>
  <p class="st">Schneidet Ränder ab, zum Beispiel ein Logo am Bildrand.</p>
  <div class="grid2"><div><label>Oben: <b id="vcl-t">0</b> %</label><input type="range" data-crop="t" min="0" max="45" value="0"></div><div><label>Unten: <b id="vcl-b">0</b> %</label><input type="range" data-crop="b" min="0" max="45" value="0"></div></div>
  <div class="grid2"><div><label>Links: <b id="vcl-l">0</b> %</label><input type="range" data-crop="l" min="0" max="45" value="0"></div><div><label>Rechts: <b id="vcl-r">0</b> %</label><input type="range" data-crop="r" min="0" max="45" value="0"></div></div>
 </details>
 <details class="dt" id="vwd"><summary>Wasserzeichen entfernen</summary><div id="vwm"></div></details>
 </div>
 <button id="vgo" class="btn pri" data-a="go">Umwandeln</button>
 <div id="vprog" hidden><div class="prog"><i id="vbar"></i></div><p class="st" id="vptx"></p><button class="btn" data-a="cancel">Abbrechen</button></div>
 <p id="vst" class="st"></p>
 <div id="vres" hidden></div>
 <p class="foot">${ico('lock',14)}<span>Alles läuft nur auf deinem Gerät, nichts wird hochgeladen. Entferne Wasserzeichen bitte nur aus Videos, die dir gehören oder bei denen du die Erlaubnis hast.</span></p>
</div>`;

function fill(sel,list,val){const s=q(sel);s.innerHTML=list.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');if(val!=null&&list.some(x=>x[0]==val))s.value=val}
function setFmt(f){
  S.fmt=f;const g=f==='gif';
  qa('#vfmt button').forEach(b=>b.classList.toggle('on',b.dataset.v===f));
  fill('#vw',g?WID.gif:WID.vid,g?480:0);fill('#vfps',g?FPS.gif:FPS.vid,g?12:0);
  q('#vqw').hidden=g;q('#vaw').hidden=g;
  if(!S.info)return;
  const s=+q('#vs').value||0,e=+q('#ve').value||S.info.dur;
  if(g&&e-s>10){q('#ve').value=Math.min(S.info.dur,s+10).toFixed(1);S.autoEnd=true;msg('Für GIFs habe ich den Ausschnitt auf 10 Sekunden gekürzt. Du kannst das Ende ändern.')}
  else if(!g&&S.autoEnd){q('#ve').value=S.info.dur.toFixed(1);S.autoEnd=false;msg('')}
}

let seeking=false,pend=null;
async function seekTo(t){
  if(!S.v)return;S.t=clamp(t,0,Math.max(0,S.info.dur-0.02));
  q('#vt').value=S.t;q('#vtime').textContent=fmtT(S.t)+' / '+fmtT(S.info.dur);
  pend=S.t;if(seeking)return;seeking=true;
  while(pend!=null){const x=pend;pend=null;await VTE.seek(S.v,x)}
  seeking=false;afterSeek();
}

function cleanupVideo(){
  if(S.v){try{S.v.pause()}catch(e){}S.v.remove()}
  if(S.url)URL.revokeObjectURL(S.url);
  if(S.resUrl)URL.revokeObjectURL(S.resUrl);
  S.v=S.url=S.resUrl=S.res=null;
}
async function loadFile(file){
  if(S.busy)return;
  cleanupVideo();q('#vmain').hidden=true;q('#vres').hidden=true;
  const m=q('#vmsg');say(m,'Video wird geladen …');
  try{
    const r=await VTE.loadVideo(file);
    S.file=file;S.v=r.v;S.url=r.url;S.info={vw:r.vw,vh:r.vh,dur:r.dur,fps:30};
    r.v.className='vvid';q('#vbox').prepend(r.v);q('#vbox').style.setProperty('--ar',r.vw/r.vh);
    S.regions=[];S.sel=0;S.prev=false;S.t=0;S.autoEnd=false;
    q('#vmain').hidden=false;say(m,'');msg('');
    qa('[data-crop]').forEach(i=>{i.value=0;q('#vcl-'+i.dataset.crop).textContent='0'});
    q('#vt').max=r.dur;q('#vs').value='0';q('#ve').value=r.dur.toFixed(1);q('#vmb').value='';
    S.info.fps=await VTE.estimateFps(r.v);
    q('#vinfo').textContent=file.name+' · '+fmtMB(file.size)+' · '+r.vw+'×'+r.vh+' · '+fmtT(r.dur)+' · '+(Math.round(S.info.fps*100)/100)+' Bilder/s';
    setFmt('gif');renderWm();await seekTo(0);
  }catch(e){say(m,e.message||'Das Video konnte nicht geladen werden.',1);cleanupVideo()}
}

function readOpt(){
  const fmt=S.fmt,mb=parseFloat(String(q('#vmb').value).replace(',','.'))||0;
  return{fmt,width:+q('#vw').value,fps:+q('#vfps').value,maxMB:mb>0?mb:0,quality:q('#vq').value,audio:fmt!=='gif'&&q('#va').checked,
    start:Math.max(0,parseFloat(q('#vs').value)||0),end:parseFloat(q('#ve').value)||S.info.dur,crop:crop(),regions:regionsOut(),wm:wmOpts()};
}

const busy=on=>{S.busy=on;q('#vset').classList.toggle('lock',on);q('.tl').classList.toggle('lock',on);q('#vgo').disabled=on;q('#vprog').hidden=!on;if(on)prog(0,'Starte …')};
function prog(p,tx,t0){
  q('#vbar').style.width=Math.round(p*100)+'%';let e='';
  if(t0&&p>0.04){const s=(performance.now()-t0)/1000*(1-p)/p;e=' · noch ca. '+(s<90?Math.ceil(s)+' Sek.':Math.ceil(s/60)+' Min.')}
  q('#vptx').textContent=tx+e;
}
async function wake(){try{S.wake=await navigator.wakeLock.request('screen')}catch(e){S.wake=null}}
function unwake(){try{S.wake&&S.wake.release()}catch(e){}S.wake=null}

async function go(){
  if(S.busy||!S.v)return;
  const o=readOpt();
  if(o.end-o.start<0.1)return msg('Das Ende muss nach dem Start liegen.',1);
  q('#vres').hidden=true;msg('');busy(true);
  const ab={stop:false};S.abort=ab;const t0=performance.now();await wake();
  try{showResult(await VTE.convert(S.v,S.file,S.info,o,{aborted:()=>ab.stop,progress:(p,tx)=>prog(p,tx,t0)}))}
  catch(e){msg(e.message===VTE.ABORT?'Abgebrochen.':(e.message||String(e)),e.message!==VTE.ABORT)}
  unwake();S.abort=null;if(!el)return;busy(false);seekTo(S.t);
}

function showResult(r){
  if(S.resUrl)URL.revokeObjectURL(S.resUrl);
  S.resUrl=URL.createObjectURL(r.blob);S.res=r;
  const base=S.file.name.replace(/\.[^.]+$/,'')||'video';
  r.name=base+(S.file.name.toLowerCase().endsWith('.'+r.ext)?'-neu':'')+'.'+r.ext;
  let share=false;try{share=!!(navigator.canShare&&navigator.canShare({files:[new File([r.blob],r.name,{type:r.blob.type})]}))}catch(e){}
  const media=r.ext==='gif'?`<img src="${S.resUrl}" alt="Ergebnis">`:`<video src="${S.resUrl}" controls playsinline></video>`;
  const box=q('#vres');box.hidden=false;
  box.innerHTML=`<div class="res">${media}</div><p class="chip">${r.ext.toUpperCase()} · ${fmtMB(r.blob.size)} · ${r.W}×${r.H} · ${Math.round(r.fps*10)/10} Bilder/s${r.audio?' · mit Ton':''}</p>${r.notes.map(n=>`<p class="st">${esc(n)}</p>`).join('')}
  <div class="grid2"><button class="btn pri" data-a="save">Speichern</button>${share?'<button class="btn" data-a="share">Teilen</button>':'<span></span>'}</div><p id="vsv" class="st"></p>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

async function act(a,b){
  const r=S.res;
  if(a==='fmt')setFmt(b.dataset.v);
  else if(a==='mb')q('#vmb').value=b.dataset.v;
  else if(a==='setS'){q('#vs').value=S.t.toFixed(1);S.autoEnd=false}
  else if(a==='setE'){q('#ve').value=Math.max(S.t,0.1).toFixed(1);S.autoEnd=false}
  else if(a==='step')seekTo(S.t+(+b.dataset.d)*0.1);
  else if(a==='go')go();
  else if(a==='cancel'){if(S.abort)S.abort.stop=true}
  else if(a==='save'&&r){const st=q('#vsv');try{done(st,r.name,await saveFile(r.name,r.blob))}catch(e){say(st,e.message,1)}}
  else if(a==='share'&&r){try{await navigator.share({files:[new File([r.blob],r.name,{type:r.blob.type})]})}catch(e){}}
  else actWm(a,b);
}

function mount(root){
  el=root;el.innerHTML=tpl();
  el.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)};
  el.oninput=e=>{const t=e.target;
    if(t.id==='vt')seekTo(+t.value);
    else if(t.dataset.crop){q('#vcl-'+t.dataset.crop).textContent=t.value;S.autoEnd=false;renderOv();renderPreview()}
    else inputWm(t)};
  el.onchange=e=>{const t=e.target;
    if(t.id==='vf'){const f=t.files&&t.files[0];t.value='';if(f)loadFile(f)}
    else if(t.id==='vs'||t.id==='ve'||t.id==='vw'||t.id==='vfps'||t.id==='vmb'||t.id==='vq')S.autoEnd=false;
    else changeWm(t)};
  setFmt('gif');bindWm();
}
function unmount(){
  if(S.abort)S.abort.stop=true;unwake();cleanupVideo();
  Object.assign(S,{file:null,info:null,regions:[],sel:0,busy:false,prev:false,drag:null});el=null;
}



/* ----- Wasserzeichen: Bereiche, Rahmen auf der Vorschau, automatische Verfolgung ----- */
const METHODS=[['rect','Ganze Fläche füllen (geht immer)'],['light','Nur helle Teile (weiße Schrift, Logos)'],['dark','Nur dunkle Teile (schwarze Schrift)'],['both','Helle und dunkle Teile']];
const W={method:'rect',sens:50,pad:4,grain:true};
const wmOpts=()=>({method:W.method,sens:W.sens,pad:W.pad,grain:W.grain});
const regionsOut=()=>S.regions.filter(r=>r.kf.length).map(r=>({mode:r.mode==='static'?'glide':r.mode,kf:r.kf}));
const crop=()=>{const c={l:0,t:0,r:0,b:0};qa('[data-crop]').forEach(i=>{c[i.dataset.crop]=(+i.value||0)/100});return c};
const wmOpen=()=>{const d=el&&q('#vwd');return !!(d&&d.open)};
const HINT={static:'Das Wasserzeichen bleibt an einer Stelle.',glide:'Springe zu einem anderen Zeitpunkt und setze den Rahmen dort neu. Dazwischen wandert der Bereich sanft.',jump:'Springe zu einem anderen Zeitpunkt und setze den Rahmen dort neu. Der Bereich bleibt stehen, bis die nächste Position kommt.'};

function defRect(cx,cy){
  const w=0.3,h=Math.max(0.04,w*S.info.vw/4.5/S.info.vh);
  return{x:clamp(cx-w/2,0,1-w),y:clamp(cy-h/2,0,1-h),w,h};
}
function setRect(reg,t,r){
  r={x:clamp(r.x,0,1),y:clamp(r.y,0,1),w:Math.min(r.w,1),h:Math.min(r.h,1)};r.x=Math.min(r.x,1-r.w);r.y=Math.min(r.y,1-r.h);
  if(reg.mode==='static'){reg.kf=[{t:0,...r}];return}
  reg.kf=reg.kf.filter(k=>!k.d&&(k.a?Math.abs(k.t-t)>=0.2:Math.abs(k.t-t)>=0.04));
  reg.kf.push({t,...r});reg.kf.sort((a,b)=>a.t-b.t);
}
const newDef=reg=>{setRect(reg,S.t,defRect(0.5,0.5));reg.kf.forEach(k=>{k.d=1})};
function setMode(reg,m){
  const cur=VTP.rectAt(reg,S.t),d=reg.kf.some(k=>k.d)?{d:1}:{};
  if(m==='static')reg.kf=cur?[{t:0,x:cur.x,y:cur.y,w:cur.w,h:cur.h,...d}]:[];
  else if(reg.mode==='static'&&reg.kf.length)reg.kf=[{...reg.kf[0],t:S.t}];
  reg.mode=m;
}

function renderWm(){
  const box=el&&q('#vwm');if(!box)return;
  const reg=S.regions[S.sel];
  let h='<p class="st">Tippe auf das Vorschaubild, um einen Rahmen zu setzen. Ziehe ihn oder seine Ecken, bis er das Wasserzeichen ganz bedeckt.</p>';
  h+=`<div class="chips">${S.regions.map((r,i)=>`<button class="chipb${i===S.sel?' on':''}" data-a="wsel" data-i="${i}">Bereich ${i+1}</button>`).join('')}<button class="chipb" data-a="wadd">+ Bereich</button></div>`;
  if(reg){
    h+=`<label>Bewegung von Bereich ${S.sel+1}</label><div class="seg">${[['static','Fest'],['glide','Gleitet'],['jump','Springt']].map(([v,l])=>`<button class="${reg.mode===v?'on':''}" data-a="wmode" data-v="${v}">${l}</button>`).join('')}</div><p class="st">${HINT[reg.mode]}</p>`;
    const man=reg.kf.filter(k=>!k.a),auto=reg.kf.length-man.length;
    if(reg.mode!=='static'&&(man.length||auto))h+=`<label>Gesetzte Positionen</label><div class="chips">${man.map(k=>`<span class="kc"><button data-a="wgo" data-t="${k.t}">${fmtT(k.t)}</button><button data-a="wkdel" data-t="${k.t}" aria-label="Position löschen">${ico('x',12)}</button></span>`).join('')}${auto?`<span class="kc"><button data-a="wgo" data-t="${reg.kf[0].t}">Automatisch verfolgt (${auto} Punkte)</button><button data-a="wauto0" aria-label="Verfolgung löschen">${ico('x',12)}</button></span>`:''}</div>`;
    h+=`<button class="btn" data-a="wtrack"${reg.kf.length?'':' disabled'}>Automatisch folgen</button><p class="st">Setze den Rahmen genau über das Wasserzeichen, dann tippe hier. Die App sucht es in jedem Bild (ersetzt die anderen Positionen dieses Bereichs). Klappt am besten bei kontrastreichen Logos.</p>`;
    h+=`<button class="btn warn" data-a="wdel">Bereich ${S.sel+1} löschen</button>`;
  }
  h+=`<label>Methode</label><select id="wm-m">${METHODS.map(([v,l])=>`<option value="${v}"${v===W.method?' selected':''}>${l}</option>`).join('')}</select>`;
  if(W.method!=='rect')h+=`<label>Empfindlichkeit: <b id="wm-sv">${W.sens}</b></label><input id="wm-s" type="range" min="0" max="100" value="${W.sens}"><p class="st">Höher = mehr wird entfernt. Sieht oft natürlicher aus als die ganze Fläche.</p>`;
  h+=`<label>Rand um den Rahmen: <b id="wm-pv">${W.pad}</b> px</label><input id="wm-p" type="range" min="0" max="20" value="${W.pad}">`;
  h+=`<button class="btn" data-a="wprev">${S.prev?'Vorschau ausschalten':'Vorschau mit Entfernung'}</button>`;
  box.innerHTML=h;
}

function renderOv(){
  const ov=el&&q('#vov');if(!ov||!S.info)return;
  const c=crop(),open=wmOpen();let h='';
  if(c.t)h+=`<div class="sh" style="left:0;right:0;top:0;height:${c.t*100}%"></div>`;
  if(c.b)h+=`<div class="sh" style="left:0;right:0;bottom:0;height:${c.b*100}%"></div>`;
  if(c.l)h+=`<div class="sh" style="left:0;top:0;bottom:0;width:${c.l*100}%"></div>`;
  if(c.r)h+=`<div class="sh" style="right:0;top:0;bottom:0;width:${c.r*100}%"></div>`;
  S.regions.forEach((reg,i)=>{
    const r=(S.drag&&S.drag.reg===reg&&S.drag.rect)||VTP.rectAt(reg,S.t);if(!r)return;
    const sel=i===S.sel;
    h+=`<div class="rb${sel?' sel':''}" style="left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%">${sel&&open?'<i class="hd a"></i><i class="hd b"></i><i class="hd c"></i><i class="hd d"></i>':''}<span>${i+1}</span></div>`;
  });
  ov.innerHTML=h;ov.style.pointerEvents=open?'auto':'none';ov.style.touchAction=open?'none':'auto';
  const st=q('#vstk');st.classList.toggle('on',open);if(open){const hd=document.querySelector('header');st.style.top=(hd?hd.offsetHeight:72)+'px'}
}

let pvT=0;
function renderPreview(){cancelAnimationFrame(pvT);pvT=requestAnimationFrame(doPreview)}
function doPreview(){
  const pc=el&&q('#vpc');if(!pc||!S.v)return;
  if(!S.prev||!S.regions.some(r=>r.kf.length)){pc.hidden=true;return}
  const i=S.info,w=VTE.even(Math.min(720,i.vw)),h=VTE.even(w*i.vh/i.vw);
  const proc=VTE.makeProc(S.v,{W:w,H:h,crop:{l:0,t:0,r:0,b:0},regions:regionsOut(),wm:wmOpts()});
  proc.draw(S.t);pc.width=w;pc.height=h;pc.getContext('2d').drawImage(proc.cv,0,0);pc.hidden=false;
}
function afterSeek(){renderOv();renderPreview()}

/* Rahmen auf der Vorschau ziehen */
const ptr=e=>{const b=q('#vov').getBoundingClientRect();return{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,bw:b.width,bh:b.height}};
function onDown(e){
  if(S.busy||!wmOpen())return;let reg=S.regions[S.sel];
  if(!reg){reg={mode:'static',kf:[]};S.regions.push(reg);S.sel=S.regions.length-1}
  e.preventDefault();const p=ptr(e),cur=VTP.rectAt(reg,S.t);
  let d={reg,mode:'new',ax:p.x,ay:p.y,moved:false,rect:null};
  if(cur){
    const cs=[[cur.x,cur.y],[cur.x+cur.w,cur.y],[cur.x,cur.y+cur.h],[cur.x+cur.w,cur.y+cur.h]];
    const rp=clamp(Math.min(cur.w*p.bw,cur.h*p.bh)/2.5,14,30);let hit=-1,hd=1e9;
    cs.forEach((c,i)=>{const dx=Math.abs(c[0]-p.x)*p.bw,dy=Math.abs(c[1]-p.y)*p.bh,dd=Math.hypot(dx,dy);if(dx<rp&&dy<rp&&dd<hd){hd=dd;hit=i}});
    if(hit>=0){const o=cs[3-hit];d={reg,mode:'resize',ax:o[0],ay:o[1],moved:true,rect:{x:cur.x,y:cur.y,w:cur.w,h:cur.h}}}
    else if(p.x>=cur.x&&p.x<=cur.x+cur.w&&p.y>=cur.y&&p.y<=cur.y+cur.h)d={reg,mode:'move',ox:p.x-cur.x,oy:p.y-cur.y,w:cur.w,h:cur.h,moved:false,rect:null};
  }
  S.drag=d;try{q('#vov').setPointerCapture(e.pointerId)}catch(x){}
}
function onMove(e){
  const d=S.drag;if(!d)return;const p=ptr(e);
  if(d.mode==='move'){d.rect={x:clamp(p.x-d.ox,0,1-d.w),y:clamp(p.y-d.oy,0,1-d.h),w:d.w,h:d.h};d.moved=true}
  else{
    const x0=clamp(Math.min(d.ax,p.x),0,1),x1=clamp(Math.max(d.ax,p.x),0,1),y0=clamp(Math.min(d.ay,p.y),0,1),y1=clamp(Math.max(d.ay,p.y),0,1);
    d.rect={x:x0,y:y0,w:Math.max(0.005,x1-x0),h:Math.max(0.005,y1-y0)};
    if(Math.hypot((p.x-d.ax)*p.bw,(p.y-d.ay)*p.bh)>10)d.moved=true;
  }
  renderOv();
}
function onUp(){
  const d=S.drag;if(!d)return;S.drag=null;let r=d.rect;
  if(d.mode==='new'&&(!d.moved||!r||r.w<0.02||r.h<0.012))r=defRect(d.ax,d.ay);
  else if(d.mode==='move'&&!d.moved)r=null;
  if(r)setRect(d.reg,S.t,r);
  renderWm();renderOv();renderPreview();
}

async function trackNow(){
  const reg=S.regions[S.sel];if(!reg||S.busy)return;
  if(!reg.kf.length)return msg('Setze zuerst einen Rahmen.',1);
  const s=Math.max(0,+q('#vs').value||0),e=+q('#ve').value||S.info.dur;
  const tMin=Math.min(s,S.t),tMax=Math.max(e,S.t);
  const pre=VTP.rectAt(reg,S.t);if(reg.mode==='static'||!reg.kf.some(k=>!k.a)){reg.kf=[{t:S.t,x:pre.x,y:pre.y,w:pre.w,h:pre.h}]}
  const keep=reg.kf.slice(),mode=reg.mode;
  msg('');busy(true);const ab={stop:false};S.abort=ab;const t0=performance.now();await wake();
  try{
    const res=await VTE.track(S.v,reg,S.t,tMin,tMax,{aborted:()=>ab.stop,progress:(p,tx)=>prog(p,tx,t0)});
    if(el){reg.mode='glide';reg.kf=res.kf;
      msg(res.lost>0.3?'Die Verfolgung war stellenweise unsicher. Prüfe die Positionen mit dem Regler und setze den Rahmen an falschen Stellen neu.':'Fertig: Der Rahmen folgt dem Wasserzeichen. Schiebe den Regler und prüfe ein paar Stellen.',res.lost>0.3)}
  }catch(x){reg.kf=keep;reg.mode=mode;if(el)msg(x.message===VTE.ABORT?'Abgebrochen.':(x.message||String(x)),x.message!==VTE.ABORT)}
  unwake();S.abort=null;if(!el)return;
  busy(false);renderWm();renderOv();renderPreview();seekTo(S.t);
}

function actWm(a,b){
  const reg=S.regions[S.sel];
  if(a==='wadd'){const r={mode:'static',kf:[]};S.regions.push(r);S.sel=S.regions.length-1;newDef(r)}
  else if(a==='wsel')S.sel=+b.dataset.i;
  else if(a==='wmode'&&reg)setMode(reg,b.dataset.v);
  else if(a==='wgo'){seekTo(+b.dataset.t);return}
  else if(a==='wkdel'&&reg)reg.kf=reg.kf.filter(k=>k.a||Math.abs(k.t-(+b.dataset.t))>1e-6);
  else if(a==='wauto0'&&reg){const cur=VTP.rectAt(reg,S.t),man=reg.kf.filter(k=>!k.a);reg.kf=man.length?man:(cur?[{t:S.t,x:cur.x,y:cur.y,w:cur.w,h:cur.h}]:[])}
  else if(a==='wdel'&&reg){S.regions.splice(S.sel,1);S.sel=Math.max(0,S.sel-1)}
  else if(a==='wtrack'){trackNow();return}
  else if(a==='wprev')S.prev=!S.prev;
  else return;
  renderWm();renderOv();renderPreview();
}
function inputWm(t){
  if(t.id==='wm-s'){W.sens=+t.value;q('#wm-sv').textContent=t.value}
  else if(t.id==='wm-p'){W.pad=+t.value;q('#wm-pv').textContent=t.value}
  else return;
  renderPreview();
}
function changeWm(t){if(t.id==='wm-m'){W.method=t.value;renderWm();renderPreview()}}

function bindWm(){
  el.addEventListener('toggle',e=>{
    if(!e.target||e.target.id!=='vwd'||!S.info)return;
    if(wmOpen()&&!S.regions.length){const r={mode:'static',kf:[]};S.regions.push(r);S.sel=0;newDef(r)}
    renderWm();renderOv();renderPreview();
  },true);
  const ov=q('#vov');
  ov.addEventListener('pointerdown',onDown);ov.addEventListener('pointermove',onMove);ov.addEventListener('pointerup',onUp);ov.addEventListener('pointercancel',()=>{S.drag=null;renderOv()});
}

return{mount,unmount};
})();

/* ---------- Einstellungen ---------- */
tool({id:'set',sys:1,icon:'sliders',title:'Einstellungen',desc:'Design, Textgröße und Daten',mount(el){
  let arm=0;
  const seg=(k,o)=>`<div class="seg" data-k="${k}">${o.map(([v,l])=>`<button data-v="${v}"${String(SET[k])===String(v)?' class="on"':''}>${l}</button>`).join('')}</div>`;
  el.innerHTML=`<label>Design</label>${seg('th',[['sys','System'],['light','Hell'],['dark','Dunkel']])}
  <label>Akzentfarbe</label><div class="sws">${ACC.map((a,i)=>`<button class="sw${SET.ac===i?' on':''}" data-ac="${i}" style="background:${a[1]}" aria-label="${a[0]}"></button>`).join('')}</div>
  <label>Textgröße</label>${seg('z',[[.92,'Klein'],[1,'Normal'],[1.12,'Groß']])}
  <label>Notizen sortieren</label>${seg('so',[['new','Neueste zuerst'],['az','A–Z']])}
  <label>Chat-Benachrichtigungen</label>${seg('nt',[['off','Aus'],['on','An']])}
  <p class="st">Meldung bei neuen Chat-Nachrichten, solange die App im Hintergrund läuft. Ist die App ganz geschlossen, kommt nichts an (dafür bräuchte man einen Server).</p>
  <label>Standard-Verschlüsselung</label><select id="al">${Object.entries(ALGS).map(([k,v])=>`<option value="${k}"${k===SET.alg?' selected':''}>${v.n}</option>`).join('')}</select>
  <label>Daten</label><button id="rs" class="btn">${ico('trash',18)}Alle Daten zurücksetzen</button>
  <p class="st">Löscht Notizen, eigene Stile und Einstellungen von diesem Gerät. Erstelle vorher ein Backup.</p>
  <p class="foot">Toolbox · Version 1.3</p>`;
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const g=b.closest('.seg');
    if(g){const k=g.dataset.k;SET[k]=k==='z'?+b.dataset.v:b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));saveSet();if(k==='nt'&&SET.nt==='on')askNt(g)}
    else if(b.dataset.ac!=null){SET.ac=+b.dataset.ac;el.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));saveSet()}
    else if(b.id==='rs'){
      if(!arm){arm=1;b.classList.add('warn');b.textContent='Wirklich alles löschen?';setTimeout(()=>{arm=0;b.classList.remove('warn');b.innerHTML=ico('trash',18)+'Alle Daten zurücksetzen'},3000)}
      else{['tb_notes','tb_fonts','tb_set','tb_chat'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}});Object.assign(SET,DEF);applySet();toast('Zurückgesetzt');home()}}};
  el.onchange=e=>{if(e.target.id==='al'){SET.alg=e.target.value;saveSet()}};
}});
$('#gear').innerHTML=ico('sliders',20);$('#gear').onclick=()=>open(TOOLS.find(t=>t.id==='set'));

/* ---------- Backup (Notizen & eigene Stile) ---------- */
$('#bke').innerHTML=ico('down',18)+'Sichern';$('#bkl').innerHTML=ico('up',18)+'Laden';
$('#bke').onclick=async()=>{const s=$('#bks');try{
  const nm='toolbox-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const d={app:'toolbox',v:1,notes:store.get('tb_notes',{f:[],n:[]}),fonts:store.get('tb_fonts',[])};
  done(s,nm,await saveFile(nm,new Blob([JSON.stringify(d,null,1)],{type:'application/json'})))}catch(e){say(s,e.message,1)}};
$('#bkl').onclick=()=>$('#bki').click();
$('#bki').onchange=async e=>{const s=$('#bks'),f=e.target.files[0];e.target.value='';if(!f)return;
  const cl=v=>v==null||v===''?null:String(v).replace(/[^\w-]/g,'')||null;
  try{const d=JSON.parse(await f.text());
    if(!d||d.app!=='toolbox'||!d.notes)throw Error('Das ist keine gültige Backup-Datei.');
    const N=store.get('tb_notes',{f:[],n:[]}),F=store.get('tb_fonts',[]);let nf=0,nn=0,ns=0;
    (d.notes.f||[]).forEach(x=>{const id=x&&cl(x.id);if(id&&!N.f.some(y=>y.id===id)){N.f.push({id,name:String(x.name||'Ordner'),p:cl(x.p)});nf++}});
    (d.notes.n||[]).forEach(x=>{const id=x&&cl(x.id);if(!id)return;const n={id,title:String(x.title||''),body:String(x.body||''),f:cl(x.f),t:+x.t||0},o=N.n.find(y=>y.id===id);
      if(!o){N.n.push(n);nn++}else if(n.t>(o.t||0))Object.assign(o,n)});
    (d.fonts||[]).forEach(x=>{const id=x&&cl(x.id);if(id&&!F.some(y=>y.id===id)){F.push({id,name:String(x.name||'Stil'),lo:String(x.lo||''),up:String(x.up||''),d:String(x.d||'')});ns++}});
    store.set('tb_notes',N);store.set('tb_fonts',F);
    say(s,`✓ Backup geladen: ${nn} Notizen, ${nf} Ordner und ${ns} Stile neu hinzugefügt.`)
  }catch(x){say(s,x instanceof SyntaxError?'Die Datei konnte nicht gelesen werden.':x.message,1)}};
