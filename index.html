<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--ac:var(--acl,#4f46e5);--ac2:color-mix(in srgb,var(--ac) 12%,var(--cd));--on:#fff;--bd:#e4e7f0;--er:#dc2626;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}}
:root[data-theme="dark"]{--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}header p{margin:0;font-size:13px;color:var(--mu)}
.logo,.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac);color:var(--on);flex:none}
.ib{background:var(--ac2);color:var(--ac)}.ib.sm{width:36px;height:36px;border-radius:10px}
main{padding:4px 16px 40px;max-width:640px;margin:auto}
#menu{display:grid;gap:10px}
.card,.sty,.item,.dt,.pick{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;color:inherit;font:inherit;cursor:pointer}
.card>svg{color:var(--mu)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600}
.tx small{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
input[type=color]{padding:3px;height:44px}
textarea{resize:vertical}
.btn,.iconbtn,.seg button{font:inherit;font-weight:600;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;margin-top:14px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn:disabled{opacity:.45}
.btn.warn,.iconbtn.warn{color:var(--er);border-color:var(--er)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;font-size:12px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.grid2 .btn,.grid2 .pick{margin-top:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--ac2);border-radius:12px}
.seg button{flex:1;padding:9px;border:0;background:none;color:var(--mu)}.seg .on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;font-size:14px;font-weight:500;color:var(--tx);border-style:dashed;cursor:pointer;text-align:center}
.pick svg{color:var(--ac)}
.chip{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.st{margin:10px 0 0;font-size:13px;color:var(--mu)}.err{color:var(--er)}
.foot{display:flex;gap:8px;align-items:center;margin:22px 0 0;font-size:12px;color:var(--mu)}
.qr{display:flex;justify-content:center;margin:16px 0 0;padding:14px;background:#fff;border-radius:var(--r);border:1px solid var(--bd)}.qr:empty{display:none}
.qr img,.qr canvas{max-width:100%;height:auto}
.rows,.list{display:grid;gap:10px;margin-top:14px}
.sty,.item{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.out{font-size:19px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.dt{margin-top:18px;padding:4px 14px 16px}.dt summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;align-items:center;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;color:var(--mu);margin-bottom:2px}
.crumbs button{font:inherit;font-size:13px;background:none;border:0;color:var(--mu);padding:4px 6px;border-radius:8px;cursor:pointer}.crumbs .on{color:var(--tx);font-weight:600}
.itb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow .btn{width:auto;margin:0}
.empty{text-align:center;color:var(--mu);padding:32px 12px}
.ti{font-size:18px;font-weight:600;margin-top:14px}.bd{min-height:46vh;margin-top:10px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.2s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sws{display:flex;gap:12px;margin-top:2px}.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--cd);cursor:pointer;box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
#gear{margin-left:auto}.vt{font-size:20px;font-weight:700;margin:16px 0 8px;overflow-wrap:anywhere}
.vb{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;min-height:30vh}.vb a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
#bk{margin-top:28px}#bk h2{font-size:15px;font-weight:700;margin:0}#bk h2+.st{margin-top:2px}
.pick{position:relative}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-top:10px}
.ms{display:flex;flex-direction:column;gap:8px;height:50vh;overflow-y:auto;padding:12px;margin-top:12px;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r)}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--ac2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--ac);color:var(--on)}
.bub.sy{align-self:center;background:none;color:var(--mu);font-size:12px;padding:2px;text-align:center}
.bub small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.cin{display:flex;gap:8px;margin-top:10px}.cin .btn{width:auto;margin:0}
[hidden]{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header><button id="back" class="iconbtn" hidden aria-label="Zurück"></button><div class="logo" id="logo"></div><div><h1 id="title">Toolbox</h1><p id="sub">Deine Werkzeuge an einem Ort</p></div><button id="gear" class="iconbtn" aria-label="Einstellungen"></button></header>
<main><div id="menu"></div><div id="view" hidden></div>
<section id="bk"><h2>Backup</h2><p class="st">Notizen und eigene Stile als Datei sichern oder wiederherstellen.</p>
<div class="grid2"><button id="bke" class="btn"></button><button id="bkl" class="btn"></button></div><input id="bki" type="file" accept=".json,application/json" hidden><p id="bks" class="st"></p></section></main>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
const say=(e,m,er)=>{e.textContent=m;e.className='st'+(er?' err':'')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
qr:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2M21 15v.01M15 21h.01M18 18h3v3"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
type:'<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
note:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
file:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/>',
plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
back:'<path d="M15 6l-6 6 6 6"/>',chev:'<path d="M9 6l6 6-6 6"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',sliders:'<path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',check:'<path d="M5 12l5 5 9-10"/>',edit:'<path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17zM14 7l3 3"/>',chat:'<path d="M7.9 20A9 9 0 104 16.1L2 22z"/>'};
const ico=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF={th:'sys',ac:0,z:1,so:'new',alg:'aes256gcm',nt:'off'},SET=Object.assign({},DEF,store.get('tb_set',{}));
const ACC=[['Indigo','#4f46e5','#818cf8'],['Blau','#2563eb','#60a5fa'],['Grün','#15803d','#4ade80'],['Rosa','#db2777','#f472b6'],['Orange','#c2410c','#fb923c']];
function applySet(){const r=document.documentElement,a=ACC[SET.ac]||ACC[0];
  if(SET.th==='sys')r.removeAttribute('data-theme');else r.setAttribute('data-theme',SET.th);
  r.style.setProperty('--acl',a[1]);r.style.setProperty('--acd',a[2]);document.body.style.zoom=SET.z}
const saveSet=()=>{store.set('tb_set',SET);applySet()};
applySet();
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)};
async function copyText(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy')}catch(x){}a.remove()}toast(ok?'Kopiert':'Kopieren nicht möglich – Text lange drücken')}

/* ---------- Speichern (Vorschau: Download-Dialog, APK/Browser: normaler Download) ---------- */
let DL=null;
try{window.claude&&claude.use('downloads').then(d=>DL=d,()=>{})}catch(e){}
const OK='gif png jpg jpeg webp mp4 webm txt json md docx pptx epub csv ttf html svg pdf xlsx zip'.split(' ');
async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  if(DL){
    if(!OK.includes(name.split('.').pop().toLowerCase()))name+='.txt';
    try{await DL.save({filename:name,data:blob});return name}
    catch(e){if(e&&e.code==='declined')return null;throw Error('Speichern nicht möglich ('+((e&&e.code)||'Fehler')+')')}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4e4);return name;
}
const done=(el,req,s)=>say(el,s?'✓ Gespeichert: '+s+(s!==req?' (Vorschau erlaubt nur bestimmte Endungen – in der APK entfällt das .txt)':''):'Abgebrochen.');

/* ---------- Tool-Registry: neues Tool = ein weiterer tool({...})-Block ---------- */
const TOOLS=[],tool=t=>TOOLS.push(t);
const menu=$('#menu'),view=$('#view'),back=$('#back');
back.innerHTML=ico('back',22);$('#logo').innerHTML=ico('grid',22);
const reset=()=>{view.onclick=view.oninput=view.onchange=view.onkeydown=null;delete view.dataset.t;view.innerHTML=''};
function home(){reset();view.hidden=true;menu.hidden=false;$('#bk').hidden=false;$('#gear').hidden=false;back.hidden=true;$('#logo').hidden=false;$('#title').textContent='Toolbox';$('#sub').textContent='Deine Werkzeuge an einem Ort'}
function open(t){reset();menu.hidden=true;$('#bk').hidden=true;$('#gear').hidden=true;view.hidden=false;back.hidden=false;$('#logo').hidden=true;$('#title').textContent=t.title;$('#sub').textContent=t.desc;view.dataset.t=t.title;t.mount(view);scrollTo(0,0)}
menu.onclick=e=>{const b=e.target.closest('.card');if(b)open(TOOLS[b.dataset.i])};
back.onclick=home;

/* ---------- Krypto (Web Crypto, Schlüssel per PBKDF2) ---------- */
const ALGS={aes256gcm:{n:'AES-256-GCM (empfohlen)',a:'AES-GCM',l:256,iv:12,id:1},aes128gcm:{n:'AES-128-GCM',a:'AES-GCM',l:128,iv:12,id:2},aes256cbc:{n:'AES-256-CBC',a:'AES-CBC',l:256,iv:16,id:3},aes256ctr:{n:'AES-256-CTR',a:'AES-CTR',l:256,iv:16,id:4}};
async function deriveKey(pw,salt,it,al){
  const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,{name:al.a,length:al.l},false,['encrypt','decrypt']);
}
const prm=(al,iv)=>al.a==='AES-CTR'?{name:al.a,counter:iv,length:64}:{name:al.a,iv};
async function encryptBytes(name,data,pw,alg){
  const al=ALGS[alg],IT=600000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(al.iv));
  const nb=enc.encode(name),p=new Uint8Array(6+nb.length+data.length);
  p.set(enc.encode('TBXP'));new DataView(p.buffer).setUint16(4,nb.length);p.set(nb,6);p.set(data,6+nb.length);
  const ct=new Uint8Array(await crypto.subtle.encrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),p));
  const h=new Uint8Array(25+al.iv);h.set(enc.encode('TBX1'));h[4]=al.id;new DataView(h.buffer).setUint32(5,IT);h.set(salt,9);h.set(iv,25);
  return new Blob([h,ct]);
}
async function decryptBytes(buf,pw){
  const u=new Uint8Array(buf);
  if(dec.decode(u.slice(0,4))!=='TBX1')throw Error('Das ist keine mit dieser App verschlüsselte Datei.');
  const al=Object.values(ALGS).find(a=>a.id===u[4]);if(!al)throw Error('Unbekanntes Verfahren.');
  const IT=new DataView(buf).getUint32(5),salt=u.slice(9,25),iv=u.slice(25,25+al.iv),bad='Falsches Passwort oder beschädigte Datei.';
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),u.slice(25+al.iv)))}catch(e){throw Error(bad)}
  if(dec.decode(p.slice(0,4))!=='TBXP')throw Error(bad);
  const nl=new DataView(p.buffer).getUint16(4);
  return{name:dec.decode(p.slice(6,6+nl)),data:p.slice(6+nl)};
}

/* ---------- Tool 1: QR-Code ---------- */
tool({icon:'qr',title:'QR-Code',desc:'Links und Texte als QR-Code',mount(el){
  el.innerHTML=`<label>Inhalt</label><textarea id="t" rows="3" placeholder="https://example.com"></textarea>
  <div class="grid2"><div><label>Farbe</label><input id="fg" type="color" value="#0f172a"></div><div><label>Hintergrund</label><input id="bg" type="color" value="#ffffff"></div></div>
  <label>Fehlerkorrektur</label><select id="ec"><option value="L">Niedrig</option><option value="M" selected>Mittel</option><option value="Q">Hoch</option><option value="H">Sehr hoch</option></select>
  <div id="o" class="qr"></div><button id="sv" class="btn pri" disabled>Als PNG speichern</button><p id="st" class="st"></p>`;
  const o=$('#o',el),T=$('#t',el),st=$('#st',el),sv=$('#sv',el);
  const gen=()=>{o.innerHTML='';sv.disabled=true;say(st,'');if(!T.value.trim())return;
    if(typeof QRCode==='undefined')return say(st,'QR-Modul nicht geladen (Internet nötig).',1);
    try{new QRCode(o,{text:T.value,width:512,height:512,colorDark:$('#fg',el).value,colorLight:$('#bg',el).value,correctLevel:QRCode.CorrectLevel[$('#ec',el).value]});sv.disabled=false}
    catch(e){say(st,'Der Text ist zu lang für einen QR-Code.',1)}};
  el.oninput=gen;
  sv.onclick=()=>$('canvas',o).toBlob(async b=>{try{done(st,'qrcode.png',await saveFile('qrcode.png',b))}catch(e){say(st,e.message,1)}});
}});

/* ---------- Tool 2: Verschlüsseln / Entschlüsseln ---------- */
tool({icon:'lock',title:'Verschlüsseln',desc:'Dateien & Ordner mit Passwort schützen',mount(el){
  el.innerHTML=`<div class="seg"><button class="on" data-m="e">Verschlüsseln</button><button data-m="d">Entschlüsseln</button></div>
  <div class="grid2"><div class="pick">${ico('file',22)}<span>Dateien wählen</span><input id="f" type="file" multiple></div><div class="pick" id="fl">${ico('folder',22)}<span>Ordner wählen</span><input id="fo" type="file" webkitdirectory multiple></div></div>
  <p id="sel" class="chip">Nichts ausgewählt (Ordner-Auswahl klappt nicht auf jedem Gerät)</p>
  <label>Passwort</label><input id="p" type="password" autocomplete="new-password">
  <div id="p2l"><label>Passwort wiederholen</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div id="al"><label>Verfahren</label><select id="a">${Object.entries(ALGS).map(([k,v])=>`<option value="${k}"${k===SET.alg?' selected':''}>${v.n}</option>`).join('')}</select></div>
  <button id="go" class="btn pri">Verschlüsseln</button><p id="st" class="st"></p>
  <p class="foot">${ico('lock',14)}<span>Alles läuft nur auf deinem Gerät. Schlüsselableitung: PBKDF2, 600.000 Runden.</span></p>`;
  const q=s=>$(s,el),st=q('#st'),sel=q('#sel'),go=q('#go');let mode='e',files=[];
  const setFiles=fl=>{files=[...fl];const tot=files.reduce((s,f)=>s+f.size,0);
    sel.textContent=files.length?(files.length>1?files.length+' Dateien':files[0].name)+' · '+(tot/1048576).toFixed(1)+' MB':'Nichts ausgewählt'};
  [q('#f'),q('#fo')].forEach(i=>i.onchange=()=>{if(i.files.length)setFiles(i.files);i.value=''});
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
    el.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
    q('#fl').hidden=q('#p2l').hidden=q('#al').hidden=mode==='d';
    go.textContent=mode==='e'?'Verschlüsseln':'Entschlüsseln';files=[];sel.textContent='Nichts ausgewählt';say(st,'')});
  go.onclick=async()=>{
    const pw=q('#p').value;
    if(!files.length)return say(st,'Bitte zuerst Datei(en) wählen.',1);
    if(!pw)return say(st,'Bitte ein Passwort eingeben.',1);
    go.disabled=true;say(st,'Arbeite … (große Dateien brauchen etwas)');
    try{
      if(mode==='e'){
        if(pw!==q('#p2').value)throw Error('Die Passwörter stimmen nicht überein.');
        let name,data;
        if(files.length===1&&!files[0].webkitRelativePath){name=files[0].name;data=new Uint8Array(await files[0].arrayBuffer())}
        else{
          if(typeof JSZip==='undefined')throw Error('ZIP-Modul nicht geladen (Internet nötig).');
          const z=new JSZip();files.forEach(f=>z.file(f.webkitRelativePath||f.name,f));
          name=(files[0].webkitRelativePath.split('/')[0]||'Dateien')+'.zip';
          data=await z.generateAsync({type:'uint8array',compression:'STORE'});
        }
        const out=await encryptBytes(name,data,pw,q('#a').value);
        done(st,name+'.enc',await saveFile(name+'.enc',out));
      }else{
        const r=await decryptBytes(await files[0].arrayBuffer(),pw);
        done(st,r.name,await saveFile(r.name,new Blob([r.data])));
      }
    }catch(e){say(st,e.message,1)}
    go.disabled=false;
  };
}});

/* ---------- Tool 3: Schriften (Unicode-Stile zum Kopieren) ---------- */
const cp=String.fromCodePoint,ch=f=>t=>[...t].map(f).join('');
const rg=(A,a,d,x={})=>ch(c=>{const k=c.charCodeAt(0);return x[c]||(k>64&&k<91?cp(A+k-65):k>96&&k<123?cp(a+k-97):d&&k>47&&k<58?cp(d+k-48):c)});
const mp=lo=>ch(c=>{const i='abcdefghijklmnopqrstuvwxyz'.indexOf(c.toLowerCase());return i<0?c:[...lo][i]});
const ST=[['Fett',rg(0x1D400,0x1D41A,0x1D7CE)],['Kursiv',rg(0x1D434,0x1D44E,0,{h:'ℎ'})],['Fett Kursiv',rg(0x1D468,0x1D482)],
['Schreibschrift',rg(0x1D49C,0x1D4B6,0,{B:'ℬ',E:'ℰ',F:'ℱ',H:'ℋ',I:'ℐ',L:'ℒ',M:'ℳ',R:'ℛ',e:'ℯ',g:'ℊ',o:'ℴ'})],['Schreibschrift fett',rg(0x1D4D0,0x1D4EA)],
['Fraktur',rg(0x1D504,0x1D51E,0,{C:'ℭ',H:'ℌ',I:'ℑ',R:'ℜ',Z:'ℨ'})],['Fraktur fett',rg(0x1D56C,0x1D586)],
['Doppelstrich',rg(0x1D538,0x1D552,0x1D7D8,{C:'ℂ',H:'ℍ',N:'ℕ',P:'ℙ',Q:'ℚ',R:'ℝ',Z:'ℤ'})],
['Sans',rg(0x1D5A0,0x1D5BA,0x1D7E2)],['Sans fett',rg(0x1D5D4,0x1D5EE,0x1D7EC)],['Sans kursiv',rg(0x1D608,0x1D622)],['Sans fett kursiv',rg(0x1D63C,0x1D656)],
['Monospace',rg(0x1D670,0x1D68A,0x1D7F6)],['Breit',ch(c=>c===' '?'\u3000':rg(0xFF21,0xFF41,0xFF10)(c))],
['Eingekreist',ch(c=>/\d/.test(c)?(c==='0'?'⓪':cp(0x245F+ +c)):rg(0x24B6,0x24D0)(c))],['Quadrate',rg(0x1F130,0x1F130)],
['Kapitälchen',mp('ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ')],
['Kopfüber',t=>t.split('\n').map(l=>[...mp('ɐqɔpǝɟƃɥᴉɾʞlɯuodbɹsʇnʌʍxʎz')(l)].reverse().join('')).join('\n')],
['Durchgestrichen',ch(c=>c==='\n'?c:c+'\u0336')],['Unterstrichen',ch(c=>c==='\n'?c:c+'\u0332')]];
const mk=s=>ch(c=>{const L=[...s.lo],U=[...(s.up||s.lo)],N=[...s.d];let i='abcdefghijklmnopqrstuvwxyz'.indexOf(c);if(i>=0)return L[i]||c;i='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(c);if(i>=0)return U[i]||c;i='0123456789'.indexOf(c);return i>=0&&N[i]?N[i]:c});

tool({icon:'note',title:'Notizen',desc:'Notizen in Ordnern sortieren',mount(el){
  let D=store.get('tb_notes',{f:[],n:[]}),cur=null,op=null,add=null,arm=null,ed=false;
  const sv=()=>store.set('tb_notes',D),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const path=id=>{const p=[];while(id){const f=D.f.find(x=>x.id===id);if(!f)break;p.unshift(f);id=f.p}return p};
  const kids=id=>[id,...D.f.filter(f=>f.p===id).flatMap(f=>kids(f.id))];
  const cnt=id=>{const k=kids(id);return D.n.filter(n=>k.includes(n.f)).length};
  const lnk=t=>esc(t).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,m=>{let u=m,tr='';while(/[.,;:!?)\]]$/.test(u)){tr=u.slice(-1)+tr;u=u.slice(0,-1)}return `<a href="${/^www\./.test(u)?'https://'+u:u}" target="_blank" rel="noopener noreferrer">${u}</a>${tr}`});
  const xb=id=>`<button class="iconbtn${arm===id?' warn':''}" data-a="del" data-i="${id}" title="Löschen">${arm===id?'Sicher?':ico('trash',18)}</button>`;
  function list(){
    const fs=D.f.filter(f=>f.p===cur),ns=D.n.filter(n=>n.f===cur).sort(SET.so==='az'?(a,b)=>(a.title||'').localeCompare(b.title||'','de'):(a,b)=>b.t-a.t),cr=[{id:'',name:'Alle Notizen'},...path(cur)];
    el.innerHTML=`<nav class="crumbs">${cr.map((c,i)=>`<button data-a="go" data-i="${c.id}"${i===cr.length-1?' class="on"':''}>${esc(c.name)}</button>`).join(ico('chev',14))}</nav>
    <div class="grid2"><button class="btn" data-a="add" data-i="f">${ico('folder',18)}Neuer Ordner</button><button class="btn pri" data-a="add" data-i="n">${ico('plus',18)}Neue Notiz</button></div>
    ${add?`<div class="addrow"><input id="nm" placeholder="${add==='f'?'Name des Ordners':'Titel der Notiz'}" autocomplete="off"><button class="btn pri" data-a="ok">OK</button></div>`:''}
    <div class="list">${fs.map(f=>`<div class="item"><button class="itb" data-a="go" data-i="${f.id}"><span class="ib sm">${ico('folder',18)}</span><span class="tx"><b>${esc(f.name)}</b><small>${cnt(f.id)} Notiz(en)</small></span></button>${xb(f.id)}</div>`).join('')}
    ${ns.map(n=>`<div class="item"><button class="itb" data-a="op" data-i="${n.id}"><span class="ib sm">${ico('note',18)}</span><span class="tx"><b>${esc(n.title||'Ohne Titel')}</b><small>${esc((n.body||'Leer').slice(0,60))} · ${new Date(n.t).toLocaleDateString('de-DE')}</small></span></button>${xb(n.id)}</div>`).join('')}</div>
    ${fs.length||ns.length?'':'<p class="empty">Noch nichts hier. Lege einen Ordner oder eine Notiz an.</p>'}`;
    const nm=$('#nm',el);if(nm)nm.focus();
  }
  function editor(){
    const n=D.n.find(x=>x.id===op);if(!n){op=null;return list()}
    el.innerHTML=`<div class="grid2"><button class="btn" data-a="bk">${ico('back',18)}Zurück</button><button class="btn pri" data-a="ed">${ed?ico('check',18)+'Fertig':ico('edit',18)+'Bearbeiten'}</button></div>
    ${ed?`<input id="ti" class="ti" value="${esc(n.title)}" placeholder="Titel"><textarea id="bd" class="bd" placeholder="Schreibe hier … (Links werden in der Ansicht anklickbar)">${esc(n.body)}</textarea>`:`<h2 class="vt">${esc(n.title||'Ohne Titel')}</h2><div class="vb">${lnk(n.body)||'<span style="color:var(--mu)">Noch kein Text.</span>'}</div>`}
    <label>Ordner</label><select id="mv"><option value="">Alle Notizen</option>${D.f.map(f=>`<option value="${f.id}"${f.id===n.f?' selected':''}>${esc(path(f.id).map(x=>x.name).join(' / '))}</option>`).join('')}</select>
    <button class="btn${arm===n.id?' warn':''}" data-a="del" data-i="${n.id}">${arm===n.id?'Wirklich löschen?':ico('trash',18)+'Notiz löschen'}</button>${ed?'<p class="st">Wird automatisch auf diesem Gerät gespeichert.</p>':''}`;
  }
  const draw=()=>{op?editor():list();const b=ed&&op&&$('#bd',el);if(b&&!b.value)b.focus()};
  el.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
    if(a==='go'){cur=i||null;add=arm=null}
    else if(a==='add')add=add===i?null:i;
    else if(a==='ok'){const v=$('#nm',el).value.trim();if(!v)return;
      if(add==='f')D.f.push({id:uid(),name:v,p:cur});else{const id=uid();D.n.push({id,title:v,body:'',f:cur,t:Date.now()});op=id;ed=true}
      add=null;sv()}
    else if(a==='op'){op=i;ed=!D.n.find(n=>n.id===i).body.trim()}
    else if(a==='bk')op=null;
    else if(a==='ed')ed=!ed;
    else if(a==='del'){
      if(arm!==i){arm=i;setTimeout(()=>{if(arm===i){arm=null;draw()}},3000)}
      else{const k=kids(i);D.f=D.f.filter(f=>!k.includes(f.id));D.n=D.n.filter(n=>n.id!==i&&!k.includes(n.f));if(op===i)op=null;if(k.includes(cur))cur=null;arm=null;sv()}}
    draw()};
  el.oninput=e=>{const n=D.n.find(x=>x.id===op);if(!n)return;
    if(e.target.id==='ti')n.title=e.target.value;else if(e.target.id==='bd')n.body=e.target.value;else return;
    n.t=Date.now();sv()};
  el.onchange=e=>{if(e.target.id!=='mv')return;const n=D.n.find(x=>x.id===op);if(n){n.f=e.target.value||null;sv()}};
  draw();
}});

/* ---------- Tool 5: Chat (direkt per WebRTC, ohne Server) ---------- */
const CH={step:'start',msgs:[],code:'',peer:'',open:false,wait:0,err:'',name:store.get('tb_chat',{}).n||'',upd(){}};
const b64=u=>btoa(String.fromCharCode(...u));
async function pack(sdp){const j=enc.encode(JSON.stringify({s:sdp}));
  if(window.CompressionStream){const r=new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('deflate-raw')));return 'z'+b64(new Uint8Array(await r.arrayBuffer()))}
  return 'r'+b64(j)}
async function unpack(c){c=c.replace(/\s+/g,'');const u=Uint8Array.from(atob(c.slice(1)),x=>x.charCodeAt(0));
  const t=c[0]==='z'?await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text():dec.decode(u);
  return JSON.parse(t).s}
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,6000)});
async function notify(t,b){if(SET.nt!=='on'||!('Notification' in window)||Notification.permission!=='granted')return;
  try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(t,{body:b,icon:'icon-192.png',tag:'tb-chat'});else new Notification(t,{body:b})}catch(e){}}
async function askNt(g){let ok=false;try{ok='Notification' in window&&(Notification.permission==='granted'||await Notification.requestPermission()==='granted')}catch(e){}
  if(!ok){SET.nt='off';saveSet();if(g)g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='off'));toast('Benachrichtigungen nicht erlaubt oder hier nicht verfügbar')}}
const sysmsg=x=>{CH.msgs.push({s:1,x});CH.upd()};
function wire(dc){
  dc.onopen=()=>{CH.dc=dc;CH.open=true;CH.wait=0;CH.err='';CH.step='chat';dc.send(JSON.stringify({t:'h',n:CH.name||'Gast'}));sysmsg('Verbunden – direkt und verschlüsselt.');if(document.hidden)notify('Chat verbunden','Die Verbindung steht – du kannst jetzt schreiben.')};
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='h'){CH.peer=String(m.n||'Gast').slice(0,24);sysmsg(CH.peer+' ist online.')}
    else if(m.t==='m'){const x=String(m.x).slice(0,4000);CH.msgs.push({x,ts:Date.now()});if(view.dataset.t==='Chat')CH.upd();else toast((CH.peer||'Chat')+': '+x.slice(0,50));if(document.hidden)notify('Chat: '+(CH.peer||'Neue Nachricht'),x.slice(0,120))}};
  dc.onclose=()=>{if(CH.dc===dc){CH.open=false;sysmsg('Verbindung getrennt.')}}}
function newPc(){const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}]});CH.pc=pc;
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){CH.open=false;CH.wait=0;CH.err='Verbindung fehlgeschlagen – manche Netze (z. B. Mobilfunk) blockieren Direktverbindungen. Versuche es im WLAN.';CH.upd()}};return pc}
function hang(){try{CH.dc&&CH.dc.close();CH.pc&&CH.pc.close()}catch(e){}Object.assign(CH,{step:'start',msgs:[],code:'',peer:'',open:false,dc:null,pc:null,err:'',wait:0});CH.upd()}
async function host(){
  if(!window.RTCPeerConnection){CH.err='Dein Browser unterstützt keine Direktverbindungen.';return CH.upd()}
  CH.step='host';CH.code='';CH.err='';CH.upd();
  try{const pc=newPc();wire(pc.createDataChannel('chat'));await pc.setLocalDescription(await pc.createOffer());await gathered(pc);CH.code='TBO'+await pack(pc.localDescription.sdp)}
  catch(e){CH.err='Fehler: '+e.message;CH.step='start'}
  CH.upd()}
async function accept(c){c=c.trim();if(/^TBO/.test(c))throw Error('Das ist eine Einladung (TBO), kein Antwortcode. Die andere Person muss „Einladung erhalten“ wählen, DEINEN Code von oben einfügen und dir den Code zurückschicken, der mit TBA beginnt.');if(!/^TBA/.test(c))throw Error('Das ist kein Antwortcode (er beginnt mit TBA).');
  await CH.pc.setRemoteDescription({type:'answer',sdp:await unpack(c.slice(3))});CH.wait=1;CH.upd()}
async function join(c){c=c.trim();if(/^TBA/.test(c))throw Error('Das ist ein Antwortcode (TBA). Hier gehört die Einladung (TBO) der anderen Person hinein.');if(!/^TBO/.test(c))throw Error('Das ist kein Einladungscode (er beginnt mit TBO).');
  if(!window.RTCPeerConnection)throw Error('Dein Browser unterstützt keine Direktverbindungen.');
  const sdp=await unpack(c.slice(3)),pc=newPc();pc.ondatachannel=e=>wire(e.channel);
  await pc.setRemoteDescription({type:'offer',sdp});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
  CH.code='TBA'+await pack(pc.localDescription.sdp);CH.step='join2';CH.upd()}
tool({icon:'chat',title:'Chat',desc:'Direkt chatten – ohne Server, per Code',mount(el){

    else el.innerHTML=`<div class="grid2" style="align-items:center"><p class="st" style="margin:0">${CH.open?'● Verbunden'+(CH.peer?' mit '+esc(CH.peer):''):'○ Getrennt'}</p><button class="btn" data-a="end" style="margin:0">Beenden</button></div>

    CH.shown=CH.open;const ms=$('#ms',el);if(ms)ms.scrollTop=ms.scrollHeight};
  CH.upd=()=>{if(view.dataset.t!=='Chat')return;const ms=$('#ms',el);
    if(ms&&CH.step==='chat'&&CH.shown===CH.open){ms.innerHTML=CH.msgs.map(bub).join('');ms.scrollTop=ms.scrollHeight}else paint()};
  const send=()=>{const i=$('#mi',el),x=i&&i.value.trim();if(!x)return;
    try{CH.dc.send(JSON.stringify({t:'m',x}));CH.msgs.push({me:1,x,ts:Date.now()});i.value='';CH.upd()}catch(e){toast('Senden fehlgeschlagen')}};
  const bad=x=>/^Das ist|^Dein Browser/.test(x.message)?x.message:'Der Code ist ungültig oder unvollständig.';
  el.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,st=$('#st',el),inp=$('#in',el);
    if(a==='host'){nm();host()}
    else if(a==='join'){nm();CH.step='join';CH.err='';paint()}

    else if(a==='go'){try{say(st,'Erstelle Antwort … (dauert einige Sekunden)');await join(inp.value)}catch(x){say(st,bad(x),1)}}
    else if(a==='send')send()};
  el.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='mi'){e.preventDefault();send()}};
  paint();
}});

/* ---------- Einstellungen ---------- */
tool({id:'set',sys:1,icon:'sliders',title:'Einstellungen',desc:'Design, Textgröße und Daten',mount(el){
  let arm=0;
  const seg=(k,o)=>`<div class="seg" data-k="${k}">${o.map(([v,l])=>`<button data-v="${v}"${String(SET[k])===String(v)?' class="on"':''}>${l}</button>`).join('')}</div>`;
  el.innerHTML=`<label>Design</label>${seg('th',[['sys','System'],['light','Hell'],['dark','Dunkel']])}
  <label>Akzentfarbe</label><div class="sws">${ACC.map((a,i)=>`<button class="sw${SET.ac===i?' on':''}" data-ac="${i}" style="background:${a[1]}" aria-label="${a[0]}"></button>`).join('')}</div>
  <label>Textgröße</label>${seg('z',[[.92,'Klein'],[1,'Normal'],[1.12,'Groß']])}
  <label>Notizen sortieren</label>${seg('so',[['new','Neueste zuerst'],['az','A–Z']])}
  <label>Chat-Benachrichtigungen</label>${seg('nt',[['off','Aus'],['on','An']])}
  <p class="st">Meldung bei neuen Chat-Nachrichten, solange die App im Hintergrund läuft. Ist die App ganz geschlossen, kommt nichts an (dafür bräuchte man einen Server).</p>
  <label>Standard-Verschlüsselung</label><select id="al">${Object.entries(ALGS).map(([k,v])=>`<option value="${k}"${k===SET.alg?' selected':''}>${v.n}</option>`).join('')}</select>
  <label>Daten</label><button id="rs" class="btn">${ico('trash',18)}Alle Daten zurücksetzen</button>
  <p class="st">Löscht Notizen, eigene Stile und Einstellungen von diesem Gerät. Erstelle vorher ein Backup.</p>
  <p class="foot">Toolbox · Version 1.2</p>`;
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const g=b.closest('.seg');
    if(g){const k=g.dataset.k;SET[k]=k==='z'?+b.dataset.v:b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));saveSet();if(k==='nt'&&SET.nt==='on')askNt(g)}
    else if(b.dataset.ac!=null){SET.ac=+b.dataset.ac;el.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));saveSet()}
    else if(b.id==='rs'){
      if(!arm){arm=1;b.classList.add('warn');b.textContent='Wirklich alles löschen?';setTimeout(()=>{arm=0;b.classList.remove('warn');b.innerHTML=ico('trash',18)+'Alle Daten zurücksetzen'},3000)}
      else{['tb_notes','tb_fonts','tb_set','tb_chat'].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}});Object.assign(SET,DEF);applySet();toast('Zurückgesetzt');home()}}};
  el.onchange=e=>{if(e.target.id==='al'){SET.alg=e.target.value;saveSet()}};
}});
$('#gear').innerHTML=ico('sliders',20);$('#gear').onclick=()=>open(TOOLS.find(t=>t.id==='set'));

/* ---------- Backup (Notizen & eigene Stile) ---------- */
$('#bke').innerHTML=ico('down',18)+'Sichern';$('#bkl').innerHTML=ico('up',18)+'Laden';
$('#bke').onclick=async()=>{const s=$('#bks');try{
  const nm='toolbox-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const d={app:'toolbox',v:1,notes:store.get('tb_notes',{f:[],n:[]}),fonts:store.get('tb_fonts',[])};
  done(s,nm,await saveFile(nm,new Blob([JSON.stringify(d,null,1)],{type:'application/json'})))}catch(e){say(s,e.message,1)}};
$('#bkl').onclick=()=>$('#bki').click();
$('#bki').onchange=async e=>{const s=$('#bks'),f=e.target.files[0];e.target.value='';if(!f)return;
  const cl=v=>v==null||v===''?null:String(v).replace(/[^\w-]/g,'')||null;
  try{const d=JSON.parse(await f.text());
    if(!d||d.app!=='toolbox'||!d.notes)throw Error('Das ist keine gültige Backup-Datei.');
    const N=store.get('tb_notes',{f:[],n:[]}),F=store.get('tb_fonts',[]);let nf=0,nn=0,ns=0;
    (d.notes.f||[]).forEach(x=>{const id=x&&cl(x.id);if(id&&!N.f.some(y=>y.id===id)){N.f.push({id,name:String(x.name||'Ordner'),p:cl(x.p)});nf++}});
    (d.notes.n||[]).forEach(x=>{const id=x&&cl(x.id);if(!id)return;const n={id,title:String(x.title||''),body:String(x.body||''),f:cl(x.f),t:+x.t||0},o=N.n.find(y=>y.id===id);
      if(!o){N.n.push(n);nn++}else if(n.t>(o.t||0))Object.assign(o,n)});
    (d.fonts||[]).forEach(x=>{const id=x&&cl(x.id);if(id&&!F.some(y=>y.id===id)){F.push({id,name:String(x.name||'Stil'),lo:String(x.lo||''),up:String(x.up||''),d:String(x.d||'')});ns++}});
    store.set('tb_notes',N);store.set('tb_fonts',F);
    say(s,`✓ Backup geladen: ${nn} Notizen, ${nf} Ordner und ${ns} Stile neu hinzugefügt.`)
  }catch(x){say(s,x instanceof SyntaxError?'Die Datei konnte nicht gelesen werden.':x.message,1)}};

/* ---------- Start ---------- */
menu.innerHTML=TOOLS.map((t,i)=>t.sys?'':`<button class="card" data-i="${i}"><span class="ib">${ico(t.icon,22)}</span><span class="tx"><b>${t.title}</b><small>${t.desc}</small></span>${ico('chev',18)}</button>`).join('');
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
