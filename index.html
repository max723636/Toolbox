async function fUp(){
  const f=S.fd;
  const d=dlg(`<h3>Hochladen</h3><p class="st">Ziel: <b>${esc(f.dir)}</b></p><div class="grid2"><div class="pick">${ico('file',22)}<span>Dateien wählen</span><input id="uf" type="file" multiple></div><div class="pick">${ico('folder',22)}<span>Ordner wählen</span><input id="ud" type="file" webkitdirectory multiple></div></div><button class="btn" data-d="pull">${ico('cloud',18)}Von Internet-Adresse laden</button><button class="btn" data-d="no">Abbrechen</button>`,(a,b,close)=>close(a==='pull'?'pull':null));
  d.box.querySelectorAll('input[type=file]').forEach(i=>i.onchange=()=>{const fs=[...i.files];i.value='';d.close(fs)});
  const r=await d.done;
  if(r==='pull')return fPull();
  if(Array.isArray(r)&&r.length)uploadFiles(r);
}
function xhrPost(url,fd,onp,reg){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();reg(x);x.open('POST',url);
    x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded)};
    x.onload=()=>res({status:x.status,text:x.responseText||''});
    x.onerror=()=>rej(Object.assign(new Error('net'),{net:true}));
    x.onabort=()=>rej(Object.assign(new Error('abort'),{abort:true}));
    x.send(fd);
  });
}
const isIpHost=h=>/^\d{1,3}(\.\d{1,3}){3}$/.test(h)||h.startsWith('[');
function wingsChk(u){
  if(cur().via!=='px')return;let h='';try{h=new URL(u).hostname}catch(e){}
  if(isIpHost(h))throw new ApiErr('Der Server-Knoten ('+h+') hat nur eine IP-Adresse. Über den Vermittler (Cloudflare) ist er nicht erreichbar – Hoch- und Herunterladen gehen so nicht. Nutze „Von Internet-Adresse laden“, SFTP in einer anderen App oder frage deinen Hoster nach einem Domainnamen für den Knoten.',{status:0});
}
function wErr(status,text,px){
  const j=tryJson(text);
  if(j&&typeof j==='object'&&['key','ip','worker','bad','setup'].includes(j.error))return mkErr(status,j,px);
  const d=(j&&typeof j==='object'&&(j.error||j.message))||(typeof j==='string'?j.slice(0,120):'');
  let m;
  if(status===413)m='Die Datei ist größer als das Upload-Limit deines Hosters (meist 100 MB). Nutze „Von Internet-Adresse laden“ oder SFTP.';
  else if(status===401||status===403)m='Der Server-Knoten hat den Zugriff abgelehnt. Der Link war vielleicht abgelaufen – bitte noch einmal versuchen.'+(d?' ('+d+')':'');
  else if(status===400)m=d||'Der Server-Knoten hat die Anfrage abgelehnt.';
  else if(status===404)m='Der Server-Knoten kennt diesen Weg nicht (Code 404).';
  else m='Der Server-Knoten meldet einen Fehler (Code '+status+').'+(d?' '+d:'');
  return new ApiErr(m,{status});
}
async function verifyBatch(j){
  try{await sleep(800);const r=lst(await api('GET',SP('/files/list'),{q:{directory:j.dir}}));const m=new Map(r.map(x=>[x.name,+x.size]));return j.files.every(x=>m.has(x.name)&&m.get(x.name)===x.size)}catch(e){return false}
}
async function uploadFiles(files){
  const f=S.fd,base=f.dir,px=cur().via==='px',CAP=px?95*1048576:400*1048576;
  const groups=new Map(),fails=[];
  for(const x of files){
    if(px&&x.size>CAP){fails.push([x.name,'größer als '+fmtB(CAP)+' (Grenze beim Upload über den Vermittler)']);continue}
    const rp=x.webkitRelativePath||'',sub=rp.includes('/')?rp.split('/').slice(0,-1).join('/'):'';
    const dir=sub?jn(base,sub):base;
    if(!groups.has(dir))groups.set(dir,[]);groups.get(dir).push(x);
  }
  const jobs=[];
  for(const[dir,arr]of groups){let cs=[],sz=0;for(const x of arr){if(cs.length&&sz+x.size>CAP){jobs.push({dir,files:cs,size:sz});cs=[];sz=0}cs.push(x);sz+=x.size}if(cs.length)jobs.push({dir,files:cs,size:sz})}
  if(!jobs.length){await info('Nichts hochgeladen',fails.map(x=>esc(x[0])+': '+esc(x[1])).join('<br>'));return}
  const have=new Set((f.items||[]).map(x=>x.name)),clash=(groups.get(base)||[]).filter(x=>have.has(x.name));
  if(clash.length&&!await yes('Dateien überschreiben?',clash.length===1?'<b>'+esc(clash[0].name)+'</b> gibt es in diesem Ordner schon. Die vorhandene Datei wird ersetzt.':'<b>'+clash.length+' Dateien</b> gibt es in diesem Ordner schon. Sie werden ersetzt.','Ersetzen',true))return;
  const total=jobs.reduce((a,j)=>a+j.size,0)||1;let doneB=0,ok=0,cancelled=false,xr=null;
  const b=busy('Hochladen','Bereite vor …');b.onCancel=()=>{cancelled=true;if(xr)try{xr.abort()}catch(e){}};
  for(const j of jobs){
    if(cancelled)break;
    const label=(j.files.length===1?j.files[0].name:j.files.length+' Dateien')+' → '+j.dir;
    b.set(label,Math.round(doneB/total*100));
    try{
      const u=att(await api('GET',SP('/files/upload'))).url;if(!u)throw new ApiErr('Das Panel hat keinen Upload-Link geliefert.');
      wingsChk(u);
      const fd=new FormData();j.files.forEach(x=>fd.append('files',x,x.name));
      const target=u+(u.includes('?')?'&':'?')+'directory='+encodeURIComponent(j.dir);
      const r=await xhrPost(viaU(target),fd,l=>b.set(label+' ('+fmtB(doneB+l)+' von '+fmtB(total)+')',Math.round((doneB+l)/total*100)),x=>xr=x);
      if(r.status<200||r.status>=300)throw wErr(r.status,r.text,px);
      ok+=j.files.length;
    }catch(e){
      if(e&&e.abort){cancelled=true;break}
      let good=false;
      if(e&&e.net&&!px)good=await verifyBatch(j);
      if(good)ok+=j.files.length;
      else{
        const m=e&&e.net?(px?'Der Vermittler oder der Server-Knoten ist nicht erreichbar.':'Keine Antwort vom Server-Knoten. Wahrscheinlich erlaubt er Zugriffe von dieser App nicht – stelle den Zugriff der Verbindung auf „Über Vermittler“.'):fe(e);
        j.files.forEach(x=>fails.push([(j.dir===base?'':j.dir+'/')+x.name,m]));
      }
    }
    doneB+=j.size;
  }
  b.close();
  if(S.fd===f&&f.dir===base)FRESH();
  if(cancelled){toast(ok?ok+' hochgeladen, Rest abgebrochen':'Abgebrochen');return}
  if(fails.length){
    const shown=fails.slice(0,6).map(x=>'<b>'+esc(x[0])+'</b><br><span class="st">'+esc(x[1])+'</span>').join('<br>')+(fails.length>6?'<br>… und '+(fails.length-6)+' weitere':'');
    await info('Nicht alles hochgeladen',(ok?ok+' Datei'+(ok>1?'en':'')+' wurde'+(ok>1?'n':'')+' hochgeladen. ':'')+'Bei diesen gab es Fehler:<br><br>'+shown);
  }else toast(ok+(ok===1?' Datei':' Dateien')+' hochgeladen');
}

async function fDownload(path,name,size){
  const px=cur().via==='px';
  const getUrl=async()=>{const u=att(await api('GET',SP('/files/download'),{q:{file:path}})).url;if(!u)throw new ApiErr('Das Panel hat keinen Download-Link geliefert.');wingsChk(u);return viaU(u)};
  await act(async()=>{
    if(px&&(DL||(size!=null&&size<=24*1048576))){
      let blob=null;
      try{const r=await fetch(await getUrl());if(!r.ok){const t=await r.text();throw wErr(r.status,t,true)}blob=await r.blob()}
      catch(e){if(e instanceof ApiErr)throw e;blob=null}
      if(blob){await saveFile(name,blob);toast('Gespeichert');return}
    }
    const a=document.createElement('a');a.href=await getUrl();a.download=name;a.rel='noopener';document.body.append(a);a.click();a.remove();
    toast('Download gestartet');
  });
}

async function taskForm(x,t){

  const f=[];

  else if(a==='power')f.push({id:'p',type:'select',label:'Aktion',value:t?t.payload:'restart',opts:[['start','Starten'],['restart','Neustarten'],['stop','Stoppen'],['kill','Beenden erzwingen']]});

const MR='https://api.modrinth.com/v2';
const LOADERS={paper:['paper','purpur','spigot','bukkit','folia'],fabric:['fabric']};
const LNAME={paper:'Paper/Spigot (Plugins)',fabric:'Fabric (Mods)'};
const isMc=s=>/java|\.jar\b/i.test((s&&(s.inv||s.image))||'');
const enc2=encodeURIComponent;
// Art (Paper/Fabric) und Minecraft-Version eines Servers erkennen
async function mcInfo(p,id){
  const sp=x=>'/servers/'+enc2(id)+x;
  const root=lst(await api('GET',sp('/files/list'),{p,q:{directory:'/'}})).map(mapF),has=n=>root.some(x=>x.name===n&&!x.file);
  let loader=has('plugins')?'paper':has('mods')?'fabric':null,ver=null,txt=async f=>{try{return String(await api('GET',sp('/files/contents'),{p,q:{file:f},as:'text',timeout:20000})||'')}catch(e){return''}};
  if(!loader){if(root.some(x=>/fabric/i.test(x.name)||x.name==='.fabric'))loader='fabric';else if(root.some(x=>/paper|purpur|spigot|bukkit/i.test(x.name)||x.name==='version_history.json'))loader='paper'}
  const vh=root.some(x=>x.name==='version_history.json')?await txt('/version_history.json'):'';let m=/MC:\s*([\w.\-]+)\)/.exec(vh);if(m)ver=m[1];
  if(!ver||!loader){const lg=await txt('/logs/latest.log');m=/Starting minecraft server version ([\w.\-]+)/.exec(lg);if(m&&!ver)ver=m[1];if(!loader&&/Paper|Purpur|Spigot|Bukkit|CraftBukkit/.test(lg))loader='paper';if(!loader&&/Fabric Loader|fabricloader/i.test(lg))loader='fabric'}
  if(!ver){try{const v=lst(await api('GET',sp('/startup'),{p})).find(x=>/MINECRAFT_VERSION|MC_VERSION|^VERSION$/.test(x.env_variable||''));const val=v&&(v.server_value||v.default_value);if(val&&/^\d/.test(val))ver=val}catch(e){}}
  return{loader,version:ver,dir:loader==='fabric'?'/mods':'/plugins'};
}
async function mrGet(u){let r;try{r=await fetch(MR+u)}catch(e){throw new ApiErr('Modrinth ist nicht erreichbar (Internet?).')}if(r.status===404)return null;if(!r.ok)throw new ApiErr('Modrinth antwortet nicht richtig ('+r.status+').');return r.json()}
async function mrSearch(q,info,limit){
  if(!info||!info.loader)throw new ApiErr('Auf diesem Server lassen sich keine Plugins installieren (Vanilla). Nimm Paper oder Fabric.');
  const fac=[[info.loader==='fabric'?'project_type:mod':'project_type:plugin'],LOADERS[info.loader].map(l=>'categories:'+l)];if(info.version)fac.push(['versions:'+info.version]);
  const j=await mrGet('/search?limit='+(limit||12)+'&index=relevance&query='+enc2(q||'')+'&facets='+enc2(JSON.stringify(fac)));
  return(j&&j.hits||[]).map(h=>({id:h.project_id,slug:h.slug,title:h.title,desc:h.description||'',dl:h.downloads||0,icon:h.icon_url||'',author:h.author||''}))}
async function mrVersion(project,info){
  const l=await mrGet('/project/'+enc2(project)+'/version?loaders='+enc2(JSON.stringify(LOADERS[info.loader]))+(info.version?'&game_versions='+enc2(JSON.stringify([info.version])):''));
  if(l===null)throw new ApiErr('„'+project+'“ gibt es auf Modrinth nicht. Suche zuerst nach dem richtigen Namen.');
  const v=l.find(x=>x.version_type==='release')||l[0];

      if(!call){m.c=txt||m.c;if(a.tools!==false&&!ac.signal.aborted){call=findCall(m.c,true);if(call)m.c=m.c.slice(0,call.end)}}
      delete m.live;if(ac.signal.aborted)m.stop=1;
      if(!call||ac.signal.aborted){paintMsgs();break}
      m.call=call.n;paintMsgs();
      const res=await runTool(a,call,ac.signal);delete m.call;
      c.msgs.push({r:'t',n:call.n,c:res.out,ok:res.ok,l:res.l,p:res.p,ts:Date.now()});
      if(res.mem)toast('🧠 '+res.l.slice(0,60));
      c.t=Date.now();CHS.put(c).catch(()=>{});paintMsgs();
      if(step===7)c.msgs.push({r:'e',c:'Der Agent hat sehr viele Schritte gebraucht und wurde angehalten. Schreib „weiter“, wenn er fortfahren soll.'});
    }
  }catch(e){const m=c.msgs[c.msgs.length-1];if(m&&m.r==='a'){delete m.live;delete m.call;if(!m.c)c.msgs.pop()}c.msgs.push({r:'e',c:errText(a,e)})}
  finally{
    if(a.auto&&!ac.signal.aborted&&lastText(c)){try{const n=await autoLearn(a,c,ac.signal);if(n)toast('🧠 '+n+(n>1?' neue Einträge':' neuer Eintrag')+' im Wissen')}catch(e){}}
    R.ac=null;setBusy(false);wake(false);c.t=Date.now();
    try{await CHS.put(c)}catch(e){toast('Chat konnte nicht gespeichert werden: '+fe(e))}
    paintMsgs();if(document.hidden)notify(a.name,(lastText(c)||'Antwort ist fertig').slice(0,120));
  }
}
function errText(a,e){let m=fe(e);

  else if(/f16|shader-f16/i.test(m))m+=' – Dein Grafikchip kann diese Modell-Variante nicht. Installiere eine andere (Universal).';
  return m}
// Wissen aus dem Chat herausschreiben lassen
async function learn(a,c,quick,sig){
  const ms=c.msgs.filter(m=>m.r==='u'||(m.r==='a'&&hideCalls(stripTh(m.c)).trim())),part=quick?ms.slice(-2):ms.slice(-14);
  const conv=part.map(m=>(m.r==='u'?'Nutzer: ':'Assistent: ')+cut(hideCalls(stripTh(m.c)).trim(),700)).join('\n');
  const kn=memFor(a),sys='Du schreibst aus Gesprächen dauerhafte Fakten über den Nutzer heraus. Du erfindest nichts.';
  const q=`Gespräch:\n${conv}\n\nBereits bekannt:\n${kn.map(m=>'- '+m.t).join('\n')||'(nichts)'}\n\nNenne NEUE, dauerhafte Fakten über den Nutzer, die er selbst gesagt hat (z. B. Name, Wohnort, Beruf, Familie, Haustiere, Vorlieben, Abneigungen, Ziele, wichtige Termine). Pro Zeile ein kurzer Fakt, beginnend mit "- ", in der dritten Person (z. B. "- Heißt Max."). Gibt es keine neuen Fakten, antworte nur: KEINE`;
  const out=await gen(a,/gemma/i.test(a.model)?[{role:'user',content:sys+'\n\n'+q}]:[{role:'system',content:sys},{role:'user',content:q}],{temp:0.1,max:220,signal:sig});
  const have=new Set(kn.map(m=>m.t.toLowerCase()));
  return[...new Set(stripTh(out).split('\n').map(l=>l.trim()).filter(l=>/^([-*•]|\d+[.)])\s+/.test(l)).map(l=>l.replace(/^([-*•]|\d+[.)])\s+/,'').replace(/\*\*/g,'').trim())
    .filter(l=>l.length>2&&l.length<220&&!/^keine\b/i.test(l)&&!have.has(l.toLowerCase())))].slice(0,10);
}

function inl(s){
  return esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>')
    .replace(/^#{1,6}\s+(.+)$/gm,'<b class="ai-h">$1</b>').replace(/^(\s*)[-*]\s+/gm,'$1• ')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[^"'>=])(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function md(t){return String(t).split('```').map((p,i)=>{if(!(i%2))return inl(p);const nl=p.indexOf('\n'),lg=nl>=0&&nl<24?p.slice(0,nl).trim():'',cd=nl>=0&&nl<24?p.slice(nl+1):p;
  return`<pre class="ai-code">${lg?`<span>${esc(lg)}</span>`:''}<code>${esc(cd.replace(/\n$/,''))}</code></pre>`}).join('')}
function aHtml(m){
  const sp=splitTh(m.c||''),th=sp.th.trim();let t=hideCalls(sp.body);if(m.live)t=t.replace(/<[a-z_\/][^>\n]*$/i,'');t=t.trim();
  let h='';
  if(th){const thinking=m.live&&!t;h+=`<details class="ai-th"${thinking?' open':''}><summary>${thinking?'💭 Denkt nach …':'💭 Gedanken anzeigen'}</summary>${esc(th)}</details>`}
  if(t)h+=md(t);
  if(m.call)h+=`<div class="ai-hint">${ico(TI[m.call]||'sliders',13)} ${esc(TLB[m.call]||m.call)} …</div>`;
  if(!h)h=m.live?'<span class="ai-dots"><i></i><i></i><i></i></span>':'<span style="color:var(--mu)">(keine Antwort)</span>';
  if(m.stop)h+='<div class="ai-hint">⏹ gestoppt</div>';
  return h}

  let s=null;
  const skip=t=>t.closest&&t.closest('.ov,canvas,input[type=range],.cons,.edt,textarea,.sheet .srcbox');
  addEventListener('touchstart',e=>{const t=e.touches[0];s=null;
    if(e.touches.length!==1||t.clientX>24||skip(e.target))return;
    if(view.hidden&&!document.querySelector('.sheetbg'))return;
    s={x:t.clientX,y:t.clientY,dx:0}},{passive:true});
  addEventListener('touchmove',e=>{if(!s)return;const t=e.touches[0],dx=t.clientX-s.x,dy=Math.abs(t.clientY-s.y);
    if(dy>50&&dy>dx){s=null;ind.style.opacity=0;return}
    s.dx=dx;const k=Math.max(0,Math.min(1,dx/90));ind.style.opacity=k;ind.style.transform=`translateX(${Math.min(dx,90)*0.7}px) scale(${0.7+k*0.3})`;ind.classList.toggle('on',dx>=90)},{passive:true});
  const end=()=>{if(!s)return;const go=s.dx>=90;s=null;ind.style.opacity=0;ind.style.transform='';ind.classList.remove('on');
    if(go){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}if(NAV.armed)history.back();else goBack()}};
  addEventListener('touchend',end,{passive:true});addEventListener('touchcancel',()=>{s=null;ind.style.opacity=0},{passive:true});
})();

/* ---------- Start ---------- */
menu.innerHTML=TOOLS.map((t,i)=>t.sys?'':`<button class="card" data-i="${i}"><span class="ib">${ico(t.icon,22)}</span><span class="tx"><b>${t.title}</b><small>${t.desc}</small></span>${ico('chev',18)}</button>`).join('');
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
