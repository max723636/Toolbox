<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--ac:var(--acl,#4f46e5);--ac2:color-mix(in srgb,var(--ac) 12%,var(--cd));--on:#fff;--bd:#e4e7f0;--er:#dc2626;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}}
:root[data-theme="dark"]{--bg:#0b0f19;--cd:#131a2a;--tx:#e8ecf7;--mu:#8b97b3;--ac:var(--acd,#818cf8);--ac2:color-mix(in srgb,var(--ac) 16%,var(--cd));--on:#0b0f19;--bd:#242d44;--er:#f87171;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}header p{margin:0;font-size:13px;color:var(--mu)}
.logo,.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ac);color:var(--on);flex:none}
.ib{background:var(--ac2);color:var(--ac)}.ib.sm{width:36px;height:36px;border-radius:10px}
main{padding:4px 16px 40px;max-width:640px;margin:auto}
#menu{display:grid;gap:10px}
.card,.sty,.item,.dt,.pick{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;color:inherit;font:inherit;cursor:pointer}
.card>svg{color:var(--mu)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600}
.tx small{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
input[type=color]{padding:3px;height:44px}
textarea{resize:vertical}
.btn,.iconbtn,.seg button{font:inherit;font-weight:600;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;margin-top:14px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn:disabled{opacity:.45}
.btn.warn,.iconbtn.warn{color:var(--er);border-color:var(--er)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;font-size:12px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.grid2 .btn,.grid2 .pick{margin-top:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--ac2);border-radius:12px}
.seg button{flex:1;padding:9px;border:0;background:none;color:var(--mu)}.seg .on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;font-size:14px;font-weight:500;color:var(--tx);border-style:dashed;cursor:pointer;text-align:center}
.pick svg{color:var(--ac)}
.chip{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.st{margin:10px 0 0;font-size:13px;color:var(--mu)}.err{color:var(--er)}
.foot{display:flex;gap:8px;align-items:center;margin:22px 0 0;font-size:12px;color:var(--mu)}.foot svg{flex:none}
.qr{display:flex;justify-content:center;margin:16px 0 0;padding:14px;background:#fff;border-radius:var(--r);border:1px solid var(--bd)}.qr:empty{display:none}
.qr img,.qr canvas{max-width:100%;height:auto}
.rows,.list{display:grid;gap:10px;margin-top:14px}
.sty,.item{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.out{font-size:19px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.dt{margin-top:18px;padding:4px 14px 16px}.dt summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;align-items:center;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;color:var(--mu);margin-bottom:2px}
.crumbs button{font:inherit;font-size:13px;background:none;border:0;color:var(--mu);padding:4px 6px;border-radius:8px;cursor:pointer}.crumbs .on{color:var(--tx);font-weight:600}
.itb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow .btn{width:auto;margin:0}
.empty{text-align:center;color:var(--mu);padding:32px 12px}
.ti{font-size:18px;font-weight:600;margin-top:14px}.bd{min-height:46vh;margin-top:10px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;pointer-events:none;transition:.2s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sws{display:flex;gap:12px;margin-top:2px}.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--cd);cursor:pointer;box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
#gear{margin-left:auto}.vt{font-size:20px;font-weight:700;margin:16px 0 8px;overflow-wrap:anywhere}
.vb{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;min-height:30vh}.vb a{color:var(--ac);text-decoration:underline;text-underline-offset:2px}
#bk{margin-top:28px}#bk h2{font-size:15px;font-weight:700;margin:0}#bk h2+.st{margin-top:2px}
.pick{position:relative}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-top:10px}
.ms{display:flex;flex-direction:column;gap:8px;height:50vh;overflow-y:auto;padding:12px;margin-top:12px;background:var(--cd);border:1px solid var(--bd);border-radius:var(--r)}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--ac2);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--ac);color:var(--on)}
.bub.sy{align-self:center;background:none;color:var(--mu);font-size:12px;padding:2px;text-align:center}
.bub small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.cin{display:flex;gap:8px;margin-top:10px}.cin .btn{width:auto;margin:0}
/* Video-Tool */
.vpv{position:relative;margin:14px auto 0;width:min(100%,calc(52vh*var(--ar,.5625)));aspect-ratio:var(--ar,.5625);background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd)}
.vpv .vvid,.vpv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.ov{position:absolute;inset:0;user-select:none;-webkit-user-select:none}
.ov .sh{position:absolute;background:rgba(0,0,0,.62);pointer-events:none}
.rb{position:absolute;border:2px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(0,0,0,.55);pointer-events:none}
.rb.sel{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 24%,transparent)}
.rb span{position:absolute;left:3px;top:0;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.hd{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ac);border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6)}
.hd.a{left:-9px;top:-9px}.hd.b{right:-9px;top:-9px}.hd.c{left:-9px;bottom:-9px}.hd.d{right:-9px;bottom:-9px}
.tl{display:flex;align-items:center;gap:8px;margin-top:10px}.tl input{flex:1}
input[type=range]{padding:0;border:0;background:none;height:30px;accent-color:var(--ac)}input[type=range]:focus{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipb{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}.chipb.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.kc{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--cd)}.kc button{font:inherit;font-size:13px;padding:7px 11px;border:0;background:none;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center}.kc button+button{border-left:1px solid var(--bd);color:var(--mu);padding:7px 9px}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px;margin:16px 0 0}.chk input{width:20px;height:20px;padding:0;accent-color:var(--ac)}
.prog{height:10px;border-radius:99px;background:var(--ac2);overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.res{margin-top:16px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#000;display:grid;place-items:center}.res img,.res video{max-width:100%;max-height:60vh;display:block}
.lock{pointer-events:none;opacity:.55}
.stk.on{position:sticky;z-index:4;background:var(--bg);padding-bottom:6px}.stk.on .vpv{width:min(100%,calc(36vh*var(--ar,.5625)));margin-top:0}
.dt summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin-top:-3px;flex:none}.dt[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.btn:disabled{pointer-events:none}
.grid2:has(>#vqw[hidden]){grid-template-columns:1fr}
/* Server-Modul */
.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none;display:inline-block}
.dot.run{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.2)}.dot.mid{background:#d97706;box-shadow:0 0 0 3px rgba(217,119,6,.2)}.dot.bad{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ac2);color:var(--tx);white-space:nowrap}
.sv-h{display:flex;align-items:center;gap:10px;margin-top:6px}.sv-h h2{margin:0;font-size:19px;font-weight:700;overflow-wrap:anywhere;flex:1;min-width:0}
.sv-sub{color:var(--mu);font-size:13px;margin:2px 0 0;overflow-wrap:anywhere}
.pw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.pw .btn{margin:0;padding:10px 4px;font-size:13px;gap:5px;flex-direction:column}
.pw .btn svg{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;min-width:0}
.stat small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:99px;background:var(--ac2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .5s}
.bar.hi i{background:#d97706}.bar.cr i{background:#dc2626}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-top:10px;scrollbar-width:none;position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--bg);z-index:3}
.tabs::-webkit-scrollbar{display:none}.tabs .chipb{flex:none;display:inline-flex;align-items:center;gap:6px}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,#d97706 14%,var(--cd));border:1px solid color-mix(in srgb,#d97706 40%,var(--bd));color:var(--tx)}
.banner.er{background:color-mix(in srgb,var(--er) 12%,var(--cd));border-color:color-mix(in srgb,var(--er) 40%,var(--bd))}
.banner.ok{background:color-mix(in srgb,#16a34a 12%,var(--cd));border-color:color-mix(in srgb,#16a34a 40%,var(--bd))}
.banner b{font-weight:600}
.cons{background:#0b0f14;color:#d6deeb;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border-radius:var(--r);padding:10px;height:52vh;min-height:240px;overflow:auto;border:1px solid var(--bd);margin-top:10px;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.cons .l{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}.cons .dm{color:#fbbf24}.cons .er{color:#f87171}.cons .ins{color:#a3a3a3}.cons .si{color:#7dd3fc}
.cin input{font:13px ui-monospace,Menlo,Consolas,monospace}
.newl{position:sticky;bottom:6px;margin:-30px 0 0 auto;display:block;width:max-content;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--ac);color:var(--on);border:0;cursor:pointer;z-index:2}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--bg);color:var(--tx);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.35);border:1px solid var(--bd);border-bottom:0}
.sheet h3{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}.sheet .st{margin-top:4px}
.sheet .grid2 .btn{margin-top:14px}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mnu{display:grid;gap:6px;margin-top:10px}.mnu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:500;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer}
.mnu button svg{color:var(--ac);flex:none}.mnu button.warn{color:var(--er)}.mnu button.warn svg{color:var(--er)}
.fi{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px}
.fi .itb{padding:2px 0}.fi .tx small{white-space:nowrap}
.fi .ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--mu);border-radius:7px;background:transparent;display:grid;place-content:center;cursor:pointer;padding:0;margin:0}.fi .ck:checked{background:var(--ac);border-color:var(--ac)}.fi .ck:checked::after{content:'';width:5px;height:10px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fbar .iconbtn{height:40px;min-width:40px;padding:0 12px;gap:6px;display:inline-flex}
.fbar .iconbtn svg{flex:none}
.selbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:4}
.selbar .tx{flex:1}.selbar .iconbtn{height:38px}
.edt{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:58vh;white-space:pre;overflow:auto;tab-size:4;-moz-tab-size:4}
.edt.wr{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}.kv>span:nth-child(3n+1){color:var(--mu);font-size:13px}.kv>span:nth-child(3n+2){overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.step{display:flex;gap:12px;margin-top:14px}.step>b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:14px}
.step>div{min-width:0;flex:1}.step p{margin:2px 0 0;font-size:14px}.step .st{margin-top:4px}
.srcbox{font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:150px;overflow:auto;white-space:pre;margin-top:8px;-webkit-user-select:all;user-select:all}
.chk2{display:flex;align-items:flex-start;gap:8px;margin-top:6px;font-size:14px}.chk2 span{flex:1}
.ok2{color:#16a34a}.er2{color:var(--er)}
.diag{display:grid;gap:8px;margin-top:12px}.diag>div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);font-size:14px}.diag>div>span:first-child{flex:none;font-weight:700;width:18px;text-align:center}.diag small{display:block;color:var(--mu);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.minip{display:inline-flex;gap:6px;align-items:center;color:var(--mu);font-size:12px}
.prgw{margin-top:12px}.prgw p{margin:0 0 6px;font-size:14px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-left:6px;vertical-align:middle}
.tag.w{background:color-mix(in srgb,#d97706 18%,var(--cd));color:#b45309}.tag.g{background:color-mix(in srgb,#16a34a 16%,var(--cd));color:#15803d}.tag.r{background:color-mix(in srgb,var(--er) 15%,var(--cd));color:var(--er)}
.sw2{position:relative;display:inline-block;width:46px;height:28px;flex:none}.sw2 input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;padding:0}.sw2 i{position:absolute;inset:0;border-radius:99px;background:var(--bd);transition:.2s}.sw2 i::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw2 input:checked+i{background:var(--ac)}.sw2 input:checked+i::after{left:21px}
.sv-row{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sv-row .tx small{white-space:normal}
.mini{font-size:12px;color:var(--mu);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.pbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--ac);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.pbtn:disabled{opacity:.4}
#view[data-t="Server"] .list,#view[data-t="Server"] .rows{grid-template-columns:minmax(0,1fr)}
.stat em{display:block;font-style:normal;color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pxi{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);font-size:13px}
.pxi svg{flex:none;color:var(--mu)}.pxi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pxi .btn{width:auto;margin:0;padding:6px 12px;font-size:13px}
/* AI Agents */
.ai-ag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;font:inherit;color:inherit;cursor:pointer;margin-top:4px}
.ai-ag .tx small{white-space:nowrap}
.ai-cb{display:flex;gap:6px;align-items:center;margin-top:4px}.ai-cb .iconbtn{height:38px;gap:6px}.ai-cb .sp{flex:1;min-width:0;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn.on{background:var(--ac);border-color:var(--ac);color:var(--on)}

// =====================================================================
//  Toolbox-Vermittler  ·  läuft kostenlos auf Cloudflare Workers
//  Er leitet Anfragen der Toolbox-App an dein Pterodactyl-Panel weiter
//  und erlaubt dem Browser den Zugriff (CORS). Ohne den geheimen
//  Schlüssel unten antwortet er niemandem. Den Schlüssel nicht weitergeben!
// =====================================================================
const KEY = "__KEY__";
const VERSION = 1;

const UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36";
// Diese Angaben werden nie an das Ziel weitergegeben.
const SKIP = /^(host|cookie|origin|referer|connection|upgrade|keep-alive|transfer-encoding|accept-encoding|te|trailer|expect|proxy-.*|cf-.*|x-forwarded-.*|x-real-ip|true-client-ip|sec-.*|x-tb-.*|access-control-.*)$/i;
// Diese Angaben der Antwort gehen zurück an die App.
const BACK = ["content-type", "content-disposition", "content-range", "accept-ranges", "etag", "last-modified"];

export default {
  async fetch(request) {
    try {
      return await handle(request);
    } catch (e) {
      return reply(request, 502, { error: "worker", message: String((e && e.message) || e) });
    }
  },
};

function baseHeaders(request, extra) {
  const h = new Headers(extra || {});
  h.set("Access-Control-Allow-Origin", request.headers.get("Origin") || "*");
  h.set("Vary", "Origin");
  h.set("Access-Control-Expose-Headers", "Content-Disposition, Content-Length, Content-Type, Content-Range, X-TB");
  h.set("Cache-Control", "no-store");
  h.set("X-TB", String(VERSION));
  return h;
}

function reply(request, status, obj) {
  return new Response(JSON.stringify(obj), {
    status,
    headers: baseHeaders(request, { "Content-Type": "application/json; charset=utf-8" }),
  });
}

// Prüft das Ziel: nur öffentliche Webadressen mit Domainnamen.
function checkTarget(target, selfHost) {
  let t;
  try { t = new URL(target); } catch (e) { return ["bad", "Die Zieladresse ist ungültig."]; }
  if (!/^(https?|wss?):$/.test(t.protocol)) return ["bad", "Nur http(s)- und ws(s)-Adressen sind erlaubt."];
  const h = t.hostname.toLowerCase();
  if (h === "localhost" || h.endsWith(".local") || h.endsWith(".internal") || h === selfHost) return ["bad", "Diese Adresse ist nicht erlaubt."];
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h) || h.startsWith("[")) {
    return ["ip", "Cloudflare kann keine reinen IP-Adressen ansprechen. Der Server braucht einen Domainnamen."];
  }
  return null;
}

async function handle(request) {
  const url = new URL(request.url);

  // Vorab-Anfrage des Browsers (CORS)
  if (request.method === "OPTIONS") {
    return new Response(null, {
      status: 204,
      headers: baseHeaders(request, {
        "Access-Control-Allow-Methods": "GET, POST, PUT, PATCH, DELETE, OPTIONS",
        "Access-Control-Allow-Headers": request.headers.get("Access-Control-Request-Headers") || "*",
        "Access-Control-Max-Age": "86400",
      }),
    });
  }

  const ws = (request.headers.get("Upgrade") || "").toLowerCase() === "websocket";

  // Wer die Adresse im Browser öffnet, sieht nur diesen Hinweis.
  if (!ws && request.method === "GET" && !url.searchParams.has("k") && !url.searchParams.has("u")) {
    return new Response("Toolbox-Vermittler aktiv (Version " + VERSION + ")", {
      status: 200,
      headers: { "Content-Type": "text/plain; charset=utf-8", "Cache-Control": "no-store" },
    });
  }

  if (!KEY || KEY.length < 16 || KEY === "__KEY__") {
    return reply(request, 500, { error: "setup", message: "Im Worker-Code fehlt der Schlüssel." });
  }

  let key, target, method = request.method, headers = {}, body, origin, raw = true;

  if (!ws && method === "POST" && !url.searchParams.has("u") && !url.searchParams.has("k")) {
    // Paket-Modus: ein einfacher POST mit JSON-Text (spart dem Browser die Vorab-Anfrage)
    let env;
    try { env = JSON.parse(await request.text()); } catch (e) { return reply(request, 400, { error: "bad", message: "Ungültige Anfrage." }); }
    if (!env || typeof env !== "object") return reply(request, 400, { error: "bad", message: "Ungültige Anfrage." });
    raw = false;
    key = env.k; target = env.u; method = String(env.m || "GET").toUpperCase();
    headers = env.h || {}; body = env.b == null ? undefined : env.b; origin = env.o;
  } else {
    key = url.searchParams.get("k") || request.headers.get("X-TB-Key");
    target = url.searchParams.get("u");
    origin = url.searchParams.get("o");
  }

  if (key !== KEY) return reply(request, 401, { error: "key", message: "Falscher Schlüssel." });
  if (!target) return reply(request, 200, { ok: true, ver: VERSION }); // Verbindungstest

  const bad = checkTarget(target, url.hostname.toLowerCase());
  if (bad) return reply(request, 400, { error: bad[0], message: bad[1] });
  const outUrl = target.replace(/^ws(s?):/i, "http$1:");

  // ---- Live-Konsole (WebSocket): wird direkt durchgereicht ----
  if (ws || method === "WSPROBE") {
    const h = new Headers({ Upgrade: "websocket", "User-Agent": request.headers.get("User-Agent") || UA });
    if (origin) h.set("Origin", origin);
    const r = await fetch(outUrl, { headers: h });
    if (method === "WSPROBE") {
      if (r.webSocket) { try { r.webSocket.accept(); r.webSocket.close(1000, "probe"); } catch (e) {} }
      return reply(request, 200, { status: r.status, ok: r.status === 101 });
    }
    if (r.status !== 101 || !r.webSocket) {
      return new Response("Der Server hat die Verbindung abgelehnt (" + r.status + ").", { status: r.status === 101 ? 502 : r.status, headers: baseHeaders(request) });
    }
    return r;
  }

  // ---- normale Anfrage ----
  let res;
  if (raw) {
    const req = new Request(outUrl, request);
    for (const k of [...req.headers.keys()]) if (SKIP.test(k)) req.headers.delete(k);
    if (!req.headers.has("user-agent")) req.headers.set("User-Agent", UA);
    if (origin) req.headers.set("Origin", origin);
    res = await fetch(req);
  } else {
    const out = new Headers();
    for (const k of Object.keys(headers)) if (!SKIP.test(k)) out.set(k, String(headers[k]));
    if (!out.has("user-agent")) out.set("User-Agent", request.headers.get("User-Agent") || UA);
    if (origin) out.set("Origin", origin);
    const init = { method, headers: out };
    if (body !== undefined && method !== "GET" && method !== "HEAD") init.body = body;
    res = await fetch(outUrl, init);
  }

  const h = baseHeaders(request);
  for (const k of BACK) { const v = res.headers.get(k); if (v) h.set(k, v); }
  const cl = res.headers.get("content-length");
  if (cl && !res.headers.get("content-encoding")) h.set("Content-Length", cl);
  return new Response(res.body, { status: res.status, statusText: res.statusText, headers: h });
}

async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data]);

/* ---------- Krypto (Web Crypto, Schlüssel per PBKDF2) ---------- */
const ALGS={aes256gcm:{n:'AES-256-GCM (empfohlen)',a:'AES-GCM',l:256,iv:12,id:1},aes128gcm:{n:'AES-128-GCM',a:'AES-GCM',l:128,iv:12,id:2},aes256cbc:{n:'AES-256-CBC',a:'AES-CBC',l:256,iv:16,id:3},aes256ctr:{n:'AES-256-CTR',a:'AES-CTR',l:256,iv:16,id:4}};
async function deriveKey(pw,salt,it,al){
  const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,{name:al.a,length:al.l},false,['encrypt','decrypt']);
}
const prm=(al,iv)=>al.a==='AES-CTR'?{name:al.a,counter:iv,length:64}:{name:al.a,iv};
async function encryptBytes(name,data,pw,alg){
  const al=ALGS[alg],IT=600000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(al.iv));
  const nb=enc.encode(name),p=new Uint8Array(6+nb.length+data.length);
  p.set(enc.encode('TBXP'));new DataView(p.buffer).setUint16(4,nb.length);p.set(nb,6);p.set(data,6+nb.length);
  const ct=new Uint8Array(await crypto.subtle.encrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),p));
  const h=new Uint8Array(25+al.iv);h.set(enc.encode('TBX1'));h[4]=al.id;new DataView(h.buffer).setUint32(5,IT);h.set(salt,9);h.set(iv,25);
  return new Blob([h,ct]);
}
async function decryptBytes(buf,pw){
  const u=new Uint8Array(buf);
  if(dec.decode(u.slice(0,4))!=='TBX1')throw Error('Das ist keine mit dieser App verschlüsselte Datei.');
  const al=Object.values(ALGS).find(a=>a.id===u[4]);if(!al)throw Error('Unbekanntes Verfahren.');
  const IT=new DataView(buf).getUint32(5),salt=u.slice(9,25),iv=u.slice(25,25+al.iv),bad='Falsches Passwort oder beschädigte Datei.';
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt(prm(al,iv),await deriveKey(pw,salt,IT,al),u.slice(25+al.iv)))}catch(e){throw Error(bad)}
  if(dec.decode(p.slice(0,4))!=='TBXP')throw Error(bad);
  const nl=new DataView(p.buffer).getUint16(4);
  return{name:dec.decode(p.slice(6,6+nl)),data:p.slice(6+nl)};
}

tool({icon:'lock',title:'Verschlüsseln',desc:'Dateien & Ordner mit Passwort schützen',mount(el){
  el.innerHTML=`<div class="seg"><button class="on" data-m="e">Verschlüsseln</button><button data-m="d">Entschlüsseln</button></div>
  <div class="grid2"><div class="pick">${ico('file',22)}<span>Dateien wählen</span><input id="f" type="file" multiple></div><div class="pick" id="fl">${ico('folder',22)}<span>Ordner wählen</span><input id="fo" type="file" webkitdirectory multiple></div></div>

  <div id="al"><label>Verfahren</label><select id="a">${Object.entries(ALGS).map(([k,v])=>`<option value="${k}"${k===SET.alg?' selected':''}>${v.n}</option>`).join('')}</select></div>
  <button id="go" class="btn pri">Verschlüsseln</button><p id="st" class="st"></p>
  <p class="foot">${ico('lock',14)}<span>Alles läuft nur auf deinem Gerät. Schlüsselableitung: PBKDF2, 600.000 Runden.</span></p>`;
  const q=s=>$(s,el),st=q('#st'),sel=q('#sel'),go=q('#go');let mode='e',files=[];
  const setFiles=fl=>{files=[...fl];const tot=files.reduce((s,f)=>s+f.size,0);
    sel.textContent=files.length?(files.length>1?files.length+' Dateien':files[0].name)+' · '+(tot/1048576).toFixed(1)+' MB':'Nichts ausgewählt'};
  [q('#f'),q('#fo')].forEach(i=>i.onchange=()=>{if(i.files.length)setFiles(i.files);i.value=''});
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
    el.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
    q('#fl').hidden=q('#p2l').hidden=q('#al').hidden=mode==='d';
    go.textContent=mode==='e'?'Verschlüsseln':'Entschlüsseln';files=[];sel.textContent='Nichts ausgewählt';say(st,'')});
  go.onclick=async()=>{
    const pw=q('#p').value;
    if(!files.length)return say(st,'Bitte zuerst Datei(en) wählen.',1);
    if(!pw)return say(st,'Bitte ein Passwort eingeben.',1);
    go.disabled=true;say(st,'Arbeite … (große Dateien brauchen etwas)');
    try{
      if(mode==='e'){
        if(pw!==q('#p2').value)throw Error('Die Passwörter stimmen nicht überein.');
        let name,data;

          name=(files[0].webkitRelativePath.split('/')[0]||'Dateien')+'.zip';
          data=await z.generateAsync({type:'uint8array',compression:'STORE'});

        const out=await encryptBytes(name,data,pw,q('#a').value);
        done(st,name+'.enc',await saveFile(name+'.enc',out));
      }else{
        const r=await decryptBytes(await files[0].arrayBuffer(),pw);
        done(st,r.name,await saveFile(r.name,new Blob([r.data])));
      }

  };
}});

/* ---------- Tool 5: Chat (direkt per WebRTC, ohne Server) ---------- */
const CH={step:'start',msgs:[],code:'',peer:'',open:false,wait:0,err:'',name:store.get('tb_chat',{}).n||'',upd(){}};
const b64=u=>btoa(String.fromCharCode(...u));
async function pack(sdp){const j=enc.encode(JSON.stringify({s:sdp}));
  if(window.CompressionStream){const r=new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('deflate-raw')));return 'z'+b64(new Uint8Array(await r.arrayBuffer()))}
  return 'r'+b64(j)}
async function unpack(c){c=c.replace(/\s+/g,'');const u=Uint8Array.from(atob(c.slice(1)),x=>x.charCodeAt(0));
  const t=c[0]==='z'?await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text():dec.decode(u);
  return JSON.parse(t).s}
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,6000)});
async function notify(t,b){if(SET.nt!=='on'||!('Notification' in window)||Notification.permission!=='granted')return;
  try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(t,{body:b,icon:'icon-192.png',tag:'tb-chat'});else new Notification(t,{body:b})}catch(e){}}

const sysmsg=x=>{CH.msgs.push({s:1,x});CH.upd()};
function wire(dc){
  dc.onopen=()=>{CH.dc=dc;CH.open=true;CH.wait=0;CH.err='';CH.step='chat';dc.send(JSON.stringify({t:'h',n:CH.name||'Gast'}));sysmsg('Verbunden – direkt und verschlüsselt.');if(document.hidden)notify('Chat verbunden','Die Verbindung steht – du kannst jetzt schreiben.')};
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='h'){CH.peer=String(m.n||'Gast').slice(0,24);sysmsg(CH.peer+' ist online.')}
    else if(m.t==='m'){const x=String(m.x).slice(0,4000);CH.msgs.push({x,ts:Date.now()});if(view.dataset.t==='Chat')CH.upd();else toast((CH.peer||'Chat')+': '+x.slice(0,50));if(document.hidden)notify('Chat: '+(CH.peer||'Neue Nachricht'),x.slice(0,120))}};
  dc.onclose=()=>{if(CH.dc===dc){CH.open=false;sysmsg('Verbindung getrennt.')}}}
function newPc(){const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}]});CH.pc=pc;
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'){CH.open=false;CH.wait=0;CH.err='Verbindung fehlgeschlagen – manche Netze (z. B. Mobilfunk) blockieren Direktverbindungen. Versuche es im WLAN.';CH.upd()}};return pc}
function hang(){try{CH.dc&&CH.dc.close();CH.pc&&CH.pc.close()}catch(e){}Object.assign(CH,{step:'start',msgs:[],code:'',peer:'',open:false,dc:null,pc:null,err:'',wait:0});CH.upd()}
async function host(){
  if(!window.RTCPeerConnection){CH.err='Dein Browser unterstützt keine Direktverbindungen.';return CH.upd()}
  CH.step='host';CH.code='';CH.err='';CH.upd();
  try{const pc=newPc();wire(pc.createDataChannel('chat'));await pc.setLocalDescription(await pc.createOffer());await gathered(pc);CH.code='TBO'+await pack(pc.localDescription.sdp)}
  catch(e){CH.err='Fehler: '+e.message;CH.step='start'}
  CH.upd()}
async function accept(c){c=c.trim();if(/^TBO/.test(c))throw Error('Das ist eine Einladung (TBO), kein Antwortcode. Die andere Person muss „Einladung erhalten“ wählen, DEINEN Code von oben einfügen und dir den Code zurückschicken, der mit TBA beginnt.');if(!/^TBA/.test(c))throw Error('Das ist kein Antwortcode (er beginnt mit TBA).');
  await CH.pc.setRemoteDescription({type:'answer',sdp:await unpack(c.slice(3))});CH.wait=1;CH.upd()}
async function join(c){c=c.trim();if(/^TBA/.test(c))throw Error('Das ist ein Antwortcode (TBA). Hier gehört die Einladung (TBO) der anderen Person hinein.');if(!/^TBO/.test(c))throw Error('Das ist kein Einladungscode (er beginnt mit TBO).');
  if(!window.RTCPeerConnection)throw Error('Dein Browser unterstützt keine Direktverbindungen.');
  const sdp=await unpack(c.slice(3)),pc=newPc();pc.ondatachannel=e=>wire(e.channel);
  await pc.setRemoteDescription({type:'offer',sdp});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
  CH.code='TBA'+await pack(pc.localDescription.sdp);CH.step='join2';CH.upd()}

    bg.addEventListener('keydown',e=>{if(e.key==='Escape')close(null);else if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){const ok=box.querySelector('[data-d=ok]');if(ok){e.preventDefault();ok.click()}}});

    return new Promise(res=>{
      const d=dlg(`<h3>${esc(o.title)}</h3>${o.desc?`<p class="st">${o.desc}</p>`:''}${o.pre||''}${fh}${o.extra||''}<p class="st err" id="ae" hidden></p><div class="grid2"><button class="btn" data-d="no">${o.no||'Abbrechen'}</button><button class="btn ${o.danger?'warn':'pri'}" data-d="ok">${o.ok||'OK'}</button></div>`,(a,b,close)=>{
        const vals=()=>{const v={};d.box.querySelectorAll('[data-f]').forEach(i=>v[i.dataset.f]=i.type==='checkbox'?i.checked:i.value);return v};
        if(a==='no')return close(null);

        else if(o.onAct)o.onAct(a,b,d,vals)});
      d.done.then(res);const f=d.box.querySelector('input:not([type=checkbox]),textarea');if(f&&o.focus!==false&&!coarse())f.focus();
    });
  }
  const yes=async(title,text,ok,danger)=>!!(await ask({title,desc:text,ok:ok||'OK',danger}));
  const info=(title,text)=>ask({title,desc:text,ok:'OK',no:'Schließen'});
  function menu(title,items,sub,top){

  }
  return{dlg,ask,yes,info,menu,coarse};
})();

const fe=e=>(e&&e.message)||String(e||'Fehler');

/* ----- Netz: PeerJS ----- */
const N={peer:null,st:'off',err:'',conns:new Map(),req:new Map(),typ:new Map(),rx:new Map(),prog:new Map(),busy:new Set(),again:new Set(),full:new Set(),lib:null,rt:0,tries:0};
async function lib(){if(window.Peer)return;if(!N.lib)N.lib=loadScript(PJ).catch(e=>{N.lib=null;throw Error('Der Chat-Baustein konnte nicht geladen werden. Beim ersten Mal braucht es Internet.')});await N.lib}
async function online(){
  if(N.peer&&!N.peer.destroyed){if(N.peer.disconnected){try{N.peer.reconnect()}catch(e){}}return}
  N.st='connecting';N.err='';upd();
  try{await lib()}catch(e){N.st='error';N.err=fe(e);upd();return}
  if(!window.RTCPeerConnection){N.st='error';N.err='Dieser Browser unterstützt keine Direktverbindungen.';upd();return}
  const p=new Peer(pid(C.me.code),{debug:0});N.peer=p;
  p.on('open',()=>{if(N.peer!==p)return;N.st='on';N.err='';N.tries=0;upd();C.ct.forEach((c,i)=>setTimeout(()=>dial(c.id),i*150))});
  p.on('connection',c=>incoming(c));
  p.on('disconnected',()=>{if(N.peer!==p||p.destroyed)return;N.st='connecting';upd();retry()});
  p.on('close',()=>{if(N.peer===p){N.peer=null;N.st='off';upd()}});
  p.on('error',e=>{const t=e&&e.type;
    if(t==='peer-unavailable'){const m=/peer (\S+)/i.exec((e&&e.message)||'');const code=m&&m[1].replace(/^toolbox-/i,'').toUpperCase();if(code){const c=N.conns.get(code);if(c&&!c.open){N.conns.delete(code);upd()}}return}
    if(t==='unavailable-id'){N.st='error';N.err='Der Chat ist mit deinem Code schon in einem anderen Fenster oder auf einem anderen Gerät geöffnet. Schließe ihn dort und tippe auf „Neu verbinden“.';try{p.destroy()}catch(x){}N.peer=null;upd();return}
    if(t==='browser-incompatible'){N.st='error';N.err='Dieser Browser unterstützt keine Direktverbindungen.';upd();return}
    if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){N.st='connecting';N.err='Keine Verbindung zum Vermittlungsdienst – versuche es weiter …';upd();retry();return}});
}
function retry(){clearTimeout(N.rt);const d=[2,4,8,15,30,60][Math.min(N.tries++,5)];N.rt=setTimeout(()=>{const p=N.peer;if(!p||p.destroyed){N.peer=null;online()}else if(p.disconnected){try{p.reconnect()}catch(e){try{p.destroy()}catch(x){}N.peer=null;online()}}},d*1000)}
function offline(){clearTimeout(N.rt);N.conns.forEach(c=>{try{c.close()}catch(e){}});N.conns.clear();if(N.peer){try{N.peer.destroy()}catch(e){}}N.peer=null;N.st='off';upd()}
const isOn=code=>{const c=N.conns.get(code);return!!(c&&c.open)};
function dial(code){
  if(!N.peer||N.peer.disconnected||N.peer.destroyed||code===C.me.code)return;
  const old=N.conns.get(code);if(old&&(old.open||Date.now()-(old._t||0)<15000))return;

  if(!c)return;c._t=Date.now();c._out=1;setup(c,code)}
function incoming(c){
  const code=String(c.peer||'').replace(/^toolbox-/i,'').toUpperCase();if(!normCode(code)){try{c.close()}catch(e){}return}
  const nm=String((c.metadata&&c.metadata.n)||'').slice(0,24);
  if(!ct(code)){const rq={c,n:nm,buf:[]};N.req.set(code,rq);c.on('data',d=>{if(N.req.get(code)===rq&&rq.buf.length<500)rq.buf.push(d)});c.on('close',()=>{if(N.req.get(code)&&N.req.get(code).c===c){N.req.delete(code);upd()}});upd();toast('Neue Kontaktanfrage'+(nm?' von '+nm:''));if(document.hidden)notify('Chat: Kontaktanfrage',(nm||fcode(code))+' möchte mit dir chatten.');return}
  const old=N.conns.get(code);
  if(old&&old!==c){ // Gleichzeitig angewählt: es bleibt die Verbindung, die der kleinere Code aufgebaut hat (auf beiden Seiten gleich)
    const stale=!old.open&&Date.now()-(old._t||0)>10000;
    if(old._out&&!stale&&code>C.me.code){try{c.close()}catch(e){}return}
    old._drop=1;try{old.close()}catch(e){}}

function setup(c,code){

  const op=()=>{if(N.conns.get(code)!==c)return;tx2(code,{t:'hi',n:C.me.name||''});flush(code,true);upd()};
  if(c.open)op();else c.on('open',op);
  c.on('data',d=>{if(!c._drop)c._q=(c._q||Promise.resolve()).then(()=>onData(code,d)).catch(()=>{})}); // streng der Reihe nach
  c.on('close',()=>{if(N.conns.get(code)===c){N.conns.delete(code);N.typ.delete(code);abortRx(code);upd()}});

function tx2(code,o){const c=N.conns.get(code);if(!c||!c.open)return false;try{const r=c.send(o);if(r&&r.catch)r.catch(()=>{});return true}catch(e){return false}}
setInterval(()=>{N.conns.forEach((c,code)=>{if(c.open)tx2(code,{t:'p'})})},25000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&N.peer&&N.peer.disconnected)retry();if(!document.hidden&&V.scr==='chat')markRead(V.code)});

/* ----- Senden ----- */
async function flush(code,full){
  if(N.busy.has(code)){N.again.add(code);if(full)N.full.add(code);return}N.busy.add(code);
  try{do{N.again.delete(code);if(N.full.delete(code))full=true;const l=await msgsOf(code);
    for(const m of l){if(!isOn(code))break;
      if(m.me&&(m.st==='wait'||(full&&m.st==='sent'&&m.k==='text'))){if(m.k==='text'){if(tx2(code,{t:'msg',id:m.id,x:m.x,ts:m.ts})){m.st='sent';await put(m);updMsg(m)}}else await sendFile(code,m)}
      else if(!m.me&&m.rd&&!m.ra){if(tx2(code,{t:'ack',id:m.id,s:'r'})){m.ra=1;await put(m)}}
      if(m.rmS){if(tx2(code,{t:'re',id:m.id,e:m.rm||''})){delete m.rmS;await put(m)}}}
    full=false}while(N.again.has(code)&&isOn(code))}
  finally{N.busy.delete(code)}}
async function sendFile(code,m){
  const c=N.conns.get(code);if(!c||!c.open)return;
  const buf=await m.blob.arrayBuffer();
  if(!tx2(code,{t:'file',id:m.id,k:m.k,name:m.name||'',mime:m.mime||'',size:buf.byteLength,n:Math.ceil(buf.byteLength/CH_SZ),dur:m.dur||0,ts:m.ts}))return;
  for(let i=0,n=0;i<buf.byteLength;i+=CH_SZ,n++){
    if(!c.open||N.conns.get(code)!==c){N.prog.delete(m.id);updMsg(m);return}
    while(c.open&&((c.bufferSize||0)>16||(c.dataChannel&&c.dataChannel.bufferedAmount>1048576)))await sleep(25);
    try{const r=c.send({t:'ch',id:m.id,i:n,d:buf.slice(i,i+CH_SZ)});if(r&&r.then)await r}catch(e){N.prog.delete(m.id);updMsg(m);return}
    if(n%16===0){N.prog.set(m.id,Math.min(99,i/buf.byteLength*100));updProg(m.id)}}
  tx2(code,{t:'fe',id:m.id});N.prog.delete(m.id);m.st='sent';await put(m);updMsg(m)}
async function newMsg(code,m){
  m=Object.assign({id:mid(),c:code,me:1,ts:Date.now(),st:'wait'},m);
  await put(m);const k=ct(code);if(k){k.last=m.ts;k.prev=prevOf(m);save()}
  if(V.scr==='chat'&&V.code===code){V.msgs.push(m);appendMsg(m)}
  if(isOn(code))flush(code);else dial(code);
  return m}
async function sendText(code,x){x=String(x||'').trim();if(!x)return;typing(code,false);await newMsg(code,{k:'text',x:x.slice(0,8000)})}
async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5*1048576||!window.createImageBitmap)return f;
  try{const bm=await createImageBitmap(f),sc=Math.min(1,1920/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);
    cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));return b&&b.size<f.size?b:f}catch(e){return f}}
async function sendFiles(code,files){
  for(const f of files){if(f.size>MAXF){toast(f.name+' ist zu groß (max. 100 MB)');continue}
    const img=/^image\//.test(f.type),b=img?await shrink(f):f;
    await newMsg(code,{k:img?'image':'file',name:f.name,mime:b.type||f.type||'application/octet-stream',size:b.size,blob:b})}}
let typT=0,typOff=0;
function typing(code,on){if(!isOn(code))return;clearTimeout(typOff);
  if(on){if(Date.now()-typT>3000){typT=Date.now();tx2(code,{t:'typ',on:1})}typOff=setTimeout(()=>{typT=0;tx2(code,{t:'typ',on:0})},4000)}
  else if(typT){typT=0;tx2(code,{t:'typ',on:0})}}

/* ----- Empfangen ----- */
async function onData(code,d){
  if(!d||typeof d!=='object')return;
  const k=ct(code);
  switch(d.t){
    case'hi':{const n=String(d.n||'').slice(0,24);if(k&&n&&k.name!==n){k.name=n;save();upd()}break}
    case'msg':{if(!k||await getM(String(d.id)))return tx2(code,{t:'ack',id:d.id,s:'d'});
      const m={id:String(d.id).slice(0,40),c:code,me:0,k:'text',x:String(d.x||'').slice(0,8000),ts:Date.now()};await got(code,m);break}
    case'file':{if(!k)return;const sz=+d.size||0;if(sz>MAXF)return;if(await getM(String(d.id))){N.rx.set(d.id,{code,skip:1});return}
      N.rx.set(d.id,{code,meta:d,parts:[],got:0,cnt:0,n:Math.max(0,+d.n||0),fin:0});N.prog.set(d.id,0);
      if(V.scr==='chat'&&V.code===code&&!V.msgs.some(x=>x.id===d.id)){const ph={id:d.id,c:code,me:0,k:['image','voice','file'].includes(d.k)?d.k:'file',name:String(d.name||'').slice(0,200),size:sz,dur:+d.dur||0,ts:Date.now(),rx:1};V.msgs.push(ph);appendMsg(ph)}
      N.typ.delete(code);updHead();break}
    case'ch':{const r=N.rx.get(d.id);if(!r||r.code!==code||!d.d||r.skip)return;const i=+d.i;if(i>=0&&!r.parts[i]){r.parts[i]=d.d;r.cnt++;r.got+=d.d.byteLength||0}
      if(r.cnt%16===0){N.prog.set(d.id,Math.min(99,r.got/(+r.meta.size||1)*100));updProg(d.id)}if(r.fin&&r.cnt>=r.n)await rxDone(code,d.id);break}
    case'fe':{const r=N.rx.get(d.id);if(!r||r.code!==code)return;if(r.skip){N.rx.delete(d.id);return tx2(code,{t:'ack',id:d.id,s:'d'})}r.fin=1;if(r.cnt>=r.n)await rxDone(code,d.id);break}

    case'ack':{const m=await getM(String(d.id));if(!m||!m.me||m.c!==code)return;const rank={wait:0,sent:1,d:2,r:3};if((rank[d.s]||0)>(rank[m.st]||0)){m.st=d.s;await put(m);updMsg(m)}break}
    case'typ':{if(d.on)N.typ.set(code,Date.now());else N.typ.delete(code);updHead();break}
    case're':{const m=await getM(String(d.id));if(!m||m.c!==code)return;m.rt=String(d.e||'').slice(0,8);await put(m);updMsg(m);break}
  }
}
async function rxDone(code,id){const r=N.rx.get(id);if(!r)return;N.rx.delete(id);N.prog.delete(id);const x=r.meta;
  const m={id:String(x.id).slice(0,40),c:code,me:0,k:['image','voice','file'].includes(x.k)?x.k:'file',name:String(x.name||'').slice(0,200),mime:String(x.mime||'').slice(0,100),size:r.got,dur:+x.dur||0,blob:new Blob(r.parts,{type:x.mime||''}),ts:Date.now()};
  await got(code,m)}
async function got(code,m){
  await put(m);tx2(code,{t:'ack',id:m.id,s:'d'});N.typ.delete(code);
  const k=ct(code),here=V.scr==='chat'&&V.code===code&&!document.hidden&&view.dataset.t==='Chat';
  if(k){k.last=m.ts;k.prev=prevOf(m);if(!here)k.unread=(k.unread||0)+1;save()}
  if(V.scr==='chat'&&V.code===code){const i=V.msgs.findIndex(x=>x.id===m.id);if(i>=0){V.msgs[i]=m;updMsg(m)}else{V.msgs.push(m);appendMsg(m)}if(here)markRead(code)}

  badge();updHead()}
function abortRx(code){N.rx.forEach((r,id)=>{if(r.code===code){N.rx.delete(id);N.prog.delete(id);if(V.scr==='chat'){const i=V.msgs.findIndex(x=>x.id===id&&x.rx);if(i>=0){V.msgs.splice(i,1);const e=$(`[data-m="${CSS.escape(id)}"]`,V.el);if(e)e.remove()}}}})}
async function markRead(code){

async function scanQR(){
  if(!navigator.mediaDevices){UI.info('Keine Kamera','Hier ist keine Kamera verfügbar. Gib den Code einfach ein.');return null}
  let stop=false,stream=null;
  const d=UI.dlg(`<h3>QR-Code scannen</h3><div class="qrv"><video playsinline muted></video><i></i></div><p class="st" id="qs">Halte die Kamera auf den QR-Code deines Kontakts (in seinem Chat unter „Mein Code“).</p><button class="btn" data-d="no">Abbrechen</button>`,(a,b,close)=>close(null));
  d.done.then(()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop())});
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}catch(e){if(!stop){const q=d.box.querySelector('#qs');q.className='st err';q.textContent='Kamera nicht erlaubt oder nicht verfügbar. Gib den Code stattdessen ein.'}return d.done}
  if(stop){stream.getTracks().forEach(t=>t.stop());return d.done}
  const v=d.box.querySelector('video');v.srcObject=stream;try{await v.play()}catch(e){}
  let det=null;try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  if(!det){try{await loadScript(JQ)}catch(e){const q=d.box.querySelector('#qs');q.className='st err';q.textContent='Der Scanner konnte nicht geladen werden. Gib den Code ein.';return d.done}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  (async()=>{while(!stop){await sleep(220);if(stop||!v.videoWidth)continue;let t=null;
    try{if(det){const r=await det.detect(v);if(r&&r[0])t=r[0].rawValue}else{const s=Math.min(1,640/v.videoWidth);cv.width=Math.round(v.videoWidth*s);cv.height=Math.round(v.videoHeight*s);cx.drawImage(v,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r)t=r.data}}catch(e){}
    if(t&&normCode(t)){vib();d.close(t);return}}})();
  return d.done}

const luma=(d,w,h)=>{const L=new Uint8Array(w*h);for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return L};

/* Minimum-/Maximum-Filter (rechteckig, getrennt in zwei Durchgängen) */
function minmax(src,w,h,r,isMax){

    for(let k=a;k<=b;k++){const s=src[o+k];if(isMax?s>v:s<v)v=s}tmp[o+x]=v}}
  for(let x=0;x<w;x++){for(let y=0;y<h;y++){let v=init;const a=y-r<0?0:y-r,b=y+r>=h?h-1:y+r;
    for(let k=a;k<=b;k++){const s=tmp[k*w+x];if(isMax?s>v:s<v)v=s}out[y*w+x]=v}}

/* Maske der zu füllenden Pixel (1 = füllen). [ix0,ix1)x[iy0,iy1) ist das Rechteck im Ausschnitt. */
function buildMask(L,gw,gh,ix0,iy0,ix1,iy1,method,thr,r,dil){
  const m=new Uint8Array(gw*gh);
  if(method==='rect'){for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++)m[y*gw+x]=1;return m}
  const op=(method==='light'||method==='both')?minmax(minmax(L,gw,gh,r,false),gw,gh,r,true):null;   // Öffnen: helle Details weg
  const cl=(method==='dark'||method==='both')?minmax(minmax(L,gw,gh,r,true),gw,gh,r,false):null;    // Schließen: dunkle Details weg
  const raw=new Uint8Array(gw*gh);
  for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++){const i=y*gw+x;
    if((op&&L[i]-op[i]>thr)||(cl&&cl[i]-L[i]>thr))raw[i]=255}
  const d=dil>0?minmax(raw,gw,gh,dil,true):raw;
  for(let y=iy0;y<iy1;y++)for(let x=ix0;x<ix1;x++){const i=y*gw+x;if(d[i])m[i]=1}

/* Füllt maskierte Pixel aus den nächsten gültigen Pixeln in 4 Richtungen (wie ffmpeg „delogo“, aber für beliebige Masken) */
function inpaint(d,w,h,m,passes){

    a=-1;for(let x=w-1;x>=0;x--){const i=y*w+x;if(!m[i])a=x;Rx[i]=a}}
  for(let x=0;x<w;x++){let a=-1;for(let y=0;y<h;y++){const i=y*w+x;if(!m[i])a=y;Uy[i]=a}
    a=-1;for(let y=h-1;y>=0;y--){const i=y*w+x;if(!m[i])a=y;Dy[i]=a}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!m[i])continue;
    let r=0,g=0,b=0,s=0,p,wt,j;
    p=Lx[i];if(p>=0){wt=1/((x-p)*(x-p));j=(y*w+p)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Rx[i];if(p>=0){wt=1/((p-x)*(p-x));j=(y*w+p)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Uy[i];if(p>=0){wt=1/((y-p)*(y-p));j=(p*w+x)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    p=Dy[i];if(p>=0){wt=1/((p-y)*(p-y));j=(p*w+x)*4;r+=wt*d[j];g+=wt*d[j+1];b+=wt*d[j+2];s+=wt}
    if(s>0){j=i*4;d[j]=r/s;d[j+1]=g/s;d[j+2]=b/s;d[j+3]=255}
  }
  for(let k=0;k<passes;k++)for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;if(!m[i])continue;
    const a=(x>0?i-1:i)*4,b=(x<w-1?i+1:i)*4,c=(y>0?i-w:i)*4,e=(y<h-1?i+w:i)*4,j=i*4;

}

/* Feines Rauschen wie in der Umgebung, damit die Fläche nicht „glatt wie Plastik“ wirkt */
function addGrain(d,w,h,m){
  const n=w*h,m8=new Uint8Array(n);for(let i=0;i<n;i++)m8[i]=m[i]?255:0;
  const dm=minmax(m8,w,h,3,true);let s=0,c=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(m[i]||!dm[i])continue;
    let a=0;for(let v=-1;v<=1;v++)for(let u=-1;u<=1;u++){const k=((y+v)*w+x+u)*4;a+=(d[k]*77+d[k+1]*150+d[k+2]*29)>>8}
    const j=i*4,hp=((d[j]*77+d[j+1]*150+d[j+2]*29)>>8)-a/9;s+=hp*hp;c++}

  const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296};
  for(let i=0;i<n;i++)if(m[i]){const z=(rnd()+rnd()+rnd()-1.5)*2*sg,j=i*4;d[j]+=z;d[j+1]+=z;d[j+2]+=z}

/* Einen Bereich auf der Zeichenfläche entfernen. rc in Pixeln der Zeichenfläche, wm = {method,sens,pad,grain} */
function applyRegion(ctx,W,H,rc,wm){
  const pad=(wm.method==='rect'?1:0)+(wm.pad||0);
  const x0=clamp(Math.floor(rc.x)-pad,0,W),y0=clamp(Math.floor(rc.y)-pad,0,H),x1=clamp(Math.ceil(rc.x+rc.w)+pad,0,W),y1=clamp(Math.ceil(rc.y+rc.h)+pad,0,H);
  if(x1-x0<2||y1-y0<2)return;

/* ----- Verfolgung: Kantenbild + normierte Kreuzkorrelation ----- */
function sobel(g,w,h){
  const o=new Float32Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    const gx=g[i-w+1]+2*g[i+1]+g[i+w+1]-g[i-w-1]-2*g[i-1]-g[i+w-1];
    const gy=g[i+w-1]+2*g[i+w]+g[i+w+1]-g[i-w-1]-2*g[i-w]-g[i-w+1];
    o[i]=Math.abs(gx)+Math.abs(gy)}
  return o;
}
function integral(E,w,h){
  const W1=w+1,S=new Float64Array(W1*(h+1)),Q=new Float64Array(W1*(h+1));
  for(let y=0;y<h;y++){let rs=0,rq=0;for(let x=0;x<w;x++){const v=E[y*w+x];rs+=v;rq+=v*v;const i=(y+1)*W1+x+1;S[i]=S[i-W1]+rs;Q[i]=Q[i-W1]+rq}}

function makeTemplate(E,w,x,y,tw,th){
  const T=new Float32Array(tw*th);let s=0;
  for(let v=0;v<th;v++)for(let u=0;u<tw;u++){const val=E[(y+v)*w+x+u];T[v*tw+u]=val;s+=val}
  const mean=s/(tw*th);let ss=0;
  for(let i=0;i<T.length;i++){T[i]-=mean;ss+=T[i]*T[i]}

  const{tw,th,ss,T}=t,N=tw*th,W1=w+1;

  const sum=S[d]-S[b]-S[c]+S[a],sq=Q[d]-Q[b]-Q[c]+Q[a],varN=sq-sum*sum/N;
  if(varN<1e-3||ss<1e-3)return -1;

  for(let v=0;v<th;v++){const o=(py+v)*w+px,to=v*tw;for(let u=0;u<tw;u++)cross+=T[to+u]*E[o+u]}

  return{x:bx,y:by,s:best};
}

/* ---------- Video-Tool, Teil 2: Laden, Umwandeln (GIF / MP4 / WebM), Verfolgen ---------- */
const VTE=(()=>{
const{rectAt,applyRegion,clamp}=VTP;
const tick=ms=>new Promise(r=>setTimeout(r,ms));
const ABORT='abbruch';
const even=n=>Math.max(2,Math.round(n/2)*2);

/* Zu einem Zeitpunkt springen und warten, bis das Bild bereit ist */
function seek(v,t){
  return new Promise(res=>{
    const max=isFinite(v.duration)?v.duration-0.001:t;t=Math.max(0,Math.min(t,max));
    if(Math.abs(v.currentTime-t)<0.0005&&v.readyState>=2)return res();
    let end=false;const fin=()=>{if(end)return;end=true;v.removeEventListener('seeked',fin);clearTimeout(to);res()};
    const to=setTimeout(fin,6000);v.addEventListener('seeked',fin);v.currentTime=t;
  });
}

/* Videodatei in ein <video> laden */
async function loadVideo(file){
  const url=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(Error('Dieses Videoformat kann nicht gelesen werden.'));setTimeout(()=>rej(Error('Das Video lädt zu lange.')),25000)});
  }catch(e){URL.revokeObjectURL(url);throw e}
  if(!isFinite(v.duration)){   // Aufnahmen ohne Längenangabe
    await new Promise(r=>{v.ondurationchange=()=>{if(isFinite(v.duration)){v.ondurationchange=null;r()}};v.currentTime=1e7;setTimeout(r,4000)});
    await seek(v,0);
  }
  if(!v.videoWidth||!isFinite(v.duration)||v.duration<=0){URL.revokeObjectURL(url);throw Error('In dieser Datei ist kein lesbares Video.')}
  return{v,url,dur:v.duration,vw:v.videoWidth,vh:v.videoHeight};
}

/* Bildrate grob messen (kurz abspielen) */
function estimateFps(v){
  return new Promise(res=>{
    if(!v.requestVideoFrameCallback)return res(30);
    const ts=[];let fin=false;
    const done=()=>{if(fin)return;fin=true;try{v.pause()}catch(e){}
      const u=[...new Set(ts)].sort((a,b)=>a-b),d=[];for(let i=1;i<u.length;i++)d.push(u[i]-u[i-1]);
      let f=30;
      if(d.length>=4){const s=[...d].sort((a,b)=>a-b),m=s[s.length>>1],g=d.filter(x=>x<m*1.5),mean=g.reduce((a,b)=>a+b,0)/g.length;f=1/mean}
      let bc=0,bd=0.012;for(const c of[23.976,24,25,29.97,30,50,59.94,60]){const e=Math.abs(f-c)/c;if(e<bd){bd=e;bc=c}}if(bc)f=bc;
      if(f<4||f>121)f=30;
      v.currentTime=0;setTimeout(()=>res(f),60)};
    const cb=(n,md)=>{ts.push(md.mediaTime);if(ts.length<24&&!fin)v.requestVideoFrameCallback(cb);else done()};
    v.requestVideoFrameCallback(cb);v.play().catch(done);setTimeout(done,1800);
  });
}

/* Bild für die Ausgabe: zuschneiden, skalieren, Wasserzeichen entfernen */
function makeProc(v,P){
  const vw=v.videoWidth,vh=v.videoHeight,c=P.crop||{l:0,t:0,r:0,b:0};
  const sx=c.l*vw,sy=c.t*vh,sw=vw*(1-c.l-c.r),sh=vh*(1-c.t-c.b);
  const cv=document.createElement('canvas');cv.width=P.W;cv.height=P.H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingQuality='high';
  return{cv,ctx,draw(t){
    ctx.drawImage(v,sx,sy,sw,sh,0,0,P.W,P.H);
    for(const reg of P.regions||[]){const r=rectAt(reg,t);if(!r)continue;
      applyRegion(ctx,P.W,P.H,{x:(r.x*vw-sx)/sw*P.W,y:(r.y*vh-sy)/sh*P.H,w:r.w*vw/sw*P.W,h:r.h*vh/sh*P.H},P.wm||{method:'rect'})}
  }};
}

/* Planung: Größe, Bildrate, Zeitpunkte */
function plan(info,opt){
  const c=opt.crop||{l:0,t:0,r:0,b:0},cw=info.vw*(1-c.l-c.r),ch=info.vh*(1-c.t-c.b);
  const start=clamp(opt.start||0,0,Math.max(0,info.dur-0.05)),end=clamp(opt.end||info.dur,start+0.05,info.dur),dur=end-start;
  const src=info.fps||30;let fps=opt.fps||(opt.fmt==='gif'?12:src);fps=Math.min(fps,src,opt.fmt==='gif'?30:60);
  const n=Math.max(1,Math.floor(dur*fps+1e-6));
  const W0=opt.width?Math.min(opt.width,cw):(opt.fmt==='gif'?Math.min(cw,480):Math.min(cw,1920));
  const asp=ch/cw;
  return{start,end,dur,fps,n,W0,asp,cw,ch,at:i=>start+i/fps+0.002};

const dims=(W0,asp)=>{const W=even(W0);return{W,H:even(W*asp)}};

/* ---------- GIF ---------- */
async function gifPass(v,P,pl,prog,ab,label){
  const{GIFEncoder,quantize,applyPalette}=gifenc,proc=makeProc(v,P),gif=GIFEncoder();
  let prev=0;
  for(let i=0;i<pl.n;i++){
    chk(ab);const t=pl.at(i);await seek(v,t);proc.draw(t);
    const d=proc.ctx.getImageData(0,0,P.W,P.H).data,pal=quantize(d,256),idx=applyPalette(d,pal);
    const cs=Math.round((i+1)*100/pl.fps),delay=Math.max(2,cs-prev)*10;prev=cs;
    gif.writeFrame(idx,P.W,P.H,{palette:pal,delay});
    prog((i+1)/pl.n,label+'Bild '+(i+1)+' von '+pl.n);
  }
  gif.finish();
  return new Blob([gif.bytes()],{type:'image/gif'});
}
async function gifEstimate(v,P,pl,ab){   // Größe grob schätzen: einige Bilder einzeln kodieren
  const{GIFEncoder,quantize,applyPalette}=gifenc,proc=makeProc(v,P),K=Math.min(6,pl.n);let sum=0;
  for(let j=0;j<K;j++){chk(ab);const t=pl.at(Math.floor((j+0.5)*pl.n/K));await seek(v,t);proc.draw(t);
    const d=proc.ctx.getImageData(0,0,P.W,P.H).data,pal=quantize(d,256),g=GIFEncoder();
    g.writeFrame(applyPalette(d,pal),P.W,P.H,{palette:pal,delay:80});g.finish();sum+=g.bytes().length-40}
  return sum/K*pl.n;
}

  const prog=hooks.progress||(()=>{}),ab=hooks.aborted,pl=plan(info,opt),notes=[],max=opt.maxMB?opt.maxMB*1e6:0;
  let W0=pl.W0;
  const mk=w=>{const d=dims(w,pl.asp);return{W:d.W,H:d.H,crop:opt.crop,regions:opt.regions,wm:opt.wm}};
  if(max){
    prog(0,'Größe wird geschätzt …');
    let P=mk(W0),est=await gifEstimate(v,P,pl,ab);
    if(est>max*0.9){W0=Math.max(64,W0*Math.sqrt(max*0.88/est));P=mk(W0);est=await gifEstimate(v,P,pl,ab);
      if(est>max*0.95)W0=Math.max(64,W0*Math.sqrt(max*0.88/est))}

  for(let k=1;k<=tries;k++){
    P=mk(W0);blob=await gifPass(v,P,pl,prog,ab,tries>1&&k>1?'Versuch '+k+' · ':'');
    if(!max||blob.size<=max||P.W<=64)break;

  if(max&&blob.size>max)notes.push('Die gewünschte Größe wurde nicht ganz erreicht – wähle weniger Bilder pro Sekunde oder einen kürzeren Ausschnitt.');
  return{blob,W:P.W,H:P.H,fps:pl.fps,ext:'gif',notes};
}

const avcLevel=(W,H,fps)=>{const mb=Math.ceil(W/16)*Math.ceil(H/16),mbps=mb*fps;

  enc.configure(ac.cfg);
  const CH=aud.sr;
  for(let off=0;off<aud.len;off+=CH){
    chk(ab);if(err)throw err;
    const n=Math.min(CH,aud.len-off),data=new Float32Array(n*aud.ch);
    for(let c=0;c<aud.ch;c++)data.set(aud.pcm[c].subarray(off,off+n),c*n);
    const ad=new AudioData({format:'f32-planar',sampleRate:aud.sr,numberOfFrames:n,numberOfChannels:aud.ch,timestamp:Math.round(off/aud.sr*1e6),data});
    enc.encode(ad);ad.close();
    while(enc.encodeQueueSize>8)await tick(4);
  }
  await enc.flush();enc.close();if(err)throw err;
}

async function convertVideo(v,file,info,opt,hooks){
  needEnc();
  const prog=hooks.progress||(()=>{}),ab=hooks.aborted,pl=plan(info,opt),notes=[],fmt=opt.fmt,fps=pl.fps;
  const aq=opt.audio?96000:0,max=opt.maxMB?opt.maxMB*1e6:0;
  let d=dims(pl.W0,pl.asp),br;
  const bpp={high:0.11,mid:0.07,low:0.04}[opt.quality||'mid']||0.07;
  const sizeBr=(f)=>Math.max(60000,(max*8*0.93*f)/pl.dur-aq);
  if(max){br=sizeBr(1);
    if(!opt.width){const maxPx=br/(0.055*fps);if(d.W*d.H>maxPx){d=dims(Math.max(160,pl.W0*Math.sqrt(maxPx/(d.W*d.H))),pl.asp);notes.push('Auflösung wurde automatisch verkleinert, damit das Bild bei dieser Größe gut aussieht.')}}}
  else br=bpp*d.W*d.H*fps;
  let aud=null,ac=null;
  if(opt.audio){
    prog(0,'Ton wird vorbereitet …');
    try{aud=await prepAudio(opt.file||file,pl.start,pl.end);ac=await pickAudio(fmt,aud.sr,aud.ch);if(!ac){aud=null;notes.push('Der Ton konnte hier nicht verarbeitet werden – das Video hat keinen Ton.')}}
    catch(e){if(e.message===ABORT)throw e;aud=null;notes.push('Kein Ton übernommen (keine Tonspur gefunden oder Datei zu groß).')}
  }
  let attempt=0,blob,vc;
  for(;;){
    attempt++;
    const vv=await pickVideo(fmt,d.W,d.H,fps,br,!!max);
    if(!vv)throw Error('Dein Gerät kann dieses Format nicht erzeugen. Probiere „WebM“ oder eine kleinere Breite.');
    if(fmt==='mp4'&&vv.mc!=='avc'&&attempt===1)notes.push('Dein Gerät hat keinen H.264-Encoder, das MP4 nutzt VP9 (läuft nicht überall).');
    const target=fmt==='mp4'?new Mp4Muxer.ArrayBufferTarget():new WebMMuxer.ArrayBufferTarget();
    const vopt={codec:vv.mc,width:d.W,height:d.H};
    let muxer;
    if(fmt==='mp4')muxer=new Mp4Muxer.Muxer({target,video:vopt,audio:aud?{codec:ac.mc,numberOfChannels:aud.ch,sampleRate:aud.sr}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
    else muxer=new WebMMuxer.Muxer({target,video:{...vopt,frameRate:fps},audio:aud?{codec:'A_OPUS',numberOfChannels:aud.ch,sampleRate:aud.sr}:undefined,firstTimestampBehavior:'offset'});
    if(aud){prog(0,'Ton wird kodiert …');await encodeAudio(aud,ac,muxer,ab)}
    let err=null;
    const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{err=e}});
    venc.configure(vv.cfg);
    const P={W:d.W,H:d.H,crop:opt.crop,regions:opt.regions,wm:opt.wm},proc=makeProc(v,P),kf=Math.max(1,Math.round(fps*2)),dtu=Math.round(1e6/fps);
    try{
      for(let i=0;i<pl.n;i++){
        chk(ab);if(err)throw err;
        const t=pl.at(i);await seek(v,t);proc.draw(t);
        const fr=new VideoFrame(proc.cv,{timestamp:Math.round(i*1e6/fps),duration:dtu});
        venc.encode(fr,{keyFrame:i%kf===0});fr.close();
        while(venc.encodeQueueSize>6){await tick(4);if(err)throw err}
        prog((i+1)/pl.n,(attempt>1?'Versuch '+attempt+' · ':'')+'Bild '+(i+1)+' von '+pl.n);
      }
      await venc.flush();if(err)throw err;
    }catch(e){try{venc.close()}catch(x){}
      if(e&&e.message===ABORT)throw e;
      throw Error('Der Video-Encoder des Geräts meldet einen Fehler ('+(e&&(e.message||e.name)||'unbekannt')+'). Probiere eine kleinere Breite oder WebM.')}
    venc.close();muxer.finalize();
    blob=new Blob([target.buffer],{type:fmt==='mp4'?'video/mp4':'video/webm'});vc=vv.name;
    if(max&&blob.size>max&&attempt<3){br=br*(max/blob.size)*0.94;continue}
    break;
  }
  if(max&&blob.size>max)notes.push('Die Datei ist etwas größer als gewünscht ('+(blob.size/1e6).toFixed(1)+' MB). Wähle eine kleinere Breite oder einen kürzeren Ausschnitt.');
  return{blob,W:d.W,H:d.H,fps,ext:fmt,codec:vc,audio:!!aud,notes};
}

async function convert(v,file,info,opt,hooks){
  hooks=hooks||{};opt.file=file;
  return opt.fmt==='gif'?convertGif(v,info,opt,hooks):convertVideo(v,file,info,opt,hooks);
}

/* ---------- Automatische Verfolgung eines Bereichs ---------- */
async function track(v,reg,t0,tMin,tMax,hooks){
  hooks=hooks||{};const prog=hooks.progress||(()=>{}),ab=hooks.aborted;
  const vw=v.videoWidth,vh=v.videoHeight,r0=rectAt(reg,t0);
  if(!r0)throw Error('Zuerst einen Bereich markieren.');
  const Wa=clamp(Math.round(18/Math.max(r0.w,0.01)),320,Math.min(640,vw)),Ha=Math.round(Wa*vh/vw);
  const cv=document.createElement('canvas');cv.width=Wa;cv.height=Ha;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.imageSmoothingQuality='high';
  const grab=async t=>{await seek(v,t);cx.drawImage(v,0,0,Wa,Ha);
    const E=VTP.sobel(VTP.luma(cx.getImageData(0,0,Wa,Ha).data,Wa,Ha),Wa,Ha),I=VTP.integral(E,Wa,Ha);return{E,S:I.S,Q:I.Q}};
  const tw=clamp(Math.round(r0.w*Wa),8,Wa-1),th=clamp(Math.round(r0.h*Ha),6,Ha-1);
  const x0=clamp(Math.round(r0.x*Wa),0,Wa-tw),y0=clamp(Math.round(r0.y*Ha),0,Ha-th);
  const T=VTP.makeTemplate((await grab(t0)).E,Wa,x0,y0,tw,th);
  const dt=Math.max(0.1,(tMax-tMin)/300),R=Math.max(10,Math.round(Wa*0.12));
  const total=Math.max(1,Math.ceil((tMax-t0)/dt)+Math.ceil((t0-tMin)/dt));let done=0,lost=0;
  async function walk(dir){
    let px=x0,py=y0;const out=[];
    for(let t=t0+dir*dt;dir>0?t<=tMax+1e-6:t>=tMin-1e-6;t+=dir*dt){
      chk(ab);const f=await grab(t);
      let m=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,px,py,R,1);
      if(m.s<0.45){const g=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,0,0,Math.max(Wa,Ha),2),g2=VTP.bestMatch(T,f.E,Wa,Ha,f.S,f.Q,g.x,g.y,2,1);
        if(g2.s>=0.55&&g2.s>m.s+0.1)m=g2}
      if(m.s>=0.45){px=m.x;py=m.y}else lost++;
      out.push({t,x:px,y:py});prog(++done/total,'Verfolge … '+Math.round(done/total*100)+' %');
    }
    return out;
  }
  const fwd=await walk(1),back=(await walk(-1)).reverse();
  const pts=[...back,{t:t0,x:x0,y:y0},...fwd],kf=[];
  const mk=(t,p)=>({t,x:p.x/Wa,y:p.y/Ha,w:r0.w,h:r0.h,a:1});
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[i-1];
    if(q&&Math.hypot(p.x-q.x,p.y-q.y)>R*1.2){   // Sprung: Zeitpunkt des Sprungs genauer bestimmen
      let lo=q.t,hi=p.t;
      for(let k=0;k<4;k++){chk(ab);const tm=(lo+hi)/2,f=await grab(tm);
        if(VTP.zncc(T,f.E,Wa,f.S,f.Q,q.x,q.y)>=VTP.zncc(T,f.E,Wa,f.S,f.Q,p.x,p.y))lo=tm;else hi=tm}
      const tj=(lo+hi)/2;kf.push(mk(tj-0.0005,q));kf.push(mk(tj,p));
    }
    kf.push(mk(p.t,p));
  }
  return{kf,lost:lost/Math.max(1,pts.length-1)};
}

return{seek,loadVideo,estimateFps,makeProc,plan,convert,track,ABORT,even};
})();

async function pxPing(url){

    if(/Toolbox-Vermittler/.test(t))return{err:'Der Vermittler läuft, aber die Antwort ist unerwartet.'};
    return{err:'Unter dieser Adresse läuft der Vermittler nicht (Antwort '+r.status+'). Stimmt die Adresse? Wurde der Code mit „Deploy“ veröffentlicht?'};
  }catch(e){return{err:'Die Adresse ist nicht erreichbar. Tippfehler? Sie muss mit <b>https://</b> beginnen und auf <b>.workers.dev</b> enden.'}}
}

async function diagnose(p){

    if(!pxU()){put(i,dg('er','Vermittler nicht eingerichtet','Öffne „Vermittler“ und richte ihn ein.'));return}

  i=step(dg('..','Server …'));let list=[];

  catch(e){put(i,dg('er','Serverliste',esc(fe(e))));return}
  if(!list.length)return;

  let wu;try{wu=new URL(w.socket)}catch(e){put(i,dg('er','Konsole','Ungültige Adresse vom Panel.'));return}
  const isIp=/^\d{1,3}(\.\d{1,3}){3}$/.test(wu.hostname)||wu.hostname.startsWith('[');
  if(px&&isIp){put(i,dg('er','Server-Knoten nur per IP-Adresse ('+esc(wu.host)+')','Cloudflare kann reine IP-Adressen nicht ansprechen. Konsole, Upload und Download gehen darüber nicht. Frage deinen Hoster nach einem Domainnamen für den Knoten – oder nutze „Direkt“, falls er Zugriffe erlaubt.'));return}
  if(px){

      else put(i,dg('er','Konsole nicht erreichbar (Code '+j.status+')',j.message?esc(j.message):'Der Server-Knoten ('+esc(wu.host)+') antwortet nicht.'));
    }catch(e){put(i,dg('er','Konsole-Test',esc(fe(e))))}
  }else put(i,dg('wa','Konsole nur beim Öffnen prüfbar','Knoten: '+esc(wu.host)+'. Im direkten Modus muss dein Hoster zusätzlich diese App-Adresse beim Knoten freigeben.'));
  i=step(dg('..','Dateien hoch-/runterladen …'));

  }catch(e){put(i,dg('er','Datei-Dienst',esc(fe(e))))}
}

    if(gen!==S.wsGen)return;

async function onWsClose(gen){

        if(j&&j.status===403)why='Der Server-Knoten lehnt die Konsole ab (403). Er akzeptiert nur Verbindungen mit der Adresse des Panels – prüfe, ob die Panel-Adresse genau stimmt.';
        else if(j&&j.status&&j.status!==101)why='Der Server-Knoten antwortet nicht richtig (Code '+j.status+').';

const AN=['#4b5563','#ef4444','#22c55e','#eab308','#60a5fa','#d946ef','#06b6d4','#e5e7eb','#9ca3af','#f87171','#4ade80','#facc15','#93c5fd','#e879f9','#22d3ee','#ffffff'];

function ansi(s){
  let out='',fg=null,bg=null,b=0,u=0,it=0,i=0,m;const re=/\x1b\[([0-9;?]*)([A-Za-z])/g;
  const emit=t=>{if(!t)return;t=esc(t.replace(/[\x00-\x08\x0b-\x1a\x1c-\x1f\x7f]/g,''));const st=[];if(fg)st.push('color:'+fg);if(bg)st.push('background:'+bg);if(b)st.push('font-weight:700');if(u)st.push('text-decoration:underline');if(it)st.push('font-style:italic');out+=st.length?`<span style="${st.join(';')}">${t}</span>`:t};
  while((m=re.exec(s))){emit(s.slice(i,m.index));i=re.lastIndex;if(m[2]!=='m')continue;
    const p=m[1]===''?[0]:m[1].split(';').map(x=>+x||0);
    for(let k=0;k<p.length;k++){const c=p[k];
      if(c===0){fg=bg=null;b=u=it=0}else if(c===1)b=1;else if(c===3)it=1;else if(c===4)u=1;else if(c===22)b=0;else if(c===23)it=0;else if(c===24)u=0;
      else if(c>=30&&c<=37)fg=AN[c-30+(b?8:0)];else if(c>=90&&c<=97)fg=AN[c-90+8];else if(c===39)fg=null;
      else if(c>=40&&c<=47)bg=AN[c-40];else if(c>=100&&c<=107)bg=AN[c-100+8];else if(c===49)bg=null;
      else if(c===38||c===48){const t=p[k+1];let col=null;
        if(t===5){col=x256(p[k+2]);k+=2}else if(t===2){col=`rgb(${p[k+2]|0},${p[k+3]|0},${p[k+4]|0})`;k+=4}
        if(c===38)fg=col;else bg=col}}}
  emit(s.slice(i));return out;
}

async function sendCmd(){
  const i=$('#ci',el);if(!i)return;const v=i.value.trim();if(!v)return;
  i.value='';if(S.hist[S.hist.length-1]!==v)S.hist.push(v);if(S.hist.length>60)S.hist.shift();S.hi=S.hist.length;
  if(S.state==='offline'){conLine('Der Server ist gestoppt. Befehl nicht gesendet: '+v,'dm');return}
  conLine('> '+v,'si');
  if(S.ws&&S.ws.readyState===1&&S.wsState==='open')S.ws.send(JSON.stringify({event:'send command',args:[v]}));
  else try{await api('POST',SP('/command'),{json:{command:v}})}catch(e){conLine('Befehl nicht gesendet: '+fe(e),'er')}
}

/* ----- Dateien (Dateimanager über die Panel-API) ----- */
const ARCH=/\.(zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz|rar|7z)$/i;
const TXT=/\.(txt|log|json|json5|ya?ml|properties|conf|cfg|toml|ini|md|xml|html?|css|js|mjs|ts|sh|bat|cmd|py|lua|csv|sk|mcmeta|env|gradle|java|kt|php|sql|lang|rules|list|secret)$/i;
const BINM=/^(application\/(jar|octet-stream|pdf|java-archive|x-executable|wasm|x-sharedlib|x-mach-binary)|inode\/|image\/|audio\/|video\/|font\/)/;
const isArch=f=>ARCH.test(f.name)||/^application\/(zip|gzip|x-gzip|x-tar|x-bzip2|x-xz|x-rar|vnd\.rar|x-7z-compressed)/.test(f.mime||'');
const isText=f=>f.file&&!isArch(f)&&(TXT.test(f.name)||!BINM.test(f.mime||''));
const mapF=a=>({name:a.name,file:!!a.is_file,link:!!a.is_symlink,size:+a.size||0,mime:a.mimetype||'',mode:a.mode||'',bits:a.mode_bits||'',mt:a.modified_at||a.created_at||''});
const fPath=n=>jn(S.fd.dir,n);
const tryJson=t=>{try{return JSON.parse(t)}catch(e){return t}};
const badName=n=>!n||n==='.'||n==='..'||/[\/\\\x00]/.test(n);

function fdInit(){if(!S.fd)S.fd={dir:'/',items:null,err:null,loading:false,sel:new Set(),sort:'name',asc:true,q:'',lim:400,ed:null,gen:0}}

  <div id="fl"></div><div id="fsb"></div>`;

function sorted(){
  const f=S.fd,q=f.q.trim().toLowerCase(),k=f.sort,d=f.asc?1:-1;
  const a=(f.items||[]).filter(x=>!q||x.name.toLowerCase().includes(q));
  a.sort((x,y)=>{
    if(x.file!==y.file)return x.file?1:-1;
    let r=0;
    if(k==='size')r=x.size-y.size;else if(k==='date')r=(Date.parse(x.mt)||0)-(Date.parse(y.mt)||0);
    else r=x.name.localeCompare(y.name,'de',{numeric:true,sensitivity:'base'});
    return r*d||x.name.localeCompare(y.name,'de',{numeric:true});
  });
  return a;
}
function frow(it){

}
function drawRows(){
  const c=$('#fl',el);if(!c)return;const f=S.fd;

  if(!f.items){c.innerHTML='<p class="empty">Lade …</p>';drawSel();return}

async function loadDir(dir,quiet){
  const f=S.fd;if(!f||!S.srv)return;const id=S.srv.id,gen=++f.gen;
  f.dir=dir;
  if(!quiet){f.loading=true;f.err=null;f.items=null;if(S.tab==='fil'&&!f.ed)drawFl()}
  try{
    const r=await api('GET',SP('/files/list'),{q:{directory:dir}});
    if(S.fd!==f||!S.srv||S.srv.id!==id||gen!==f.gen)return;
    f.items=lst(r).map(mapF);f.err=null;
    const names=new Set(f.items.map(x=>x.name));[...f.sel].forEach(n=>{if(!names.has(n))f.sel.delete(n)});
  }catch(e){if(S.fd!==f||gen!==f.gen)return;if(e&&e.abort)return;f.err=fe(e);if(!quiet)f.items=null}
  f.loading=false;
  if(S.tab==='fil'&&!f.ed)drawFl();
}
function go(p){const f=S.fd;f.sel.clear();f.q='';f.lim=400;loadDir(p||'/',false)}
const selItems=()=>{const f=S.fd;return[...f.sel].map(n=>f.items.find(x=>x.name===n)).filter(Boolean)};
const FRESH=()=>{if(S.fd)loadDir(S.fd.dir,true)};

  const f=S.fd,it=f.items&&f.items.find(x=>x.name===n);if(!it)return;

}
async function fMenu(it){
  const upd=can('file.update'),cr=can('file.create'),rd=can('file.read-content'),ar=can('file.archive'),del=can('file.delete');
  const a=await menu(it.name,[
    it.file&&isText(it)&&rd&&{id:'edit',label:'Bearbeiten',icon:'edit'},
    it.file&&rd&&{id:'dl',label:'Herunterladen',icon:'down'},
    upd&&{id:'ren',label:'Umbenennen',icon:'edit'},
    upd&&{id:'mv',label:'Verschieben',icon:'folder'},
    it.file&&cr&&{id:'cp',label:'Kopie anlegen',icon:'copy'},

    it.file&&isArch(it)&&ar&&{id:'unz',label:'Entpacken',icon:'archive'},

function pickDir(start,title,okL,excl){
  return new Promise(res=>{
    let cd=start,gen=0;excl=excl||[];
    const d=dlg(`<h3>${esc(title)}</h3><p class="st" id="pp"></p><div class="list" id="pl" style="max-height:44vh;overflow:auto"></div><div class="grid2"><button class="btn" data-d="no">Abbrechen</button><button class="btn pri" data-d="ok">${esc(okL||'Hier ablegen')}</button></div>`,(a,b,close)=>{
      if(a==='no')return close(null);if(a==='ok')return close(cd);if(a==='go'){cd=b.dataset.p;load()}});
    d.done.then(res);
    async function load(){
      const g=++gen,pp=d.box.querySelector('#pp'),pl=d.box.querySelector('#pl');if(!pp||!pl)return;
      pp.innerHTML='Ziel: <b>'+esc(cd)+'</b>';pl.innerHTML='<p class="empty">Lade …</p>';
      try{
        const r=lst(await api('GET',SP('/files/list'),{q:{directory:cd}}));if(g!==gen||!pl.isConnected)return;
        const ds=r.filter(x=>!x.is_file&&!excl.includes(jn(cd,x.name))).sort((x,y)=>x.name.localeCompare(y.name,'de',{numeric:true,sensitivity:'base'}));
        const row=(p,ic,t,s)=>`<div class="item fi"><button class="itb" data-d="go" data-p="${esc(p)}"><span class="ib sm">${ico(ic,18)}</span><span class="tx"><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</span></button></div>`;
        pl.innerHTML=(cd!=='/'?row(par(cd),'back','Eine Ebene höher',par(cd)):'')+ds.map(x=>row(jn(cd,x.name),'folder',x.name)).join('')||'<p class="empty">Keine Unterordner.</p>';
      }catch(e){if(g===gen&&pl.isConnected)pl.innerHTML=`<p class="st err">${esc(fe(e))}</p>`}
    }
    load();
  });
}
async function fMove(items){
  const f=S.fd,dir=f.dir,excl=items.filter(x=>!x.file).map(x=>fPath(x.name));
  const dest=await pickDir(dir,'Verschieben nach …','Hierher verschieben',excl);
  if(dest==null||dest===dir)return;
  const files=items.map(x=>({from:rel(jn(dir,x.name)),to:rel(jn(dest,x.name))}));
  if(await act(()=>api('PUT',SP('/files/rename'),{json:{root:'/',files},timeout:60000}),items.length>1?'Verschoben':'Verschoben nach '+dest)){f.sel.clear();FRESH()}
}
async function fCopy(it){

}

async function fDelete(items){
  const n=items.length,nm=n===1?'<b>'+esc(items[0].name)+'</b>':'<b>'+n+' Einträge</b>';
  if(!await yes('Wirklich löschen?',nm+' wird unwiderruflich vom Server gelöscht'+(items.some(x=>!x.file)?' (Ordner samt Inhalt)':'')+'.','Löschen',true))return;
  if(await act(()=>api('POST',SP('/files/delete'),{json:{root:S.fd.dir,files:items.map(x=>x.name)},timeout:90000}),'Gelöscht')){S.fd.sel.clear();FRESH()}

async function fArchive(items){
  const dir=S.fd.dir;
  const b=busy('Archiv wird erstellt','Das kann bei großen Ordnern etwas dauern …');b.nocancel();
  let r=null,err=null;
  try{r=att(await api('POST',SP('/files/compress'),{json:{root:dir,files:items.map(x=>x.name)},timeout:240000}))}catch(e){err=e}
  b.close();
  if(err){if(!(err&&err.abort))await info('Das hat nicht geklappt',esc(fe(err)));return}
  if(S.fd){S.fd.sel.clear();if(S.fd.dir===dir)FRESH()}
  const v=await ask({title:'Archiv erstellt',desc:'<b>'+esc((r&&r.name)||'archiv')+'</b> liegt jetzt in <b>'+esc(dir)+'</b>.',ok:'Herunterladen',no:'Fertig'});
  if(v&&r&&r.name)fDownload(jn(dir,r.name),r.name,r.size);
}
async function fUnzip(it){
